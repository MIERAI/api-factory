review_decisions:
    - question: '一条扣款命令里,只有一部分账户有 REVERSED 的墓碑时,其他账户还扣不扣?例: transfer 9 的命令是 [ACC-001 30(有墓碑), ACC-002 20(没有墓碑)]'
      decision: 全部不扣(回滚)
    - question: '同一个转账号、同一个账户再来一条命令,但金额不一样时(例: 已经记过 transfer 7 / ACC-001 扣 50,新命令写 transfer 7 / ACC-001 扣 80),怎么处理?'
      decision: 已经直接修改了设计书
    - question: '同一条命令里既有余额不够的账户、又有不存在的账户时,结果取决于 lines 的顺序,这样可以吗?例: [NONE-1 1, ACC-002 101] 是毒消息,[ACC-002 101, NONE-1 1] 是 account.debit_failed(INSUFFICIENT_FUNDS)'
      decision: 保持现在的行为
    - question: '余额不够和账户不存在同时出现时,按哪个顺序决定结果?业务规则里原来写的是「按账户 id 的顺序」,上一轮回答加的规则写的是「按 lines 的顺序」。例: [NONE-1 扣 1, ACC-002 扣 101],按 lines 的顺序是毒消息,按账户 id 的顺序(ACC-002 在 NONE-1 前面)是 account.debit_failed(INSUFFICIENT_FUNDS)'
      decision: 已经直接修改了设计书
    - question: '一条命令里有墓碑的账户,同时另一个账户余额不够(或不存在)时,回答什么?例: transfer 9 的命令是 [ACC-001 扣 30(有墓碑), ACC-002 扣 101(余额只有 100)]'
      decision: 余额不够 / 不存在优先(保持现在的行为)
    - question: '金额和记过的不同的账户,和余额不够(或不存在)的账户在同一条命令里时,是进 DLQ(AMOUNT_MISMATCH)还是回答扣款失败?例: transfer 6 的命令是 [ACC-001 扣 41(记过的是 40), ACC-002 扣 101(余额只有 100)]'
      decision: 已经直接修改了设计书
    - question: '墓碑上的金额和扣款命令的金额不同时,是进 DLQ(AMOUNT_MISMATCH)还是回答 account.debit_failed(REVERSED)?例: transfer 9 / ACC-001 的墓碑金额是 30,迟到的扣款命令写 transfer 9 / ACC-001 扣 35'
      decision: 进 DLQ(保持现在的行为)
    - question: '同一笔转账再来一条命令,但账户和记过的不一样(多了一个账户)时,新的账户照扣吗?例: 已经记过 transfer 6 / ACC-001 扣 40,新命令写 transfer 6 [ACC-001 扣 40, ACC-002 扣 10]'
      decision: 新的账户照扣(保持现在的行为)
    - question: '同一笔转账再来、多出来的新账户余额不够时,会发出 account.debit_failed(INSUFFICIENT_FUNDS),但之前已经记过的账户仍然是扣下的状态。这和 account.debit_failed 的说明「一个账户都没扣」矛盾,该怎么定?例: 已经记过 transfer 6 / ACC-001 扣 40(HELD),新命令写 transfer 6 [ACC-001 扣 40, ACC-002 扣 101(余额只有 100)]'
      decision: 保持现在的行为,改 account.debit_failed 的说明
    - question: '同一条命令里,一个账户有墓碑(金额一致),另一个账户记过但金额不同时,回答 account.debit_failed(REVERSED) 还是进 DLQ(AMOUNT_MISMATCH)?例: transfer 9 在 ACC-001 有墓碑 30,在 ACC-002 已记 HELD 20,新命令写 transfer 9 [ACC-001 扣 30, ACC-002 扣 25]'
      decision: 金额不一致优先,进 DLQ(保持现在的行为)
    - question: '一笔转账里只有部分账户有 REVERSED 的墓碑时,没有墓碑的账户还扣不扣?例: 转账 9 的消息是 [ACC-002 扣 50, ACC-001 扣 30],只有 ACC-001 有墓碑。'
      decision: 这条命令里有墓碑的账户 → 整条命令不扣(现在的行为)
    - question: '同一个转账号、同一个账户已经记过扣款,但新命令里的金额不一样时,怎么办?例: 转账 7 在 ACC-001 已记 HELD 50,又来一条转账 7、ACC-001 扣 80 的命令。'
      decision: 死信 AMOUNT_MISMATCH(现在的行为)
    - question: '一条命令里同时有余额不够的账户和不存在的账户时,应该回答 INSUFFICIENT_FUNDS,还是当作毒消息?例: [ACC-002 扣 101, NONE-1 扣 1] 和 [NONE-1 扣 1, ACC-002 扣 101]。'
      decision: 按账户 id 的顺序决定(现在的行为)
