# 人写的式样书在 design/ledger/DebitAccounts.yaml(这个文件由设计编译器生成)
spec_version: "0.2"
api:
    rpc: factory.ledger.v1.LedgerMessageHandlerService/DebitAccounts
    owner: platform-team
    risk_level: high
    description: 转账的流程发命令过来,至少投递一次、不保证顺序。重投(同一个 id)只处理一次;同样内容的新命令(重发)也不能扣两次;撤销先到了(墓碑)就不再扣
pattern:
    kind: message
    not_found_message: ""
    order_by: []
    direction: ""
    page_size:
        default: 0
        max: 0
    command:
        ops:
            - name: 记账
              kind: insert_idempotent
              table: debits
              values:
                - column: transfer_id
                  expr: 输入.transfer_id
                - column: account_id
                  expr: 项.account_id
                - column: amount
                  expr: 项.amount
                - column: status
                  expr: "1"
                - column: debited_at
                  expr: now()
              conflict:
                - transfer_id
                - account_id
            - name: 扣款
              kind: update
              table: accounts
              key:
                - column: account_id
                  expr: 项.account_id
              values:
                - column: balance
                  expr: balance - 项.amount
                - column: held
                  expr: held + 项.amount
              cond: balance >= 项.amount
              unmet: INSUFFICIENT_FUNDS
              not_found: account not found (transfer {transfer_id})
              only: 记账.新建
        receive:
            type: account.debit
            version: 1
        each: lines
        results:
            - name: AMOUNT_MISMATCH
              when: 记账.amount <> 项.amount
              any: true
              dlq: true
            - name: REVERSED
              when: 记账.status = 3
              any: true
              emit:
                - type: account.debit_failed
                  values:
                    - column: transfer_id
                      expr: 输入.transfer_id
                    - column: reason
                      expr: '''REVERSED'''
            - name: INSUFFICIENT_FUNDS
              emit:
                - type: account.debit_failed
                  values:
                    - column: transfer_id
                      expr: 输入.transfer_id
                    - column: reason
                      expr: '''INSUFFICIENT_FUNDS'''
            - name: 成功
              emit:
                - type: account.debited
                  values:
                    - column: transfer_id
                      expr: 输入.transfer_id
                    - column: lines
                      expr: 输入.lines
        contracts:
            - type: account.debit
              kind: command
              version: 1
              subject: transfer_id
              desc: '一笔转账: 从多个账户扣款(全部或全不)'
              proto: DebitAccountsRequest
              fields:
                - name: transfer_id
                  type: 整数64
                  required: true
                  desc: 转账号
                  rules:
                    范围: 1~999999999
                - name: lines
                  type: 列表
                  required: true
                  desc: 每个账户扣多少
                  rules:
                    个数: 1~10
                  elem:
                    - name: account_id
                      type: 文本
                      required: true
                      rules:
                        格式: 代码
                        长度: 3~32
                    - name: amount
                      type: 整数64
                      required: true
                      rules:
                        范围: 1~1000000
                  unique:
                    - account_id
            - type: account.debit_failed
              kind: event
              version: 1
              subject: transfer_id
              desc: 扣款失败(这条命令没有新扣任何账户;同一笔转账以前记过的扣款不变)
              proto: AccountDebitFailedV1
              fields:
                - name: transfer_id
                  type: 整数64
                  required: true
                  desc: 转账号
                - name: reason
                  type: 文本
                  required: true
                  desc: '原因: INSUFFICIENT_FUNDS / REVERSED'
                  rules:
                    长度: 1~32
            - type: account.debited
              kind: event
              version: 1
              subject: transfer_id
              desc: 扣款成功(全部账户)
              proto: AccountDebitedV1
              fields:
                - name: transfer_id
                  type: 整数64
                  required: true
                  desc: 转账号
                - name: lines
                  type: 列表
                  required: true
                  rules:
                    个数: 1~10
                  elem:
                    - name: account_id
                      type: 文本
                      required: true
                      rules:
                        格式: 代码
                        长度: 3~32
                    - name: amount
                      type: 整数64
                      required: true
                      rules:
                        范围: 1~1000000
                  unique:
                    - account_id
datasource:
    table: ""
    filters: {}
    columns: []
    sql: ""
behavior:
    - when: 每个账户的余额都够
      then: 每个账户记一条 HELD 的扣款、余额减少、held 增加;发出 account.debited
    - when: 某个账户余额不够
      then: 一个账户都不扣、不记(前面已经扣的也回滚);发出 account.debit_failed(INSUFFICIENT_FUNDS)
    - when: 撤销先到了(有 REVERSED 的墓碑)
      then: 不扣;发出 account.debit_failed(REVERSED)
    - when: 同样内容的命令再来(新 id)
      then: 已经记过的账户不再扣(仅当 记账.新建),照样回答 account.debited;全部记过时什么都不写,照样回答
    - when: 同一笔转账、同一个账户再来,但金额和记过的不同
      then: 数据不一致,不提交,进 DLQ(AMOUNT_MISMATCH,需要人处理)
    - when: 一部分账户有 REVERSED 的墓碑、一部分没有
      then: 全部回滚(没有墓碑的账户也不扣),回答 account.debit_failed(REVERSED)
    - when: 同一条命令里既有余额不够的账户、又有不存在的账户
      then: 按账户 id 的顺序(处理时元素按账户 id 排序)先遇到哪个就是哪个的结果(先遇到不存在 = 毒消息,先遇到余额不够 = INSUFFICIENT_FUNDS);两种都是一个账户都不扣
    - when: 有墓碑的账户和余额不够(或不存在)的账户在同一条命令里
      then: 余额不够 / 不存在优先(遇到就立刻回滚);墓碑只在所有账户都处理完之后判定
    - when: 金额和记过的不同的账户,和余额不够(或不存在)的账户在同一条命令里
      then: 同一个账户上,金额不一致优先(记过的账户不会再扣,所以不会余额不够)。不同的账户,按账户 id 的顺序,先遇到余额不够 / 不存在就立刻回滚(INSUFFICIENT_FUNDS / 毒消息),后面的账户不再检查;否则全部处理完之后金额不一致 → 死信(AMOUNT_MISMATCH)。工厂现在做不到"跨账户的金额不一致优先"(GAPS G17)
    - when: 账户不存在
      then: 毒消息(进 DLQ,人来处理),什么都不写
    - when: 任一账户有 REVERSED 的墓碑
      then: 一个账户都不扣、不记(其他账户已经做的扣款也回滚);发出 account.debit_failed(REVERSED)
    - when: 命令里同时有余额不够的账户和不存在的账户
      then: 按账户 id 的顺序(处理时元素按账户 id 排序),先遇到哪个就按哪个处理(毒消息 或 account.debit_failed(INSUFFICIENT_FUNDS));什么都不写
    - when: 命令里有墓碑的账户,同时有余额不够或不存在的账户
      then: 按余额不够(account.debit_failed(INSUFFICIENT_FUNDS))或不存在(毒消息)处理;只有其他账户都能扣时,墓碑才回答 account.debit_failed(REVERSED);两种都什么都不写
    - when: 有墓碑的账户,墓碑上的金额和命令的金额不同
      then: 数据不一致,不提交,进 DLQ(AMOUNT_MISMATCH),不回答 account.debit_failed(REVERSED)
    - when: 同一笔转账再来,命令里有还没记过的账户
      then: 已经记过的账户不再扣,没记过的账户照常检查余额并扣款;都成功时发出 account.debited(lines = 这条命令的 lines)
    - when: 同一笔转账再来,新的账户余额不够(INSUFFICIENT_FUNDS)
      then: 这条命令写的东西全部回滚,发出 account.debit_failed(INSUFFICIENT_FUNDS);之前的命令已经记过的账户不受影响,仍然是 HELD。转账的流程收到 debit_failed 后,需要对这笔转账发撤销(account.reverse),把之前扣下的退回
    - when: 同一条命令里,一个账户有墓碑,另一个账户记过的金额和命令不同
      then: 死信 AMOUNT_MISMATCH(进 DLQ),不回答 account.debit_failed(REVERSED)。AMOUNT_MISMATCH 的检查排在 REVERSED 之前
    - when: 这条命令里列出的某个账户有 REVERSED 的墓碑
      then: '整条命令回滚: 一个账户都不扣、不记,回答 account.debit_failed(REVERSED)。只看命令里列出的账户。同一条命令里还有余额不够 / 不存在的账户时,余额不够 / 不存在优先(不回答 REVERSED)'
    - when: 同一转账号、同一账户已有扣款记录,新命令的金额和记录的金额不同
      then: 死信 AMOUNT_MISMATCH(进 DLQ,人来处理),什么都不写
    - when: 命令里同时有余额不够的账户和不存在的账户
      then: '按账户 id 的顺序(处理器按账户 id 排序加锁,防死锁),第一个出问题的账户决定结果: 余额不够的账户 id 在前 → account.debit_failed(INSUFFICIENT_FUNDS);不存在的账户 id 在前 → 毒消息'
