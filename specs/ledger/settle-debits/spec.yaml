                - column: transfer_id
                  expr: 输入.transfer_id
                - column: account_id
                  expr: 项.account_id
              values:
                - column: status
                  expr: "2"
              cond: status = 1
              not_found: debit not found (transfer {transfer_id})
              skip: true
            - name: 结算
              kind: update
              table: accounts
              key:
                - column: account_id
                  expr: 项.account_id
              values:
                - column: held
                  expr: held - 确认.amount
              not_found: account not found (transfer {transfer_id})
              only: 确认.已更新
        receive:
            type: account.settle
            version: 1
        each: lines
        results:
            - name: ALREADY_REVERSED
              when: 确认.status = 3
              any: true
              dlq: true
            - name: 成功
              emit:
                - type: account.settled
                  values:
                    - column: transfer_id
                      expr: 输入.transfer_id
        contracts:
            - type: account.settle
              kind: command
              version: 1
              subject: transfer_id
              desc: 结算一笔转账的扣款
              proto: SettleDebitsRequest
              fields:
                - name: transfer_id
                  type: 整数64
                  required: true
                  desc: 转账号
                  rules:
                    范围: 1~999999999
                - name: lines
                  type: 列表
                  required: true
                  desc: 要结算的账户
                  rules:
                    个数: 1~10
                  elem:
                    - name: account_id
                      type: 文本
                      required: true
                      rules:
                        格式: 代码
                        长度: 3~32
                    - name: amount
                      type: 整数64
                      required: true
                      rules:
                        范围: 1~1000000
                  unique:
                    - account_id
