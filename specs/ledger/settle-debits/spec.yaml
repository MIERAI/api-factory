spec_version: "0.2"
api:
    rpc: factory.ledger.v1.LedgerMessageHandlerService/SettleDebits
    owner: platform-team
    risk_level: high
    description: 转账成功之后结算。重复的结算不能减两次;结算时发现扣款已撤销是不该发生的异常,不能悄悄成功
pattern:
    kind: message
    not_found_message: ""
    order_by: []
    direction: ""
    page_size:
        default: 0
        max: 0
    command:
        ops:
            - name: 确认
              kind: update
              table: debits
              key:
                - column: transfer_id
                  expr: 输入.transfer_id
                - column: account_id
                  expr: 项.account_id
              values:
                - column: status
                  expr: "2"
              cond: status = 1
              not_found: debit not found (transfer {transfer_id})
              skip: true
            - name: 结算
              kind: update
              table: accounts
              key:
                - column: account_id
                  expr: 项.account_id
              values:
                - column: held
                  expr: held - 确认.amount
              cond: held >= 确认.amount
              unmet: HELD_SHORT
              not_found: account not found (transfer {transfer_id})
              only: 确认.已更新
        receive:
            type: account.settle
            version: 1
        each: lines
        results:
            - name: HELD_SHORT
              dlq: true
            - name: AMOUNT_MISMATCH
              when: 确认.amount <> 项.amount
              any: true
              dlq: true
            - name: ALREADY_REVERSED
              when: 确认.status = 3
              any: true
              dlq: true
            - name: 成功
              emit:
                - type: account.settled
                  values:
                    - column: transfer_id
                      expr: 输入.transfer_id
        contracts:
            - type: account.settle
              kind: command
              version: 1
              subject: transfer_id
              desc: 结算一笔转账的扣款
              proto: SettleDebitsRequest
              fields:
                - name: transfer_id
                  type: 整数64
                  required: true
                  desc: 转账号
                  rules:
                    范围: 1~999999999
                - name: lines
                  type: 列表
                  required: true
                  desc: 要结算的账户
                  rules:
                    个数: 1~10
                  elem:
                    - name: account_id
                      type: 文本
                      required: true
                      rules:
                        格式: 代码
                        长度: 3~32
                    - name: amount
                      type: 整数64
                      required: true
                      rules:
                        范围: 1~1000000
                  unique:
                    - account_id
            - type: account.settled
              kind: event
              version: 1
              subject: transfer_id
              desc: 结算完成
              proto: AccountSettledV1
              fields:
                - name: transfer_id
                  type: 整数64
                  required: true
                  desc: 转账号
datasource:
    table: ""
    filters: {}
    columns: []
    sql: ""
behavior:
    - when: 扣款是 HELD
      then: 改成 SETTLED,held 减少扣款的金额
    - when: 已经结算过
      then: 跳过(重发),照样发出 account.settled
    - when: 扣款已经撤销
      then: 不提交,进 DLQ(ALREADY_REVERSED,需要人处理)
    - when: 没有这笔扣款
      then: 毒消息(DLQ),什么都不写,不发出 account.settled
    - when: 消息里的金额和扣款记录的金额不同
      then: 不提交,进 DLQ(AMOUNT_MISMATCH)
    - when: 账户的 held 比要结算的扣款金额少
      then: 不提交,进 DLQ(HELD_SHORT,数据不一致,需要人处理)
    - when: 一笔转账有的账户是 HELD、有的已撤销
      then: 整条消息都不提交(HELD 的也保持 HELD),进 DLQ(ALREADY_REVERSED)
