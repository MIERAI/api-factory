datasource:
    table: ""
    filters: {}
    columns: []
    sql: ""
behavior:
    - when: 扣款是 HELD
      then: 改成 SETTLED,held 减少扣款的金额
    - when: 已经结算过
      then: 跳过(重发),照样发出 account.settled
    - when: 扣款已经撤销
      then: 不提交,进 DLQ(ALREADY_REVERSED,需要人处理)
    - when: 没有这笔扣款
      then: 毒消息(DLQ)
