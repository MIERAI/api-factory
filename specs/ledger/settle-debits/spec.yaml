review_decisions:
    - question: '消息里每项的 amount 和 debits 里记录的金额不一样时(例: 消息写 ACC-001 结算 40,扣款记录是 50),要怎么处理?'
      decision: 已经直接修改了设计书
    - question: '账户的 held 比要结算的扣款金额少时(例: held 是 20,扣款 50),要怎么处理?'
      decision: 已经直接修改了设计书
    - question: '已经结算过的扣款再收到结算消息、但消息里的金额和扣款记录不同时,是照样成功(跳过并发出 account.settled),还是进 DLQ(AMOUNT_MISMATCH)?例: transfer 6 的 ACC-001 已经 SETTLED,金额 20;重发的消息写 amount 15。'
      decision: 保持现在的行为(金额不同 → 死信)
    - question: '一条消息同时满足几个死信原因时,记成哪一个?例: transfer 7 的 ACC-001 扣款记录是 50(HELD),消息写 40,账户的 held 只有 45。这时结算会因为 held 不够失败(HELD_SHORT),而金额也不一致(AMOUNT_MISMATCH)。'
      decision: 已经直接修改了设计书
    - question: '消息里只列出了这笔转账的一部分账户时,没列出的扣款要怎么处理?例: transfer 8 在 ACC-001 和 ACC-002 上都有 HELD 的扣款,结算消息只写了 ACC-002。'
      decision: 保持现在的行为(只结算列出的账户)
    - question: '一条消息里有的账户已撤销、有的账户根本没有这笔扣款时,应该记成毒消息,还是 ALREADY_REVERSED?例: transfer 8 的结算消息写了 ACC-001(扣款已撤销)和 ACC-003(没有 transfer 8 的扣款)。'
      decision: 保持现在的行为(找不到扣款最优先 → 毒消息)
    - question: '消息里只列出了 HELD 的账户、而这笔转账在没列出的账户上已经撤销时,是照样结算成功,还是进 DLQ(ALREADY_REVERSED)?例: transfer 8 的 ACC-001 已撤销、ACC-002 是 HELD,消息只写了 { ACC-002, 5 }。'
      decision: 保持现在的行为(只看消息里列出的账户)
