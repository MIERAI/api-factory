# 人写的式样书在 design/ledger/SettleDebits.yaml(这个文件由设计编译器生成)
spec_version: "0.2"
api:
    rpc: factory.ledger.v1.LedgerMessageHandlerService/SettleDebits
    owner: platform-team
    risk_level: high
    description: 转账成功之后结算。重复的结算不能减两次;结算时发现扣款已撤销是不该发生的异常,不能悄悄成功
pattern:
    kind: message
    not_found_message: ""
    order_by: []
    direction: ""
    page_size:
        default: 0
        max: 0
    command:
        ops:
            - name: 确认
              kind: update
              table: debits
              key:
                - column: transfer_id
                  expr: 输入.transfer_id
                - column: account_id
                  expr: 项.account_id
              values:
                - column: status
                  expr: "2"
              cond: status = 1
              not_found: debit not found (transfer {transfer_id})
              skip: true
            - name: 检查
              kind: update
              table: accounts
              key:
                - column: account_id
                  expr: 项.account_id
              values:
                - column: held
                  expr: held
              cond: held >= 确认.amount
              not_found: account not found (transfer {transfer_id})
              only: 确认.已更新
              skip: true
            - name: 结算
              kind: update
              table: accounts
              key:
                - column: account_id
                  expr: 项.account_id
              values:
                - column: held
                  expr: held - 确认.amount
              not_found: account not found (transfer {transfer_id})
              only: 检查.已更新
        receive:
            type: account.settle
            version: 1
        each: lines
        results:
            - name: ALREADY_REVERSED
              when: 确认.status = 3
              any: true
              dlq: true
            - name: AMOUNT_MISMATCH
              when: 确认.amount <> 项.amount
              any: true
              dlq: true
            - name: HELD_SHORT
              when: 检查.held < 确认.amount
              any: true
              dlq: true
            - name: 成功
              emit:
                - type: account.settled
                  values:
                    - column: transfer_id
                      expr: 输入.transfer_id
        contracts:
            - type: account.settle
              kind: command
              version: 1
              subject: transfer_id
              desc: 结算一笔转账的扣款
              proto: SettleDebitsRequest
              fields:
                - name: transfer_id
                  type: 整数64
                  required: true
                  desc: 转账号
                  rules:
                    范围: 1~999999999
                - name: lines
                  type: 列表
                  required: true
                  desc: 要结算的账户
                  rules:
                    个数: 1~10
                  elem:
                    - name: account_id
                      type: 文本
                      required: true
                      rules:
                        格式: 代码
                        长度: 3~32
                    - name: amount
                      type: 整数64
                      required: true
                      rules:
                        范围: 1~1000000
                  unique:
                    - account_id
            - type: account.settled
              kind: event
              version: 1
              subject: transfer_id
              desc: 结算完成
              proto: AccountSettledV1
              fields:
                - name: transfer_id
                  type: 整数64
                  required: true
                  desc: 转账号
datasource:
    table: ""
    filters: {}
    columns: []
    sql: ""
behavior:
    - when: 扣款是 HELD
      then: 改成 SETTLED,held 减少扣款的金额
    - when: 已经结算过
      then: 跳过(重发),照样发出 account.settled
    - when: 扣款已经撤销
      then: 不提交,进 DLQ(ALREADY_REVERSED,需要人处理)
    - when: 没有这笔扣款
      then: 毒消息(DLQ),什么都不写,不发出 account.settled
    - when: 消息里的金额和扣款记录的金额不同
      then: 不提交,进 DLQ(AMOUNT_MISMATCH)
    - when: 账户的 held 比要结算的扣款金额少
      then: 不提交,进 DLQ(HELD_SHORT,数据不一致,需要人处理)
    - when: 同时有几个死信的原因(例如金额不一致而且 held 不够)
      then: 按 撤销(ALREADY_REVERSED)→ 金额(AMOUNT_MISMATCH)→ held(HELD_SHORT)的顺序取第一个
    - when: 已经结算过、但消息里的金额和扣款记录不同
      then: 进 DLQ(AMOUNT_MISMATCH)
    - when: 一笔转账有的账户是 HELD、有的已撤销
      then: 整条消息都不提交(HELD 的也保持 HELD),进 DLQ(ALREADY_REVERSED)
    - when: 扣款已经结算过,但消息里的金额和扣款记录的金额不同
      then: 不提交,进 DLQ(AMOUNT_MISMATCH),不发出 account.settled
    - when: 消息里没有列出这笔转账的某些账户
      then: 只结算列出的账户,照样发出 account.settled;没列出的扣款保持原样(由发消息的一方保证列全)
    - when: 消息里有任一账户找不到这笔转账的扣款(不管其他账户是否已撤销、金额是否不同、held 是否不够)
      then: 整条消息按毒消息处理(DLQ),什么都不写,不发出 account.settled;不再判定 ALREADY_REVERSED / AMOUNT_MISMATCH / HELD_SHORT
    - when: 这笔转账在消息里没有列出的账户上有已撤销的扣款,而列出的账户都是 HELD
      then: 只按列出的账户判定:照样结算列出的账户,发出 account.settled。「有的 HELD、有的已撤销 → 整条不提交」只适用于消息里列出的账户(由发消息的一方保证列全)
