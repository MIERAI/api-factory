# 人写的式样书在 design/ledger/ReverseDebits.yaml(这个文件由设计编译器生成)
spec_version: "0.2"
api:
    rpc: factory.ledger.v1.LedgerMessageHandlerService/ReverseDebits
    owner: platform-team
    risk_level: high
    description: '转账失败时的补偿。不保证顺序: 撤销可能先于扣款到达。重复的撤销不能退两次'
pattern:
    kind: message
    not_found_message: ""
    order_by: []
    direction: ""
    page_size:
        default: 0
        max: 0
    command:
        ops:
            - name: 墓碑
              kind: insert_idempotent
              table: debits
              values:
                - column: transfer_id
                  expr: 输入.transfer_id
                - column: account_id
                  expr: 项.account_id
                - column: amount
                  expr: 项.amount
                - column: status
                  expr: "3"
                - column: debited_at
                  expr: now()
              conflict:
                - transfer_id
                - account_id
            - name: 撤销
              kind: update
              table: debits
              key:
                - column: transfer_id
                  expr: 输入.transfer_id
                - column: account_id
                  expr: 项.account_id
              values:
                - column: status
                  expr: "3"
              cond: status = 1
              not_found: debit not found (transfer {transfer_id})
              skip: true
            - name: 检查
              kind: update
              table: accounts
              key:
                - column: account_id
                  expr: 项.account_id
              values:
                - column: held
                  expr: held
              cond: held >= 撤销.amount
              not_found: account not found (transfer {transfer_id})
              only: 撤销.已更新
              skip: true
            - name: 退回
              kind: update
              table: accounts
              key:
                - column: account_id
                  expr: 项.account_id
              values:
                - column: balance
                  expr: balance + 撤销.amount
                - column: held
                  expr: held - 撤销.amount
              not_found: account not found (transfer {transfer_id})
              only: 检查.已更新
        receive:
            type: account.reverse
            version: 1
        each: lines
        results:
            - name: ALREADY_SETTLED
              when: 撤销.status = 2
              any: true
              dlq: true
            - name: HELD_SHORT
              when: 检查.held < 撤销.amount
              any: true
              dlq: true
            - name: 成功
              emit:
                - type: account.reversed
                  values:
                    - column: transfer_id
                      expr: 输入.transfer_id
        contracts:
            - type: account.reverse
              kind: command
              version: 1
              subject: transfer_id
              desc: 撤销一笔转账的扣款(补偿)
              proto: ReverseDebitsRequest
              fields:
                - name: transfer_id
                  type: 整数64
                  required: true
                  desc: 转账号
                  rules:
                    范围: 1~999999999
                - name: lines
                  type: 列表
                  required: true
                  desc: 要撤销的账户和金额(和扣款时相同)
                  rules:
                    个数: 1~10
                  elem:
                    - name: account_id
                      type: 文本
                      required: true
                      rules:
                        格式: 代码
                        长度: 3~32
                    - name: amount
                      type: 整数64
                      required: true
                      rules:
                        范围: 1~1000000
                  unique:
                    - account_id
            - type: account.reversed
              kind: event
              version: 1
              subject: transfer_id
              desc: 撤销完成
              proto: AccountReversedV1
              fields:
                - name: transfer_id
                  type: 整数64
                  required: true
                  desc: 转账号
datasource:
    table: ""
    filters: {}
    columns: []
    sql: ""
behavior:
    - when: 扣款是 HELD
      then: 改成 REVERSED,按扣款记录的金额退回余额、held 减少
    - when: 扣款还没到
      then: 留下 REVERSED 的墓碑(不动余额)
    - when: 已经撤销过(另发的第二条撤销)
      then: 跳过(不动余额),照样发出 account.reversed
    - when: 某个账户的扣款已经结算(SETTLED)
      then: 整条消息不提交,进 DLQ(ALREADY_SETTLED,需要人处理。钱已经结算,不能自动退)
    - when: 消息里的金额和扣款记录的金额不同
      then: 按扣款记录的金额退回(消息里的金额只用于墓碑)
    - when: 扣款是 HELD,但账户的 held 比扣款金额少
      then: 整条消息不提交,进 DLQ(HELD_SHORT,数据不一致,需要人处理)
    - when: 一个账户的扣款已经结算、另一个是 HELD 或者还没到
      then: 整条消息都不提交(HELD 的不退回,没到的也不留墓碑),进 DLQ(ALREADY_SETTLED)
    - when: 撤销完成
      then: 发出 account.reversed
    - when: 消息里的金额和扣款记录的金额不同
      then: 按扣款记录的金额退回余额、减少 held;消息里的金额只用于没到的扣款的墓碑
