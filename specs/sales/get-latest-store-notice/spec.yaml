      then: そのお知らせは対象外。残りのうち掲載日が一番新しいものを返す
    - when: 掲載日が今日(Asia/Tokyo)より後のお知らせがある
      then: 対象外。掲載日が今日以前のうち一番新しいものを返す(今日の掲載日は含む)
