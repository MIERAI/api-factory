    not_found_message: ""
    order_by:
        - posted_ymd
        - notice_no
    direction: desc
    page_size:
        default: 0
        max: 0
    params:
        "n": 1
datasource:
    table: store_notices
    filters:
        store_code:
            column: store_code
            op: eq
    columns: []
    where:
        - posted_ymd <= 今天
    time_zone: Asia/Tokyo
    sql: ""
behavior:
    - when: 掲載日が一番新しいお知らせが削除・論理削除された
      then: 残っているお知らせのうち掲載日が一番新しいもの
    - when: 同じ掲載日のお知らせが複数
      then: お知らせ番号が大きいもの
