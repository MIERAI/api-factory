spec_version: "0.2"
api:
    rpc: factory.sales.v1.SaleService/ListStorePriceNames
    owner: sales-team
    risk_level: low
    description: 店舗の売価確認画面。商品名は店舗の DB にある商品マスタ(店舗ごとに表示名が違う)から引く。 商品マスタに無い商品も売価は表示する(商品名が空)。商品コードの先頭・商品名で絞れる。絞った後で 300 件を超えるときは エラーにして、さらに絞ってもらう(絞った後が 300 件以下なら店舗全体の件数は問わない)
pattern:
    kind: list_all
    not_found_message: ""
    order_by:
        - product_code
        - valid_from
    direction: mixed
    directions:
        - asc
        - desc
    page_size:
        default: 0
        max: 0
    max_rows: 300
datasource:
    table: store_prices
    filters:
        product_name:
            column: product_name
            op: eq
        product_prefix:
            column: product_code
            op: prefix
        store_code:
            column: store_code
            op: eq
    columns: []
    lookups:
        - name: product
          table: local_products
          "on":
            - product_code = product_code
          columns:
            - name: product_name
              from: name
          missing: keep
    sql: ""
behavior:
    - when: 店舗の商品マスタに無い商品
      then: 売価は返す。商品名は空
    - when: 絞った後の売価が 300 件を超える
      then: エラー(FAILED_PRECONDITION)。途中で切り捨てない
    - when: product_prefix・product_name で絞った後の売価が 300 件を超える
      then: エラー(FAILED_PRECONDITION)。絞った後が 300 件以下なら、店舗全体で 300 件を超えていても全件を返す
    - when: 指定した店舗コードの DB が無い(存在しない店舗)
      then: エラーにせず、空の一覧を返す(売価の無い店舗と同じ扱い)
