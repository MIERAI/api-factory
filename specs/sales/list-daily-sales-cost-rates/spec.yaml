spec_version: "0.2"
api:
    rpc: factory.sales.v1.SaleService/ListDailySalesCostRates
    owner: sales-team
    risk_level: medium
    description: 粗利の見込み計算。原価率は改定すると行が増える履歴(区分 STD = 通常 / SALE = 特売。ここでは通常だけ)。 ある日の原価率 = その日に有効な改定(開始日 ≤ その日、最終日が入っていればその日 ≤ 最終日)のうち開始日が一番新しいもの。 期間限定の改定(最終日あり)が終わった翌日からは、その前から続いている改定に戻る。今日 = 店舗のある日本の日付。 1 回の要求は最大 62 日分(超えたらエラーにして期間を短くしてもらう)
pattern:
    kind: list_all
    not_found_message: ""
    order_by:
        - sales_date
    direction: asc
    page_size:
        default: 0
        max: 0
    max_rows: 62
datasource:
    table: daily_sales
    filters:
        from:
            column: sales_date
            op: gte
        store_code:
            column: store_code
            op: eq
        to:
            column: sales_date
            op: lte
    columns: []
    lookups:
        - name: std_rate
          table: store_cost_rates
          "on":
            - store_code = store_code
            - rate_kind = 'STD'
          columns:
            - name: cost_rate
              from: cost_rate
            - name: rate_from
              from: valid_from
          missing: keep
          as_of:
            start: valid_from
            end: valid_to
            end_inclusive: true
            ref: sales_date
        - name: current_rate
          table: store_cost_rates
          "on":
            - store_code = store_code
            - rate_kind = 'STD'
          columns:
            - name: current_cost_rate
              from: cost_rate
          missing: keep
          as_of:
            start: valid_from
            end: valid_to
            end_inclusive: true
            ref: 今天
    time_zone: Asia/Tokyo
    sql: ""
behavior:
    - when: 売上日が改定の開始日と同じ
      then: その改定の原価率(開始日は含む)
    - when: 売上日が改定の最終日と同じ
      then: その改定の原価率(最終日は含む)
    - when: 期間限定の改定が終わった後の日
      then: その日に有効な改定(前から続いている改定)の原価率。有効な改定がなければ原価率なし
    - when: 特売(SALE)の原価率
      then: 使わない(通常 STD だけ)
    - when: 期間内の売上が 62 日分を超える
      then: エラー(FAILED_PRECONDITION)。途中で切り捨てない
    - when: 期間(from〜to、または to 省略)の中に売上の行が 62 件以下
      then: 期間の長さに関係なく全部返す。売上のない日は数えない。63 件以上なら FAILED_PRECONDITION
