    owner: sales-team
    risk_level: medium
    description: 売価変更の前日チェック画面。件数のバランスと、変化の大きすぎる指示がないかを見る
pattern:
    kind: compute
    not_found_message: ""
    order_by: []
    direction: ""
    page_size:
        default: 0
        max: 0
datasource:
    table: price_changes
    filters:
        proc_date:
            column: proc_date
            op: eq
        store_code:
            column: store_code
            op: eq
    columns:
        - product_code
        - new_price
        - old_price
        - deal_id
    sql: ""
behavior:
    - when: 分類(1 件は 1 つにだけ数える。上から順に判定)
      then: |-
        新売価が空 → 未定
        旧売価が空 → 新規
        新売価 > 旧売価 → 値上げ / 新売価 < 旧売価 → 値下げ / 同じ → 据え置き
    - when: 強制送信
      then: 取引ID が 99999999 の件数。分類とは別に数える(据え置きでも強制送信でもある、など重なってよい)
    - when: 変化率
      then: (新売価 - 旧売価) / 旧売価。新売価・旧売価の両方があり、旧売価 > 0 の指示だけが対象(旧売価 0 は対象外)
    - when: 平均・最大
      then: 変化率の平均、変化率が正のものの最大。どちらも小数 4 位に四捨五入(0.5 は 0 から遠い方へ)。対象がなければ設定しない
    - when: 警告
      then: |-
        指示がない → NO_DATA
        変化率の絶対値が 0.3 以上の指示が 1 件でもある → LARGE_CHANGE(ちょうど 30% も含む)
        それ以外 → NONE
