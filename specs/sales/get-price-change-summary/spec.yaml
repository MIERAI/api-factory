spec_version: "0.2"
api:
    rpc: factory.sales.v1.SaleService/GetPriceChangeSummary
    owner: sales-team
    risk_level: medium
    description: 売価変更の前日チェック画面。件数のバランスと、変化の大きすぎる指示がないかを見る
pattern:
    kind: compute
    not_found_message: ""
    order_by: []
    direction: ""
    page_size:
        default: 0
        max: 0
datasource:
    table: price_changes
    filters:
        proc_date:
            column: proc_date
            op: eq
        store_code:
            column: store_code
            op: eq
    columns:
        - product_code
        - new_price
        - old_price
        - deal_id
    sql: ""
behavior:
    - when: 分類(1 件は 1 つにだけ数える。上から順に判定)
      then: |-
        新売価が空 → 未定
        旧売価が空 → 新規
        新売価 > 旧売価 → 値上げ / 新売価 < 旧売価 → 値下げ / 同じ → 据え置き
    - when: 強制送信
      then: 取引ID が 99999999 の件数。分類とは別に数える(据え置きでも強制送信でもある、など重なってよい)
    - when: 変化率
      then: (新売価 - 旧売価) / 旧売価。新売価・旧売価の両方があり、旧売価 > 0 の指示だけが対象(旧売価 0 は対象外)
    - when: 平均・最大
      then: |-
        変化率の平均、変化率が正のものの最大。どちらも小数 4 位に四捨五入(0.5 は 0 から遠い方へ)。対象がなければ設定しない。
        四捨五入は正確な値(十进制)で行う: 浮動小数で計算すると 3 / 20000 = 0.00015 が 0.000149999… になり 0.0001 になってしまう
        平均は各指示の四捨五入する前の変化率を平均し、最後に 1 回だけ四捨五入する。四捨五入の結果が 0 なら符号のない 0(-0 にしない)
    - when: 警告
      then: |-
        指示がない → NO_DATA
        変化率の絶対値が 0.3 以上の指示が 1 件でもある → LARGE_CHANGE(ちょうど 30% も、ちょうど -30% も含む)。
        判定は四捨五入する前の変化率で行う(0.299994 は表示が 0.3 でも警告しない)
        それ以外 → NONE
    - when: 警告の判定
      then: 四捨五入する前の変化率の絶対値で 0.3 以上かを判定する(0.299994… は 0.3 未満なので警告しない。表示される最大の値上げ率が 0.3 でも NONE になりうる)
    - when: 最大の値上げ率の対象の判定
      then: '四捨五入する前の変化率が 0 より大きい指示を対象にする。四捨五入した結果が 0 になっても設定し、値は 0 にする(例: 30000 → 30001 だけなら 最大の値上げ率 = 0)'
    - when: 変化率の平均を計算するとき
      then: '各指示の変化率は 分子(新売価 - 旧売価)/ 分母(旧売価)の分数のまま誤差なく扱い、合計を件数で割った正確な値を最後に 1 回だけ小数 4 位に四捨五入する(例: 300→400 が 3 件と 5000→5001 が 1 件なら 平均 = 0.25005 → 0.2501)'
