review_decisions:
    - question: '警告の「0.3 以上」は、四捨五入する前の変化率で判定しますか、それとも小数 4 位に四捨五入した後の変化率で判定しますか?(例: 旧売価 33334 → 新売価 43334 は変化率 0.299994…。四捨五入すると 0.3 になり、画面の「最大の値上げ率」には 0.3 と表示される)'
      decision: 四捨五入前の値で判定
    - question: '「最大の値上げ率」の対象となる「変化率が正のもの」は、四捨五入する前の値で正かどうかを判定しますか?それとも四捨五入した後の値で判定しますか?(例: 旧売価 30000 → 新売価 30001 だけの日は、変化率が 0.0000333… で、四捨五入すると 0.0000 になる。この場合、最大の値上げ率を 0 として設定するか、設定しないか)'
      decision: 四捨五入前の値で判定(0 を設定する)
    - question: '割り切れない変化率(例: 旧売価 300 → 新売価 400 の 1/3)を平均するとき、分数のまま誤差なく計算しますか、それとも小数の桁数を決めて計算しますか?(例: 300→400 が 3 件と 5000→5001(0.0002)が 1 件の日。正確に計算すると平均は (1/3×3 + 0.0002) / 4 = 0.25005 なので 0.2501 になる。1/3 を小数 16 桁(0.3333333333333333)で計算すると平均は 0.2500499999… になり、0.2500 になる)'
      decision: 分数のまま正確に計算する
