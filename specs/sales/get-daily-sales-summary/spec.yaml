review_decisions:
    - question: 金额合计的小数部分怎么显示?例如店 1(100.50)和店 2(200)合计是 "300.5" 还是 "300.50";純売上 350.75 - 1.75 是 "349" 还是 "349.00"?
      decision: 去掉末尾多余的 0
    - question: 値引き率正好在四舍五入的临界点时(例如 total_discount 0.5、total_amount 10000,率 = 0.00005)怎么算:先用十进制精确相除再进位,还是先转成小数(浮点)再进位?
      decision: 十进制精确计算
