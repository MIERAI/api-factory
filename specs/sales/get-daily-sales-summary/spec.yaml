spec_version: "0.2"
api:
    rpc: factory.sales.v1.SaleService/GetDailySalesSummary
    owner: sales-team
    risk_level: medium
    description: 日次の本部ダッシュボード。金額は十进制のまま正確に集計する(浮動小数の誤差を出さない)
pattern:
    kind: compute
    not_found_message: ""
    order_by: []
    direction: ""
    page_size:
        default: 0
        max: 0
datasource:
    table: daily_sales
    filters:
        sales_date:
            column: sales_date
            op: eq
        store_codes:
            column: store_code
            op: in
    columns:
        - store_code
        - amount
        - discount
        - closed_on
    sql: ""
behavior:
    - when: 合計
      then: 売上金額と値引き額をそれぞれ合計する。値引き額が空の行は 0。十进制のまま計算する(浮動小数に変換しない)
    - when: 純売上
      then: total_amount - total_discount
    - when: 値引き率
      then: total_discount / total_amount を小数 4 位に四捨五入(0.5 は 0 から遠い方へ)。total_amount が 0 のときは設定しない
    - when: 締めの状況
      then: |-
        行がない → NO_DATA
        締め日(closed_on)が空の店が 1 つでもある → OPEN
        すべて締め済み → CLOSED
    - when: 输出 total_amount、total_discount、net_amount
      then: 按十进制的值输出,去掉小数部分末尾的 0,整数不带小数点(300.50 → "300.5",349.00 → "349",0 → "0")
    - when: 计算値引き率
      then: 用十进制精确相除,在十进制上按 0.5 向远离 0 的方向舍入到小数 4 位,最后才转成小数(例:0.5 / 10000 = 0.00005 → 0.0001)
