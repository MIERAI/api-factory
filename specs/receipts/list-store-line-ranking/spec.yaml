spec_version: "0.2"
api:
    rpc: factory.receipts.v1.ReceiptService/ListStoreLineRanking
    owner: receipts-team
    risk_level: low
    description: 店舗の稼働ランキング。順位は SQL の RANK() と同じ決め方。店舗数は 1000 店以下の前提
pattern:
    kind: list_all
    not_found_message: ""
    order_by:
        - rank
        - store_code
    direction: asc
    page_size:
        default: 0
        max: 0
    max_rows: 1000
    group:
        keys:
            - store_code
        aggs:
            - name: lines
              func: count
            - name: quantity
              func: sum
              column: quantity
    rank:
        order:
            - lines desc
        as: rank
datasource:
    table: sales_lines
    filters:
        date_from:
            column: sales_date
            op: gte
    columns: []
    sql: ""
behavior:
    - when: 対象の店
      then: 期間内に明細が 1 件以上ある店だけ(明細のない店は順位をつけない)
    - when: 同じ順位の並び
      then: 同じ順位の店は店舗コードの小さい順
    - when: 店舗が 1000 店を超える
      then: エラー(FAILED_PRECONDITION)。途中で切り捨てない(順位の途中で切れた一覧は全店のランキングと誤解されるため)。店舗数が増えたら上限を見直す
