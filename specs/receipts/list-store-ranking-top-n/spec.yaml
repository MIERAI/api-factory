spec_version: "0.2"
api:
    rpc: factory.receipts.v1.ReceiptService/ListStoreRankingTopN
    owner: receipts-team
    risk_level: low
    description: 日次ランキングの表彰対象の抽出。順位は SQL の RANK() と同じ決め方(同額は同順位、次の順位は飛ばす)。 「上位 N 店で打ち切り」(前N条)と違い、N 位と同額の店を落とさない。合計の下限を指定すると、順位をつけたあとで下限未満の店を除く (順位は下限で除く前の全店の中での順位のまま)。1 日の店舗数は 1000 店以下の前提
pattern:
    kind: list_all
    not_found_message: ""
    order_by:
        - rank
        - store_code
    direction: asc
    page_size:
        default: 0
        max: 0
    max_rows: 1000
    group:
        keys:
            - store_code
        aggs:
            - name: total
              func: sum
              column: amount
            - name: lines
              func: count
    rank:
        order:
            - total desc
        as: rank
datasource:
    table: sales_lines
    filters:
        min_total:
            column: total
            op: gte
            grouped: true
        sales_date:
            column: sales_date
            op: eq
        top_n:
            column: rank
            op: lte
            grouped: true
    columns: []
    sql: ""
behavior:
    - when: N 位に同額の店が複数ある
      then: 全部返す(N 店を超えてもよい)。例 合計 10, 8, 8, 5 で top_n = 2 → 順位 1, 2, 2 の 3 店
    - when: N 位の直前で同額が切れる
      then: 順位は飛ぶので、N 位の店がいないことがある。例 合計 10, 8, 8, 5 で top_n = 3 → 順位 1, 2, 2 の 3 店(4 位の店は入らない)
    - when: 合計の下限
      then: 順位は全店で決めてから、合計が下限未満の店を除く(除いても順位は詰めない)
    - when: 明細のない売上日
      then: 空の一覧
    - when: 結果が 1000 店を超える
      then: エラー(FAILED_PRECONDITION)。途中で切り捨てない
