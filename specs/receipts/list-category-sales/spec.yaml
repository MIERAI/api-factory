spec_version: "0.2"
api:
    rpc: factory.receipts.v1.ReceiptService/ListCategorySales
    owner: receipts-team
    risk_level: low
    description: 部門別の売上分析。部門名は大文字・小文字を区別する(Food と food は別の部門)。部門は未分類を含めて 1 店あたり 100 行以下の前提
pattern:
    kind: list_all
    not_found_message: ""
    order_by:
        - store_code
        - category
    direction: asc
    page_size:
        default: 0
        max: 0
    max_rows: 1000
    group:
        keys:
            - store_code
            - category
        aggs:
            - name: total
              func: sum
              column: amount
            - name: lines
              func: count
            - name: min_discount
              func: min
              column: discount
            - name: max_discount
              func: max
              column: discount
datasource:
    table: sales_lines
    filters:
        store_codes:
            column: store_code
            op: in
    columns: []
    sql: ""
behavior:
    - when: 未分類
      then: 部門が空(NULL)の明細は、店ごとに 1 つの「未分類」の行にまとめる(空ごとに別の行にしない)。未分類の行は category を設定せず、その店の最後に並べる。部門の空文字は DB が受け付けない(領域の規則)
    - when: 値引きのない明細
      then: 値引き額が空の明細(値引きなし)は最小・最大の計算に入れない。値引き額 0 は DB が受け付けない(値引きなしは空で表す)
    - when: 部門の並び
      then: 部門名のバイト順(大文字が小文字より先。Food → food の順)
    - when: 行数が 1000 を超える
      then: エラー(FAILED_PRECONDITION)。切り捨てない。10 店 × 100 行(未分類の行を含む)= 1000 行が前提の上限
    - when: 明細のない店
      then: 行を返さない(合計 0 の行は作らない)
