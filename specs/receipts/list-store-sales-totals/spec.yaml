    owner: receipts-team
    risk_level: low
    description: 全店の集計一覧。店舗数が多いのでページ送りする(ページの位置は店舗コード)
pattern:
    kind: list_keyset
    not_found_message: ""
    order_by:
        - store_code
    direction: asc
    page_size:
        default: 20
        max: 100
    group:
        keys:
            - store_code
        aggs:
            - name: total
              func: sum
              column: amount
            - name: lines
              func: count
            - name: first_date
              func: min
              column: sales_date
            - name: max_discount
              func: max
              column: discount
