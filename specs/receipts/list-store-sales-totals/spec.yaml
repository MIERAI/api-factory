    table: sales_lines
    filters:
        date_from:
            column: sales_date
            op: gte
    columns: []
    sql: ""
behavior:
    - when: 売上日の下限
      then: 下限以降の明細だけを集計する(合計・件数・最初の売上日・最大の値引き額すべて、絞り込んだ明細で求める)。部門は問わない(未分類の明細も含む)
    - when: 値引きのない明細
      then: 値引き額が空の明細は最大の計算に入れない。値引き額 0 は DB が受け付けない(値引きなしは空で表す)
    - when: 対象の店
      then: 対象の明細が 1 件以上ある店だけ。売上金額がすべて 0 の明細しかない店も 合計 "0" として出す(明細のない店の行は作らない)
