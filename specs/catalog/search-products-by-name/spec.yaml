    description: 店頭端末の商品検索。入力は商品名の一部(どこに含まれていてもよい)。% や _ は普通の文字として探す (「50%」は「50%オフ」に一致し、「50円」には一致しない)。大文字・小文字は区別する。 部分一致は btree の索引が使えない(全件を見る)ので、カテゴリ(必須)で件数を絞ってから探す。商品数はカテゴリあたり数千件以下の前提
pattern:
