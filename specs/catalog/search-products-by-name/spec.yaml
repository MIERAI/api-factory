    table: product_master
    filters:
        category:
            column: category
            op: eq
        keyword:
            column: name
            op: contains
    columns: []
    sql: ""
behavior:
    - when: 商品名の一部に一致
      then: 先頭・途中・末尾のどこに含まれていても返す(前方一致ではない)
    - when: '% や _ を含むキーワード'
      then: 文字として探す(ワイルドカードにしない)
    - when: 商品名が空(未登録)の商品
      then: 一致しない
    - when: 削除・論理削除された商品、古い版の商品名
      then: 一致しない(現在の値だけを探す)
    - when: 一致が 100 件を超える
      then: エラー(FAILED_PRECONDITION)。途中で切り捨てない(キーワードを長くして絞ってもらう)
