behavior:
    - when: 改定の開始日・最終日が存在しない日付(20260230 など)
      then: その改定は使わない(最終日だけが不正でも使わない。無期限扱いにしない)
    - when: 期間限定の改定(最終日あり)が終わった後
      then: その日に有効な改定のうち開始日が一番新しいもの。なければ原価なし
    - when: 改定が削除・論理削除された(最新の版が削除)
      then: その改定は使わない(古い版に戻らない)
    - when: 特売(SALE)の原価
      then: 使わない
    - when: 結果が 200 件を超える
      then: エラー(FAILED_PRECONDITION)。途中で切り捨てない
    - when: その日に有効な改定のうち開始日が一番新しいものに原価が入っていない
      then: 'その改定を使う: 原価(launch_cost / current_cost)は不设置、current_from はその改定の開始日。開始日がもっと古い改定には戻らない。データの修正は登録する側の責任'
