spec_version: "0.2"
api:
    rpc: factory.catalog.v1.CatalogService/ListLabelsWithProduct
    owner: catalog-team
    risk_level: medium
    description: ラベル印刷の確認画面。ラベル・商品・カテゴリはどれも変更のたびに行が追加される表(JSON版本)で、それぞれの現在の値(最新の版)どうしをつなぐ (古い版の商品名・カテゴリ名を使わない)。商品が削除・論理削除されたラベルは印刷しないので出さない。 カテゴリが見つからない(削除済み・論理削除・未設定を含む)商品のラベルは、カテゴリ名なしで出す
pattern:
    kind: list_all
    not_found_message: ""
    order_by:
        - product_code
        - label
    direction: asc
    page_size:
        default: 0
        max: 0
    max_rows: 500
datasource:
    table: product_label
    filters:
        product_codes:
            column: product_code
            op: in
    columns: []
    rename:
        display_text: text
        label: label_code
    lookups:
        - name: product
          table: product_master
          "on":
            - product_code = product_code
          columns:
            - name: product_name
              from: name
            - name: category
              from: category
          missing: drop
        - name: category
          table: category_master
          "on":
            - category = category
          columns:
            - name: category_title
              from: title
          missing: keep
    sql: ""
behavior:
    - when: 商品が削除・論理削除されている(最新の版が削除)、または商品が登録されていない
      then: そのラベルは出さない(古い版の商品に戻らない)
    - when: 商品の名前・カテゴリが変わった
      then: 最新の版の名前・カテゴリを使う
    - when: カテゴリが削除・論理削除されている、または商品のカテゴリが空
      then: ラベルは出す。category_title は不设置
    - when: ラベルが削除された
      then: 出さない
    - when: 商品を削除したあと同じ商品コードで再登録した(削除前に登録され、削除されていないラベルが残っている)
      then: 残っているラベルはそれぞれの最新の版をそのまま出す。古いラベルを消すのは書き込み側の責任(商品を削除するときにその商品のラベルも削除する)。この API は商品の現在の状態だけで判断する
    - when: 結果が 500 件を超える
      then: エラー(FAILED_PRECONDITION)。途中で切り捨てない
