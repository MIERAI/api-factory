spec_version: "0.2"
api:
    rpc: factory.catalog.v1.CatalogService/ListCategoryProducts
    owner: catalog-team
    risk_level: medium
    description: 売場の商品一覧。商品・ラベル・カテゴリはどれも変更のたびに行が追加される表(JSON版本)で、すべて現在の値(最新の版)で見る。 ラベルは 1 商品 3 件までの運用で、超える商品はデータの誤り → 黙って切り捨てず、一覧ごとエラーにして気づかせる
pattern:
    kind: list_all
    not_found_message: ""
    order_by:
        - product_code
    direction: asc
    page_size:
        default: 0
        max: 0
    max_rows: 200
datasource:
    table: product_master
    filters:
        category:
            column: category
            op: eq
    columns: []
    lookups:
        - name: category
          table: category_master
          "on":
            - category = category
          columns:
            - name: category_title
              from: title
          missing: keep
    nests:
        - name: labels
          table: product_label
          "on":
            - product_code = product_code
          order_by:
            - label_code asc
          max: 3
          columns:
            - name: label
              from: label_code
            - name: text
              from: text
    child_aggs:
        - name: label_count
          table: product_label
          "on":
            - product_code = product_code
          func: count
    sql: ""
behavior:
    - when: 商品のカテゴリが変わった
      then: 最新の版のカテゴリで探す(古い版のカテゴリでは出ない)
    - when: ラベルが削除された / ラベルの新しい版
      then: 削除されたラベルは labels にも label_count にも入らない。版が複数あるラベルは最新の版の文言で 1 件
    - when: 既定のラベル(ラベルコードが空)
      then: 1 件のラベルとして数え、並びは最後
    - when: ある商品のラベルが 3 件を超える(運用上の上限。超えるのはデータの誤り)
      then: 一覧ごと FAILED_PRECONDITION(ラベルを切り捨てて返さない)
    - when: 結果が 200 件を超える
      then: エラー(FAILED_PRECONDITION)。途中で切り捨てない
