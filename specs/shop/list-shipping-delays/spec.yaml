# R10: 发货延迟告警
# 【缺口】派生条件: ordered_at <= as_of - min_days 天,请求字段不对应列 → list_keyset + datasource.sql 逃生口
spec_version: "0.2"
api:
  rpc: factory.shop.v1.ShopService/ListShippingDelays
  owner: logistics-team
  risk_level: low
pattern:
  kind: list_keyset
  order_by: [ordered_at, id]
  direction: asc               # 最早下单的(延迟最久的)在前
  page_size: { default: 20, max: 100 }
datasource:
  table: orders
  sql: |
    SELECT id, customer_id, status, ordered_at, shipped_at, total_amount
    FROM orders
    WHERE status = 0
      AND shipped_at IS NULL
      AND ordered_at <= sqlc.arg(as_of)::timestamptz - make_interval(days => sqlc.arg(min_days)::int)
acceptance:
  fixtures:
    orders:
      - { id: 1, customer_id: 1, status: 0, ordered_at: "2026-10-01T00:00:00Z", shipped_at: null, total_amount: 100 }
      - { id: 2, customer_id: 1, status: 0, ordered_at: "2026-10-08T00:00:00Z", shipped_at: null, total_amount: 100 }
      - { id: 3, customer_id: 1, status: 1, ordered_at: "2026-09-01T00:00:00Z", shipped_at: "2026-09-02T00:00:00Z", total_amount: 100 }
      - { id: 4, customer_id: 1, status: 3, ordered_at: "2026-09-01T00:00:00Z", shipped_at: null, total_amount: 100 }
  cases:
    - name: 截至 10/10,下单超过 7 天未发货的订单(已发货和已取消不算)
      request: { as_of: "2026-10-10T00:00:00Z", min_days: 7 }
      expect: { code: OK, response: { orders: [{ id: 1, status: ORDER_STATUS_PLACED }] } }
    - name: 恰好 N 天也算延迟(<=)
      request: { as_of: "2026-10-15T00:00:00Z", min_days: 7 }
      expect: { code: OK, response: { orders: [{ id: 1 }, { id: 2 }] } }
