spec_version: "0.2"
api:
    rpc: factory.runs.v1.RunService/StartJobRun
    owner: platform-team
    risk_level: medium
    description: 执行方领到任务后调用。额度用完了就不能开始;执行记录的 id 由数据库生成,日志要指向这次执行。中途失败时不能留下"扣了额度却没有执行记录"或者"有执行记录没有日志"
pattern:
    kind: command
    not_found_message: ""
    order_by: []
    direction: ""
    page_size:
        default: 0
        max: 0
    command:
        ops:
            - name: 额度
              kind: update
              table: job_quotas
              key:
                - column: job_type
                  expr: 输入.job_type
              values:
                - column: remaining
                  expr: remaining - 1
                - column: updated_at
                  expr: now()
              cond: remaining >= 1
              unmet: QUOTA_EXHAUSTED
              not_found: 'job quota not found: {job_type}'
            - name: 执行
              kind: insert
              table: job_runs
              values:
                - column: job_type
                  expr: 额度.job_type
                - column: status
                  expr: "1"
                - column: started_at
                  expr: now()
            - name: 日志
              kind: insert
              table: job_run_logs
              values:
                - column: run_id
                  expr: 执行.id
                - column: message
                  expr: 输入.message
                - column: logged_at
                  expr: now()
        output:
            - field: run_id
              op: 执行
              column: id
            - field: status
              op: 执行
              column: status
            - field: started_at
              op: 执行
              column: started_at
            - field: remaining
              op: 额度
              column: remaining
            - field: log_id
              op: 日志
              column: id
datasource:
    table: ""
    filters: {}
    columns: []
    sql: ""
behavior:
    - when: 剩下的额度是 0
      then: 额度不足(FAILED_PRECONDITION,原因码 QUOTA_EXHAUSTED),不新建执行记录、不写日志
    - when: 没有这个任务类型的额度
      then: 找不到(NOT_FOUND),什么都不写
    - when: 三件事中的任何一件失败(包括数据库的错误)
      then: 全部不做(一个事务)
    - when: 剩下的额度是 1
      then: 可以开始执行,扣完后剩下的额度是 0;下一次请求返回额度不足(QUOTA_EXHAUSTED)
    - when: 用同样的 job_type 和 message 调用多次
      then: 每次都扣一次额度、新建一条执行记录和一条日志;避免重复调用是执行方的责任
