                job_run_logs:
                    - id: 20
                      run_id: 7
                    - id: 21
                      logged_at: "2026-11-22T01:00:00Z"
                      message: worker-1 started
                      run_id: 8
                job_runs:
                    - id: 7
                      status: RUN_STATUS_DONE
