behavior:
    - when: 评审人批准了提交的版本
      then: 进入 PUBLISHING,发出 publish.request
    - when: 评审人批准的版本和文档的版本不同
      then: 拒绝(进 DLQ,需要人处理),文档不变
    - when: 评审人驳回
      then: 进入 REJECTED(终态),发出 document.rejected(带理由)
    - when: 评审人 1 分钟没有回答
      then: 重发 review.request(之后每 2 分钟一次);提交 1 小时还没有结论 → EXPIRED(终态),发出 document.expired
    - when: 发布服务 30 秒没有回答
      then: 重发 publish.request(之后每 1 分钟一次),没有期限(发布是幂等的,一直重发到完成)
    - when: 重发引起的第二个回答、或者结论之后才到的回答
      then: 忽略(不改文档,不发消息)
    - when: 文档在 PUBLISHING 时又收到 review.approved / review.rejected
      then: 忽略(不改文档,不发消息)
    - when: 提交超过 1 小时后才收到 review.approved / review.rejected
      then: 文档还在 REVIEWING(期限的扫描还没处理)→ 按正常转移处理;已经是 EXPIRED → 忽略(不改文档,不发消息)
    - when: 文档已经提交
      then: document_reviewers 是只追加的表(工厂不生成更新 / 删除它的写接口),只由 SubmitDocument 和文档一起写入;重发的 review.request 用提交时的评审人(按评审人 id 的顺序),一定是 1~10 人
    - when: 文档不在 REVIEWING 时收到 review.approved,版本和文档不同
      then: 忽略(不改文档,不发消息);版本只在 REVIEWING 时检查,背景里「不能自动吞掉」只针对审批中的文档
    - when: 收到 review.approved / review.rejected
      then: 这条消息是评审服务按 review.request 里的评审人和票数汇总之后的最终结论(这里不按票数汇总);审批中的文档按第一条能转移的结论(版本一致的批准 / 驳回)转移,之后到的回答忽略
    - when: 收到的消息在文档现在的状态没有转移
      then: '按状态图自动分类(状态机不逐个写): 有这个消息的转移的状态在现在的状态之前(从它能走到现在的状态: REVIEWING → PUBLISHING / PUBLISHED / REJECTED / EXPIRED,PUBLISHING → PUBLISHED)→ 忽略(不改文档,不发消息);否则 → 拒绝(进 DLQ)。例: PUBLISHING / PUBLISHED / REJECTED / EXPIRED 收到 review.approved / review.rejected → 忽略;PUBLISHED 收到 publish.done → 忽略;REVIEWING / REJECTED / EXPIRED 收到 publish.done → 拒绝'
    - when: 审批中的文档收到版本不一致的批准(进 DLQ)之后
      then: '文档不变: 继续按间隔重发 review.request,提交 1 小时还没有结论 → EXPIRED,发出 document.expired;处理 DLQ 的人要在期限内处理'
    - when: 审批中的文档收到版本不一致的批准,包括重发 review.request 引起的第二条、第三条
      then: 每一条都拒绝(进 DLQ),文档不变。「重发引起的第二个回答 → 忽略」只适用于文档已经离开 REVIEWING 之后才到的回答
