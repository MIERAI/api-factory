        machine:
            entity: documents
            state: status
            entered: entered_at
            version: version
            attempts: attempts
            created: submitted_at
            start: SubmitDocument
            states:
                - name: REVIEWING
                  command:
                    type: review.request
                    values:
                        - column: doc_id
                          expr: 实体.id
                        - column: revision
                          expr: 实体.revision
                        - column: title
                          expr: 实体.title
                        - column: reviewers
                          expr: 载入.reviewers
