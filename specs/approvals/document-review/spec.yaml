review_decisions:
    - question: 文档已经批准、进入 PUBLISHING 之后,又收到评审人的回答(review.approved 或 review.rejected),要忽略还是拒绝(进 DLQ)?
      decision: 都忽略
    - question: '提交已经超过 1 小时、才到的批准(例: 10:59 提交 → 11:59:30 收到 review.approved)怎么处理?'
      decision: 保持现在的行为
    - question: 文档在审批中、评审人(document_reviewers)被改掉时,重发的 review.request 用哪些评审人?评审人被删到 0 人时怎么办?
      decision: 提交之后评审人不能改
    - question: '文档已经不在 REVIEWING(例: 已经是 PUBLISHING、REJECTED 或 EXPIRED)时,收到版本不一致的批准(例: 文档 revision 2,收到 review.approved revision 1),要忽略还是拒绝(进 DLQ)?'
      decision: 保持现在的行为(只有审批中才检查版本)
    - question: '一个文档有多个评审人(例: alice 1 票、bob 2 票)时,收到的一条 review.approved / review.rejected 是评审服务按票数汇总之后的最终结论,还是某一个评审人的意见?'
      decision: 保持现在的行为(消息是汇总后的结论)
    - question: '上一轮决定「PUBLISHING 的文档又收到 review.approved / review.rejected → 忽略」,但「转移」里没有写这条,而例子「审批中收到 publish.done → 拒绝」说明:等待中的状态收到没有转移的消息时是拒绝(进 DLQ)。这条忽略要怎么写进状态机?例:文档 2(PUBLISHING)收到 review.approved { doc_id: 2, revision: 1 }。'
      decision: 通用规则:已经过去的阶段的回答忽略
    - question: '评审人批准了错的版本(进 DLQ、等人处理)之后,文档还在审批中,现在会继续每 2 分钟重发 review.request,到提交 1 小时还会变成 EXPIRED。这是想要的吗?例: 09:59 提交 revision 2,10:05 收到 review.approved revision 1 → 进 DLQ;10:06、10:08…继续重发,10:59 文档过期。'
      decision: 保持现在的行为
    - question: '审批中的文档收到版本不一致的批准进 DLQ 之后会继续重发 review.request。评审服务对重发再回答一次同样的错版本批准时,要再进一次 DLQ,还是按「重发引起的第二个回答 → 忽略」忽略?例: 09:59 提交 revision 2,10:05 收到 review.approved revision 1 → 进 DLQ;10:06 重发,10:06:10 又收到 review.approved revision 1。'
      decision: 保持现在的行为(每一条都进 DLQ)
