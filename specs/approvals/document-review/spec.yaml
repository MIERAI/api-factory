                - name: PUBLISHING
                  command:
                    type: publish.request
                    values:
                        - column: doc_id
                          expr: 实体.id
                        - column: revision
                          expr: 实体.revision
                  timeout: 30
                  every: 60
                - name: PUBLISHED
                  final: true
                - name: REJECTED
                  final: true
                - name: EXPIRED
                  final: true
