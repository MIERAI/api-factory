                      from: reviewer
                    - name: weight
                      from: weight
            transitions:
                - from: REVIEWING
                  "on": review.approved
                  guard: 输入.revision = 实体.revision
                  to: PUBLISHING
                - from: REVIEWING
                  "on": review.rejected
                  to: REJECTED
                  emit:
                    - type: document.rejected
                      values:
                        - column: doc_id
                          expr: 实体.id
                        - column: reason
                          expr: 输入.reason
                - from: PUBLISHING
                  "on": publish.done
                  to: PUBLISHED
                  emit:
                    - type: document.published
                      values:
                        - column: doc_id
                          expr: 实体.id
                        - column: revision
                          expr: 实体.revision
