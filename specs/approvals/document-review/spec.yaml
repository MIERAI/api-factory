behavior:
    - when: 评审人批准了提交的版本
      then: 进入 PUBLISHING,发出 publish.request
    - when: 评审人批准的版本和文档的版本不同
      then: 拒绝(进 DLQ,需要人处理),文档不变
    - when: 评审人驳回
      then: 进入 REJECTED(终态),发出 document.rejected(带理由)
    - when: 评审人 1 分钟没有回答
      then: 重发 review.request(之后每 2 分钟一次);提交 1 小时还没有结论 → EXPIRED(终态),发出 document.expired
    - when: 发布服务 30 秒没有回答
      then: 重发 publish.request(之后每 1 分钟一次),没有期限(发布是幂等的,一直重发到完成)
    - when: 重发引起的第二个回答、或者结论之后才到的回答
      then: 忽略(不改文档,不发消息)
