spec_version: "0.2"
api:
    rpc: factory.jobs.v1.JobService/GetJobSummary
    owner: platform-team
    risk_level: low
    description: 运维看板用。看某类任务最近是否正常
pattern:
    kind: compute
    not_found_message: ""
    order_by: []
    direction: ""
    page_size:
        default: 0
        max: 0
datasource:
    table: jobs
    filters:
        job_type:
            column: job_type
            op: eq
        period_end:
            column: created_at
            op: lt
        period_start:
            column: created_at
            op: gte
    columns:
        - id
        - status
        - created_at
        - finished_at
    sql: ""
behavior:
    - when: 计数
      then: 按 status 分别数成功、失败、未完成
    - when: 成功率
      then: 成功 / (成功 + 失败),小数 4 位
    - when: 平均处理时间
      then: 结束的任务的 finished_at - created_at 的平均(秒),小数 1 位
    - when: SLA
      then: 处理时间超过 300 秒算违约
    - when: 健康度
      then: |-
        没有结束的任务 → NO_DATA
        成功率 >= 0.95 且没有违约 → OK
        成功率 >= 0.80 → DEGRADED
        其他 → CRITICAL
    - when: 成功或失败但 finished_at 为空
      then: 计入 succeeded / failed,不参与平均和 SLA
    - when: 未完成但 finished_at 不为空
      then: 按未完成计,忽略 finished_at
    - when: 已结束为 0 件
      then: success_rate 和 avg_duration_seconds 不设置;没有有效处理时间时 avg_duration_seconds 也不设置
    - when: 健康度的判定
      then: 用四舍五入之前的成功率;没有有效处理时间本身不影响健康度
    - when: 四舍五入的方式
      then: float64 计算后 math.Round(x × 10^n) / 10^n(0.5 远离零)
    - when: status 是"未指定"
      then: 这一行从所有统计中排除(total 也不计)。平台已记录监控指标
    - when: 成功或失败的任务,finished_at 早于 created_at(处理时间为负数)
      then: 计入 succeeded / failed,不参与平均和 SLA;处理时间为 0 秒的任务正常参与平均。有效处理时间(不为空且不为负数)为 0 件时 avg_duration_seconds 不设置
