review_decisions:
    - question: 成功或失败的任务,finished_at 却为空时怎么办?
      decision: 计入成功/失败,不参与平均和 SLA
    - question: 没有结束的任务时,成功率和平均时间返回 0 还是不设置?
      decision: 不设置
    - question: '健康度用四舍五入之前还是之后的成功率判定?(例: 0.94996 显示为 0.95)'
      decision: 四舍五入之前
    - question: 四舍五入用哪种方式?(0.25 → 0.2 还是 0.3)
      decision: 0.5 远离零(0.3)
    - question: 读到不认识的状态(写入方先上线了新状态)时,这一行算不算进 total?
      decision: 从所有统计中排除
    - question: 'finished_at 早于 created_at(处理时间为负数,例: id 82 是 -60 秒)的任务,算不算进平均处理时间和 SLA?'
      decision: 排除负数,0 秒有效(和现在的例子一致)
