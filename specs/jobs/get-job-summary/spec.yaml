    - name: zeta — 2/3 → 0.6667,平均 1.666… → 1.7
      request: { job_type: zeta, period_start: "2026-11-01T00:00:00Z", period_end: "2026-11-08T00:00:00Z" }
      expect:
        code: OK
        response: { total: 3, succeeded: 2, failed: 1, success_rate: 0.6667, avg_duration_seconds: 1.7, health: CRITICAL }

    - name: eta — 未知 status 排除 / 负的处理时间不参与平均和 SLA / 失败任务也算违约
      request: { job_type: eta, period_start: "2026-11-01T00:00:00Z", period_end: "2026-11-08T00:00:00Z" }
      expect:
        code: OK
        response: { total: 3, succeeded: 2, failed: 1, pending: 0, success_rate: 0.6667, avg_duration_seconds: 310.0, sla_breaches: 1, health: CRITICAL }

    - name: theta — finished_at 全部为 NULL → 平均不设置,health 仍为 OK
      request: { job_type: theta, period_start: "2026-11-01T00:00:00Z", period_end: "2026-11-08T00:00:00Z" }
      expect:
        code: OK
        response: { total: 2, succeeded: 2, failed: 0, success_rate: 1.0, avg_duration_seconds: $absent, sla_breaches: 0, health: OK }

    - name: iota — 只有未知 status → 0 件 NO_DATA
      request: { job_type: iota, period_start: "2026-11-01T00:00:00Z", period_end: "2026-11-08T00:00:00Z" }
      expect:
        code: OK
        response: { total: 0, success_rate: $absent, avg_duration_seconds: $absent, health: NO_DATA }

    - name: kappa — 小数秒 / 0 秒有效 / 0.25 → 0.3(0.5 远离零)
      request: { job_type: kappa, period_start: "2026-11-01T00:00:00Z", period_end: "2026-11-08T00:00:00Z" }
      expect:
        code: OK
        response: { total: 2, succeeded: 1, failed: 1, success_rate: 0.5, avg_duration_seconds: 0.3, sla_breaches: 0, health: CRITICAL }

    - name: lambda — 全部失败 → success_rate 设置为 0.0
      request: { job_type: lambda, period_start: "2026-11-01T00:00:00Z", period_end: "2026-11-08T00:00:00Z" }
      expect:
        code: OK
        response: { total: 1, failed: 1, success_rate: 0.0, avg_duration_seconds: 1.0, health: CRITICAL }

    - name: mu — 300.5 秒算违约
      request: { job_type: mu, period_start: "2026-11-01T00:00:00Z", period_end: "2026-11-08T00:00:00Z" }
      expect:
        code: OK
        response: { total: 1, succeeded: 1, success_rate: 1.0, avg_duration_seconds: 300.5, sla_breaches: 1, health: DEGRADED }

    - name: 不存在的 job_type → 0 件 NO_DATA
      request: { job_type: nothing, period_start: "2026-11-01T00:00:00Z", period_end: "2026-11-08T00:00:00Z" }
      expect:
        code: OK
        response: { total: 0, success_rate: $absent, avg_duration_seconds: $absent, health: NO_DATA }

    - name: 期间缩小后只剩 alpha 的前 3 件
      request: { job_type: alpha, period_start: "2026-11-01T00:00:00Z", period_end: "2026-11-01T00:04:00Z" }
      expect:
        code: OK
        response: { total: 3, succeeded: 3, success_rate: 1.0, health: OK }

    - name: 期间颠倒
      request: { job_type: alpha, period_start: "2026-11-08T00:00:00Z", period_end: "2026-11-01T00:00:00Z" }
      expect: { code: INVALID_ARGUMENT }

    - name: 期间恰好 31 天(744 小时)是允许的
      request: { job_type: alpha, period_start: "2026-10-08T00:00:00Z", period_end: "2026-11-08T00:00:00Z" }
      expect: { code: OK, response: { total: 21 } }

    - name: period_start = period_end
      request: { job_type: alpha, period_start: "2026-11-01T00:00:00Z", period_end: "2026-11-01T00:00:00Z" }
      expect: { code: INVALID_ARGUMENT }

    - name: 期间超过 31 天
      request: { job_type: alpha, period_start: "2026-10-01T00:00:00Z", period_end: "2026-11-08T00:00:00Z" }
      expect: { code: INVALID_ARGUMENT }

    - name: 未指定期间
      request: { job_type: alpha }
      expect: { code: INVALID_ARGUMENT }

    - name: job_type 为空
      request: { job_type: "", period_start: "2026-11-01T00:00:00Z", period_end: "2026-11-08T00:00:00Z" }
      expect: { code: INVALID_ARGUMENT }

# -----------------------------------------------------------------------------
# 审查记录: 式样书审查提出的问题和人的决定。以后的审查不再提出这些问题
# -----------------------------------------------------------------------------
review_decisions:
  - question: status 不是 0/1/2 的行怎么处理?
    decision: 从所有统计中排除(total 也不计)。已写入 behavior,验收 eta / iota 覆盖
  - question: finished_at < created_at(处理时间为负)的行是否参与平均和 SLA?
    decision: 不参与;照常计入 succeeded/failed。已写入 behavior,验收 eta 覆盖
  - question: finished_at / created_at 为 infinity 时怎么处理?
    decision: schema 的 CHECK (isfinite) 约束排除,不会出现
  - question: health 用四舍五入前的值判定,能否用验收用例区分?
    decision: 需要约 2 万行 fixture,DB 级验收不现实。由逻辑函数的单元测试保证(工厂改进候选:式样书里的纯函数级"逻辑样例")
  - question: 处理时间极长(超过 time.Duration 上限约 292 年)时怎么处理?
    decision: 不处理。现实中不会发生(审查的现实性规则)
