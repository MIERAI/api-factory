      - { id: 14, job_type: alpha, status: 1, created_at: "2026-11-01T00:14:00Z", finished_at: "2026-11-01T00:15:00Z" }
      - { id: 15, job_type: alpha, status: 1, created_at: "2026-11-01T00:15:00Z", finished_at: "2026-11-01T00:16:00Z" }
      - { id: 16, job_type: alpha, status: 1, created_at: "2026-11-01T00:16:00Z", finished_at: "2026-11-01T00:17:00Z" }
      - { id: 17, job_type: alpha, status: 1, created_at: "2026-11-01T00:17:00Z", finished_at: "2026-11-01T00:18:00Z" }
      - { id: 18, job_type: alpha, status: 1, created_at: "2026-11-01T00:18:00Z", finished_at: "2026-11-01T00:19:00Z" }
      - { id: 19, job_type: alpha, status: 1, created_at: "2026-11-01T00:19:00Z", finished_at: "2026-11-01T00:20:00Z" }
