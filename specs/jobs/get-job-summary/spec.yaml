      - { id: 51, job_type: delta, status: 1, created_at: "2026-11-04T00:00:00Z", finished_at: "2026-11-04T00:00:10Z" }
      - { id: 52, job_type: delta, status: 1, created_at: "2026-11-04T01:00:00Z", finished_at: "2026-11-04T01:00:10Z" }
      - { id: 53, job_type: delta, status: 1, created_at: "2026-11-04T02:00:00Z", finished_at: "2026-11-04T02:00:10Z" }
      - { id: 54, job_type: delta, status: 1, created_at: "2026-11-04T03:00:00Z", finished_at: "2026-11-04T03:00:10Z" }
      - { id: 55, job_type: delta, status: 2, created_at: "2026-11-04T04:00:00Z", finished_at: "2026-11-04T04:00:10Z" }
      # epsilon: 成功率 1.0 但有 1 件违约 → DEGRADED
      - { id: 61, job_type: epsilon, status: 1, created_at: "2026-11-05T00:00:00Z", finished_at: "2026-11-05T00:06:40Z" }  # 400 秒
      - { id: 62, job_type: epsilon, status: 1, created_at: "2026-11-05T01:00:00Z", finished_at: "2026-11-05T01:00:10Z" }  # 10 秒
      # zeta: 2/3 → 四舍五入检查
      - { id: 71, job_type: zeta, status: 1, created_at: "2026-11-06T00:00:00Z", finished_at: "2026-11-06T00:00:01Z" }
      - { id: 72, job_type: zeta, status: 1, created_at: "2026-11-06T01:00:00Z", finished_at: "2026-11-06T01:00:02Z" }
      - { id: 73, job_type: zeta, status: 2, created_at: "2026-11-06T02:00:00Z", finished_at: "2026-11-06T02:00:02Z" }
      # eta: 负的处理时间 / 失败任务的违约
      - { id: 82, job_type: eta, status: 1, created_at: "2026-11-07T01:00:00Z", finished_at: "2026-11-07T00:59:00Z" }  # -60 秒 → 计入成功,不参与平均/SLA
      - { id: 83, job_type: eta, status: 2, created_at: "2026-11-07T02:00:00Z", finished_at: "2026-11-07T02:10:00Z" }  # 失败 600 秒 → 违约
      - { id: 84, job_type: eta, status: 1, created_at: "2026-11-07T03:00:00Z", finished_at: "2026-11-07T03:00:20Z" }  # 20 秒
      # theta: 已结束但 finished_at 全部为 NULL → 平均不设置,health 仍按成功率判定
      - { id: 91, job_type: theta, status: 1, created_at: "2026-11-07T04:00:00Z", finished_at: null }
      - { id: 92, job_type: theta, status: 1, created_at: "2026-11-07T05:00:00Z", finished_at: null }
      # kappa: 小数秒 + 0 秒 + 恰好 .5 的四舍五入: (0.5 + 0) / 2 = 0.25 → 0.3(远离零;银行家舍入会得到 0.2,截断成整数秒会得到 0.0)
      - { id: 101, job_type: kappa, status: 1, created_at: "2026-11-07T07:00:00Z", finished_at: "2026-11-07T07:00:00.5Z" }
      - { id: 102, job_type: kappa, status: 2, created_at: "2026-11-07T07:10:00Z", finished_at: "2026-11-07T07:10:00Z" }    # 0 秒,有效
      # lambda: 全部失败 → success_rate 必须设置为 0.0(不是不设置)
      - { id: 111, job_type: lambda, status: 2, created_at: "2026-11-07T08:00:00Z", finished_at: "2026-11-07T08:00:01Z" }
      # mu: 300.5 秒 → 违约(截断成整数秒会漏掉)
      - { id: 121, job_type: mu, status: 1, created_at: "2026-11-07T09:00:00Z", finished_at: "2026-11-07T09:05:00.5Z" }
  cases:
    - name: alpha — 0.95 刚好 OK,期间边界外不计
      request: { job_type: alpha, period_start: "2026-11-01T00:00:00Z", period_end: "2026-11-08T00:00:00Z" }
      expect:
        code: OK
        response: { total: 20, succeeded: 19, failed: 1, pending: 0, success_rate: 0.95, avg_duration_seconds: 60.0, sla_breaches: 0, health: OK }

    - name: beta — 300 秒不算违约 / 数据不一致的行 / 0.75 CRITICAL
      request: { job_type: beta, period_start: "2026-11-01T00:00:00Z", period_end: "2026-11-08T00:00:00Z" }
      expect:
        code: OK
        response: { total: 5, succeeded: 3, failed: 1, pending: 1, success_rate: 0.75, avg_duration_seconds: 233.7, sla_breaches: 1, health: CRITICAL }

    - name: gamma — 全部未完成 → NO_DATA,比率和平均不设置
      request: { job_type: gamma, period_start: "2026-11-01T00:00:00Z", period_end: "2026-11-08T00:00:00Z" }
      expect:
        code: OK
        response: { total: 2, succeeded: 0, failed: 0, pending: 2, success_rate: $absent, avg_duration_seconds: $absent, sla_breaches: 0, health: NO_DATA }

    - name: delta — 0.80 刚好 DEGRADED
      request: { job_type: delta, period_start: "2026-11-01T00:00:00Z", period_end: "2026-11-08T00:00:00Z" }
      expect:
        code: OK
        response: { total: 5, succeeded: 4, failed: 1, success_rate: 0.8, avg_duration_seconds: 10.0, sla_breaches: 0, health: DEGRADED }

    - name: epsilon — 成功率 1.0 但有违约 → DEGRADED
      request: { job_type: epsilon, period_start: "2026-11-01T00:00:00Z", period_end: "2026-11-08T00:00:00Z" }
      expect:
        code: OK
        response: { total: 2, succeeded: 2, success_rate: 1.0, avg_duration_seconds: 205.0, sla_breaches: 1, health: DEGRADED }

    - name: zeta — 2/3 → 0.6667,平均 1.666… → 1.7
      request: { job_type: zeta, period_start: "2026-11-01T00:00:00Z", period_end: "2026-11-08T00:00:00Z" }
      expect:
        code: OK
        response: { total: 3, succeeded: 2, failed: 1, success_rate: 0.6667, avg_duration_seconds: 1.7, health: CRITICAL }

    - name: eta — 负的处理时间不参与平均和 SLA / 失败任务也算违约
      request: { job_type: eta, period_start: "2026-11-01T00:00:00Z", period_end: "2026-11-08T00:00:00Z" }
      expect:
        code: OK
        response: { total: 3, succeeded: 2, failed: 1, pending: 0, success_rate: 0.6667, avg_duration_seconds: 310.0, sla_breaches: 1, health: CRITICAL }

    - name: theta — finished_at 全部为 NULL → 平均不设置,health 仍为 OK
      request: { job_type: theta, period_start: "2026-11-01T00:00:00Z", period_end: "2026-11-08T00:00:00Z" }
      expect:
        code: OK
        response: { total: 2, succeeded: 2, failed: 0, success_rate: 1.0, avg_duration_seconds: $absent, sla_breaches: 0, health: OK }

    - name: kappa — 小数秒 / 0 秒有效 / 0.25 → 0.3(0.5 远离零)
      request: { job_type: kappa, period_start: "2026-11-01T00:00:00Z", period_end: "2026-11-08T00:00:00Z" }
      expect:
        code: OK
        response: { total: 2, succeeded: 1, failed: 1, success_rate: 0.5, avg_duration_seconds: 0.3, sla_breaches: 0, health: CRITICAL }

    - name: lambda — 全部失败 → success_rate 设置为 0.0
      request: { job_type: lambda, period_start: "2026-11-01T00:00:00Z", period_end: "2026-11-08T00:00:00Z" }
      expect:
        code: OK
        response: { total: 1, failed: 1, success_rate: 0.0, avg_duration_seconds: 1.0, health: CRITICAL }

    - name: mu — 300.5 秒算违约
      request: { job_type: mu, period_start: "2026-11-01T00:00:00Z", period_end: "2026-11-08T00:00:00Z" }
      expect:
        code: OK
        response: { total: 1, succeeded: 1, success_rate: 1.0, avg_duration_seconds: 300.5, sla_breaches: 1, health: DEGRADED }

    - name: 不存在的 job_type → 0 件 NO_DATA
      request: { job_type: nothing, period_start: "2026-11-01T00:00:00Z", period_end: "2026-11-08T00:00:00Z" }
      expect:
        code: OK
        response: { total: 0, success_rate: $absent, avg_duration_seconds: $absent, health: NO_DATA }

    - name: 期间缩小后只剩 alpha 的前 3 件
      request: { job_type: alpha, period_start: "2026-11-01T00:00:00Z", period_end: "2026-11-01T00:04:00Z" }
      expect:
        code: OK
        response: { total: 3, succeeded: 3, success_rate: 1.0, health: OK }

    - name: 期间颠倒
      request: { job_type: alpha, period_start: "2026-11-08T00:00:00Z", period_end: "2026-11-01T00:00:00Z" }
      expect: { code: INVALID_ARGUMENT }

    - name: 期间恰好 31 天(744 小时)是允许的
      request: { job_type: alpha, period_start: "2026-10-08T00:00:00Z", period_end: "2026-11-08T00:00:00Z" }
      expect: { code: OK, response: { total: 21 } }

    - name: period_start = period_end
      request: { job_type: alpha, period_start: "2026-11-01T00:00:00Z", period_end: "2026-11-01T00:00:00Z" }
      expect: { code: INVALID_ARGUMENT }

    - name: 期间超过 31 天
      request: { job_type: alpha, period_start: "2026-10-01T00:00:00Z", period_end: "2026-11-08T00:00:00Z" }
      expect: { code: INVALID_ARGUMENT }


# -----------------------------------------------------------------------------
# 逻辑样例: 直接调用逻辑函数(不经过 DB)。用于 DB 里造不出来的输入
# -----------------------------------------------------------------------------
logic_examples:
  - name: UNSPECIFIED(读到不认识的 DB 值)的行从所有统计中排除
    rows:
      - { count: 2, status: JOB_STATUS_SUCCEEDED, created_at: "2026-11-01T00:00:00Z", finished_at: "2026-11-01T00:00:10Z" }
      - { status: JOB_STATUS_UNSPECIFIED, created_at: "2026-11-01T01:00:00Z", finished_at: "2026-11-01T02:00:00Z" }
    expect: { total: 2, succeeded: 2, failed: 0, pending: 0, success_rate: 1.0, avg_duration_seconds: 10.0, sla_breaches: 0, health: OK }
  - name: 全部是 UNSPECIFIED → 0 件 NO_DATA
    rows:
      - { status: JOB_STATUS_UNSPECIFIED, created_at: "2026-11-01T00:00:00Z", finished_at: null }
    expect: { total: 0, success_rate: $absent, avg_duration_seconds: $absent, health: NO_DATA }
  - name: health 用四舍五入前的值 — 23749/25000 = 0.94996 显示为 0.95,但判定为 DEGRADED
    rows:
      - { count: 23749, status: JOB_STATUS_SUCCEEDED, created_at: "2026-11-01T00:00:00Z", finished_at: "2026-11-01T00:00:10Z" }
      - { count: 1251, status: JOB_STATUS_FAILED, created_at: "2026-11-01T00:00:00Z", finished_at: "2026-11-01T00:00:10Z" }
    expect: { total: 25000, success_rate: 0.95, sla_breaches: 0, health: DEGRADED }
  - name: health 用四舍五入前的值 — 19999/25000 = 0.79996 显示为 0.8,但判定为 CRITICAL
    rows:
      - { count: 19999, status: JOB_STATUS_SUCCEEDED, created_at: "2026-11-01T00:00:00Z", finished_at: "2026-11-01T00:00:10Z" }
      - { count: 5001, status: JOB_STATUS_FAILED, created_at: "2026-11-01T00:00:00Z", finished_at: "2026-11-01T00:00:10Z" }
    expect: { total: 25000, success_rate: 0.8, health: CRITICAL }

# -----------------------------------------------------------------------------
# 审查记录: 这个 API 特有的决定(领域级的决定在 specs/jobs/_domain.yaml)
# -----------------------------------------------------------------------------
review_decisions:
  - question: finished_at < created_at(处理时间为负)的行是否参与平均和 SLA?
    decision: 不参与;照常计入 succeeded/failed。已写入 behavior,验收 eta 覆盖
  - question: health 用四舍五入前的值判定,能否用验收用例区分?
    decision: DB 级验收需要上万行 fixture,不现实。由 logic_examples 覆盖(0.94996 / 0.79996;避开 .xxxx5 这种在 float64 里不精确的值)
  - question: 部署顺序导致读到映射表以外的 status(UNSPECIFIED)时,是否计入 total?
    decision: 从所有统计中排除(沿用之前对未知 status 的决定)。平台已记录 data_anomaly_total。logic_examples 覆盖
