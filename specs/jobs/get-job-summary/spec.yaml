# =============================================================================
# API 式样书: GetJobSummary
# =============================================================================
spec_version: "0.2"

api:
  rpc: factory.jobs.v1.JobService/GetJobSummary
  owner: platform-team
  risk_level: low
  description: 运维看板用。返回件数、成功率、平均处理时间、SLA 违约件数和健康度。

# 工厂生成 handler(请求映射 → 查询 → 调用逻辑函数);AI 只写纯函数 getJobSummaryLogic(req, rows)
pattern:
  kind: compute

datasource:
  table: jobs
  columns: [id, status, created_at, finished_at]   # 逻辑函数的输入
  filters:                                          # job_type 符合命名约定(同名列 eq),期间需要显式写
    period_start: { column: created_at, op: gte }
    period_end:   { column: created_at, op: lt }

behavior:
  - when: 对象行
    then: 只统计 status 为 0/1/2 的行。status 为其他值的行从所有统计中排除(total 也不计)
  - when: 计数
    then: total = 对象行数; succeeded = status 1; failed = status 2; pending = status 0; 已结束 = succeeded + failed
  - when: success_rate
    then: 已结束 > 0 时 = succeeded / 已结束,四舍五入到小数 4 位。已结束 = 0 时不设置
  - when: 处理时间
    then: 已结束且 finished_at 非 NULL 的任务,处理时间 = finished_at - created_at(秒,含小数)
  - when: 处理时间为负(finished_at < created_at)
    then: 该任务照常计入 succeeded/failed,但不参与 avg_duration_seconds 和 sla_breaches
  - when: avg_duration_seconds
    then: 有效处理时间(>= 0)的平均值,四舍五入到小数 1 位。没有有效处理时间时不设置
  - when: 四舍五入的方式(success_rate 和 avg_duration_seconds 共通)
    then: float64 计算后 math.Round(x * 10^n) / 10^n(0.5 远离零)
  - when: sla_breaches
    then: 有效处理时间 > 300 秒的已结束任务数,成功和失败都算(恰好 300 秒不算违约)
  - when: 数据不一致 — status 1/2 但 finished_at 为 NULL
    then: 计入 succeeded/failed,但不参与 avg_duration_seconds 和 sla_breaches
  - when: 数据不一致 — status 0 但 finished_at 非 NULL
    then: 按 pending 计,忽略 finished_at
  - when: health(按顺序判定,先满足的优先)
    then: |
      1. 已结束 = 0                                    → NO_DATA
      2. success_rate >= 0.95 且 sla_breaches = 0      → OK
      3. success_rate >= 0.80                          → DEGRADED
      4. 其他                                          → CRITICAL
      判定使用四舍五入前的 success_rate。
      没有有效处理时间(avg 不设置)本身不影响 health
  - when: 参数不合法(job_type 为空、期间颠倒、超过 31 天、未指定期间)
    then: INVALID_ARGUMENT(protovalidate 自动处理,逻辑函数不用写)

# -----------------------------------------------------------------------------
