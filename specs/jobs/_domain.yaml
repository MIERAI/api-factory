# =============================================================================
# 领域层: jobs
#   一个领域里所有 API(以后包括命令工厂、IF 工厂)共用的决定。只写 schema 和 proto 表达不了的东西:
#   列和类型 → db/schema.sql;对外的类型 → proto。这里不重复它们,只补充"含义"和"策略"。
# =============================================================================
domain_version: "0.1"

entities:
  jobs:
    natural_key: [id]
    policy: mutable              # mutable / versioned(只追加,按生效日期取版本)
    columns:
      status:
        # DB 值 → proto enum。proto 侧的 0(UNSPECIFIED)不对应任何 DB 值
        enum:
          proto: factory.jobs.v1.JobStatus
          values:
            0: JOB_STATUS_PENDING
            1: JOB_STATUS_SUCCEEDED
            2: JOB_STATUS_FAILED
        # 读到映射表以外的 DB 值时(例如写入方先上线了新状态):
        #   unspecified = 返回 UNSPECIFIED 并记录 data_anomaly_total 指标(读取宽容)
        on_unknown: unspecified
    # 不变量。enforced: true = DB 约束保证,不会出现;false = 应该成立但可能被违反,API 必须定义违反时怎么处理
    invariants:
      - rule: status 只能是 0/1/2
        enforced: true           # CHECK (status IN (0, 1, 2))
      - rule: created_at / finished_at 是有限值(不是 infinity)
        enforced: true           # CHECK (isfinite(...))
      - rule: status 为 1/2(成功/失败)时 finished_at 非 NULL
        enforced: false          # 写入方的 bug 可能违反
      - rule: finished_at >= created_at
        enforced: false          # 写入方之间的时钟偏差可能违反

# 领域级的审查决定: 这个领域的所有 API 都继承,审查不再逐个 API 提问
review_decisions:
  - question: jobs.status 出现 0/1/2 以外的值怎么办?
    decision: DB 的 CHECK 约束保证不会出现(数据损坏)。新增状态时会同时修改 CHECK 和本文件;部署顺序造成的读取方不认识的值,按 on_unknown(unspecified)处理
  - question: 时间列为 infinity 怎么办?
    decision: CHECK (isfinite) 保证不会出现
  - question: 处理时间极长(int64 纳秒溢出)怎么办?
    decision: 不处理,现实中不会发生
