    description: 滞留アラート。滞留の長さは作成時刻(created_at)から測る(この表には状態の更新時刻がない)。 「今日」は領域の時区(Asia/Tokyo)の日付。現在時刻はサーバーの時計で、リクエストには含めない(テストでは例子の 现在 で固定する)。 stale_minutes が「今日 0 時から現在までの分数」以上なら結果は必ず空(今日の任務だけが対象。範囲 1~1440 はそのまま許す)。 上限 200 件。平常時の滞留は数件。200 件を超えるのは処理系の停止(障害)なので、件数を絞った一覧ではなくエラーで気づかせる
pattern:
    kind: list_all
    not_found_message: ""
    order_by:
        - created_at
        - id
    direction: asc
    page_size:
        default: 0
        max: 0
    max_rows: 200
datasource:
    table: jobs
    filters: {}
    columns: []
    where:
        - finished_at 为空
    derived:
        stale_before:
            expr: add(now(), -stale_minutes, minute)
            column: created_at
            op: lt
            inputs:
                stale_minutes: int32
            time_zone: Asia/Tokyo
        today_start:
            expr: trunc(now(), day)
            column: created_at
            op: gte
            time_zone: Asia/Tokyo
    sql: ""
behavior:
    - when: 状態が SUCCEEDED / FAILED なのに finished_at が空の任務(書き込み側の不具合。領域の規則「成功・失敗の任務には必ず finished_at がある」はデータベースでは保証されない)
      then: 終わっていない任務として返す(finished_at だけで判断する)。状態はそのまま返すので、監視画面で不整合に気づける
    - when: 条件に合う任務が 200 件を超える
      then: エラー(FAILED_PRECONDITION)。一部だけを返すと滞留の規模を見誤るため
