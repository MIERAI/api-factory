# =============================================================================
# API 式样书: GetJobStatus
#   summary / 类型 → proto 的 rpc 注释;id → 目录;SQL → 由下面的声明生成
# =============================================================================
spec_version: "0.2"

api:
  rpc: factory.jobs.v1.JobService/GetJobStatus
  owner: platform-team
  risk_level: low
  description: 调用方在提交异步任务后,轮询这个 API 等待任务结束。

# 按请求字段查 1 行,查不到 → NOT_FOUND。参数校验(protovalidate)、错误转换由平台保证
pattern:
  kind: get_by_id
  not_found_message: "job not found: {job_id}"

# job_id → id(命名约定 <单数表名>_id);SELECT 的列 = 响应字段(status)
datasource:
  table: jobs

# 机制(按键取得、不存在 → NOT_FOUND、job_id 的边界)由工厂自动生成: gen/acceptance/jobs.get-job-status.yaml
# 这里只写业务意图
acceptance:
  fixtures:
    jobs:
      - { id: 102, status: 1 }
      - { id: 3000000000, status: 2 }   # 实际的 id 已经超过 int32 范围
  cases:
    - name: 普通的 id
      request: { job_id: 102 }
      expect: { code: OK, response: { status: 1 } }
    - name: 超过 int32 范围的 id 也能查到(业务上 id 是 bigint)
      request: { job_id: 3000000000 }
      expect: { code: OK, response: { status: 2 } }
