# =============================================================================
# API 式样书: GetJobStatus
#   summary / 类型 → proto 的 rpc 注释;id → 目录;SQL → 由下面的声明生成
# =============================================================================
spec_version: "0.2"

api:
  rpc: factory.jobs.v1.JobService/GetJobStatus
  owner: platform-team
  risk_level: low
  description: 调用方在提交异步任务后,轮询这个 API 等待任务结束。

# 按请求字段查 1 行,查不到 → NOT_FOUND。参数校验(protovalidate)、错误转换由平台保证
pattern:
  kind: get_by_id
  not_found_message: "job not found: {job_id}"

# job_id → id(命名约定 <单数表名>_id);SELECT 的列 = 响应字段(status)
datasource:
  table: jobs

acceptance:
  fixtures:
    jobs:
      - { id: 101, status: 0 }
      - { id: 102, status: 1 }
      - { id: 103, status: 2 }
      - { id: 3000000000, status: 1 }   # 超过 int32 范围
  cases:
    - name: 未完成
      request: { job_id: 101 }
      expect: { code: OK, response: { status: 0 } }
    - name: 成功
      request: { job_id: 102 }
      expect: { code: OK, response: { status: 1 } }
    - name: 失败
      request: { job_id: 103 }
      expect: { code: OK, response: { status: 2 } }
    - name: 超过 int32 的 id
      request: { job_id: 3000000000 }
      expect: { code: OK, response: { status: 1 } }
    - name: 不存在的 id
      request: { job_id: 999 }
      expect: { code: NOT_FOUND }
    - name: 0 是非法值
      request: { job_id: 0 }
      expect: { code: INVALID_ARGUMENT }
    - name: 负数是非法值
      request: { job_id: -1 }
      expect: { code: INVALID_ARGUMENT }
    - name: 未指定
      request: {}
      expect: { code: INVALID_ARGUMENT }
