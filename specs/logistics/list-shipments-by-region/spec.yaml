pattern:
    kind: list_all
    not_found_message: ""
    order_by:
        - region_name
        - region_code
        - id
    direction: asc
    page_size:
        default: 0
        max: 0
    max_rows: 50
datasource:
    table: shipments
    filters:
        region_code:
            column: region_code
            op: eq
        shipped_on:
            column: shipped_on
            op: eq
    columns: []
    lookups:
        - name: warehouse
