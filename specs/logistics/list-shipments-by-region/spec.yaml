          columns:
            - name: region_name
              from: name
          missing: keep
    sql: ""
behavior:
    - when: 当日の出荷が 50 件を超える
      then: エラー(FAILED_PRECONDITION)。一部だけ返すことはしない
    - when: 当日の出荷が 50 件を超え、地域が未設定・倉庫マスタに無い出荷がある
      then: それらの出荷はこの API では取得できない(地域を指定しても対象にならない)。1 日 30 件程度の前提なので許容し、マスタ側で地域を設定して対応する
    - when: 当天出荷超过 50 件,且有出荷的倉庫没有地域コード或不在倉庫マスタ
      then: 这些出荷无法通过本 API 取得(指定任何地域都不会返回),需要用 ListShipmentsByDay 等按倉庫的 API 查询;按「1 日 30 件程度」的前提,不另外处理
