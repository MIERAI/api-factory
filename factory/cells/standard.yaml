# 标准单元库(产品自带)。单元只是基本元件的组合(factory/core),不带实现。
# 新增单元 = 在这里加一条定义: SQL、参考实现、差分测试自动获得,核心代码不改。
#
# 筛选单元: id = 内部名(spec / IR 里用它,和设计语言的写法无关);定义里 列 = 第一列(多列时 列1 / 列2 …),值 = 请求参数;必填时 absent(值) 恒为 FALSE(SQL 里化简掉)
筛选:
  等于:     { id: eq, 定义: "or(absent(值), cmp(=, 列, 值))" }
  大于:     { id: gt, 定义: "or(absent(值), cmp(>, 列, 值))" }
  大于等于: { id: gte, 定义: "or(absent(值), cmp(>=, 列, 值))" }
  小于:     { id: lt, 定义: "or(absent(值), cmp(<, 列, 值))" }
  小于等于: { id: lte, 定义: "or(absent(值), cmp(<=, 列, 值))" }
  前缀匹配: { id: prefix, 定义: "or(absent(值), starts_with(列, 值))" }
  不等于:   { id: ne, 定义: "or(absent(值), cmp(<>, 列, 值))" }
  属于:     { id: in, 定义: "or(absent(值), in_list(列, 值))" }       # 值 = 列表参数;空列表 / 不传 = 不筛选(必填 = 至少 1 个)
  # 组的列表: 输入是 组列表(每个组几个字段),列组 = 组的字段对应的列,值组 = 每个字段一个列表参数。有一个组逐列相等就留下
  组属于:   { id: in_tuples, 定义: "or(absent(值), in_tuples(列组, 值组))" }
  # 两列: 列1 = 开始,列2 = 结束(含;为空 = 没有结束)。设计稿里写「开始列~结束列 有效期包含」
  有效期包含: { id: valid_at, 定义: "or(absent(值), and(cmp(<=, 列1, 值), or(is_null(列2), cmp(<=, 值, 列2))))" }

# 来源: 逻辑表不是物理表时,流水线的开头。$ 开头的部件由编译器按领域的 存储 声明提供:
#   $原始表 scan 物理表   $展开 project(每个字段 = json_field(数据列, 键, 类型) + 操作列 + 登记顺序列 + 逻辑删除)
#   $键非空 filter(自然键都不为空)   $每键最新 pick_per_key(自然键,登记顺序 新 → 旧)   $逻辑列 project(只留字段)
# 有效: 最新的一行不是删除、也没有逻辑删除(不回退到旧版本)。可用的名字: 操作 / 删除值 / 逻辑删除 / 逻辑删除值
来源:
  JSON版本:
    步骤: [scan: $原始表, project: $展开, filter: $键非空, pick_per_key: $每键最新, filter: $有效, project: $逻辑列]
    有效: "and(cmp(<>, 操作, 删除值), or(is_null(逻辑删除), cmp(<>, 逻辑删除, 逻辑删除值)))"

# 模式(套装): 关系元件的流水线。$ 开头的是编译器提供的部件:
#   $筛选   每个筛选条件一个 filter      $输出列  project(响应的列)
#   $游标   keyset 的游标条件(tuple_after) $排序    sort(排序列 + 方向)
#   $行数   limit(请求参数 row_limit,= page_size + 1)
#   $上限   limit(常数)              $每组    pick_per_key(按哪些列分组,组内按什么取第一行;可选)
模式:
  单条: [filter: $筛选, project: $输出列]
  分页: [filter: $筛选, pick_per_key: $每组, project: $输出列, filter: $游标, sort: $排序, limit: $行数]
  计算: [filter: $筛选, project: $输出列]
  多条: [filter: $筛选, pick_per_key: $每组, project: $输出列, sort: $排序, limit: $上限]   # $上限 = 上限 + 1(多取一行,用来判断超限)
  # $每组: 每组取一条(式样书写了才有;没写时这一步省略)
