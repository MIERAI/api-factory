# 标准单元库(产品自带)。单元只是基本元件的组合(factory/core),不带实现。
# 新增单元 = 在这里加一条定义: SQL、参考实现、差分测试自动获得,核心代码不改。
#
# 筛选单元: 参数 [列, 值]。值 = 请求参数;必填时 absent(值) 恒为 FALSE(SQL 里化简掉)
筛选:
  等于:     "or(absent(值), cmp(=, 列, 值))"
  大于:     "or(absent(值), cmp(>, 列, 值))"
  大于等于: "or(absent(值), cmp(>=, 列, 值))"
  小于:     "or(absent(值), cmp(<, 列, 值))"
  小于等于: "or(absent(值), cmp(<=, 列, 值))"
  前缀匹配: "or(absent(值), starts_with(列, 值))"
  属于:     "or(absent(值), in_list(列, 值))"       # 值 = 列表参数;空列表 / 不传 = 不筛选(必填 = 至少 1 个)

# 模式(套装): 关系元件的流水线。$ 开头的是编译器提供的部件:
#   $筛选   每个筛选条件一个 filter      $输出列  project(响应的列)
#   $游标   keyset 的游标条件(tuple_after) $排序    sort(排序列 + 方向)
#   $行数   limit(请求参数 row_limit,= page_size + 1)
模式:
  单条: [filter: $筛选, project: $输出列]
  分页: [filter: $筛选, project: $输出列, filter: $游标, sort: $排序, limit: $行数]
  计算: [filter: $筛选, project: $输出列]
