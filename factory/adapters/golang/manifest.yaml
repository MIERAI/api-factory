# Go 适配器的清单: 核心(审查/闸门/prompt 生成)需要知道的、和 Go 有关的一切都写在这里。
# 核心不写死任何语言的知识;换成别的语言时,写另一个适配器和清单。
name: go
manifest_version: "1"

# 占位符: {id} {domain} {method_snake} {proto_dir}(factory/jobs/v1) {proto_base}(jobs) {version}(v1)

# AI 负责的文件(按模式)。第一项是主文件(compute: 逻辑函数所在的文件)
ai_files:
  compute:
    - internal/handler/{domain}/{method_snake}_logic.go
    - internal/handler/{domain}/{method_snake}_logic_test.go
  custom:
    - internal/handler/{domain}/{method_snake}.go
    - internal/handler/{domain}/{method_snake}_test.go

# 给 AI 看的参考文件(prompt 里引用)
reference_files:
  handler_dir: internal/handler/{domain}
  handler_gen: internal/handler/{domain}/{method_snake}_gen.go
  query: gen/db/{id}.sql.go
  pb: gen/{proto_dir}/{proto_base}.pb.go
  connect: gen/{proto_dir}/{domain}{version}connect/{proto_base}.connect.go

# AI 实现用的 prompt 模板(相对本目录)
prompts:
  compute: prompts/compute.md
  custom: prompts/implement.md

# 路径闸门之外的代码检查(对 AI 改过的文件)
guard:
  forbidden_imports: ['"database/sql"', '"github.com/jackc/pgx', '"os/exec"', '"net/http"', '"unsafe"']
  # 禁止 SQL 字面量(查询必须来自式样书);测试文件除外
  raw_sql: "(?i)[\"`]\\s*(select|insert|update|delete)\\s"
  raw_sql_skip_suffix: _test.go
  # compute 的主文件必须是纯函数
  pure:
    forbidden_imports: ['"context"', '"os"', '"net"', '"math/rand"', '"sync"', '"github.com/MIERAI/api-factory-runtime', '"apifactory/gen/db"']
    forbidden_calls: "\\btime\\.(Now|Since|Until|Sleep|After|Tick)\\(|\\bgo\\s+func\\b"

# 从逻辑函数的桩里提取签名(prompt 里给 AI 看,签名只在桩里定义一次)
logic_signature: "(?m)^func \\w+Logic\\(.*\\) \\(.*\\)"

# 实现阶段允许 AI 使用的工具(claude -p --allowedTools)
ai_tools: "Read,Glob,Grep,Write,Edit,Bash(go build:*),Bash(go vet:*),Bash(go test:*)"

# 生成 proto 时加的文件级选项(语言相关)
proto_file_options:
  - 'go_package = "apifactory/gen/{proto_dir};{domain}{version}"'
