# ============================================================================
# 领域: jobs(异步任务)
#   关于"数据本身"的知识,这个领域的所有 API 共用。一个领域写一次,很少改。
#
#   谁来写:
#     [自动] = 工厂从数据库生成(表名、列名、主键、CHECK 约束里的取值)
#     [人]   = 负责这份数据的人补充(说明、枚举的含义、规则)
#   列的类型、能否为空以数据库为准(db/schema/jobs.sql),这里不重复写
# ============================================================================
领域: jobs                                           # [自动]
说明: 异步任务。调用方提交任务后,轮询状态等待结束     # [人]
时区: Asia/Tokyo                                       # [人] 例子里的时间按这个时区解释

枚举:
  JobStatus:
    说明: 任务的处理状态
    值:                         # [自动] 数据库值来自 CHECK (status IN (0,1,2));[人] 名字和说明
      PENDING:   { 说明: 未完成, 数据库值: 0 }
      SUCCEEDED: { 说明: 成功,   数据库值: 1 }
      FAILED:    { 说明: 失败,   数据库值: 2 }
    读到不认识的值: 返回"未指定",并记录到监控指标   # [人](默认值,一般不用改)

表:
  jobs:                         # [自动]
    说明: 任务                  # [人]
    主键: [id]                  # [自动]
    更新方式: 可以更新          # [人] 可以更新 / 只追加(带生效时间的历史数据)
    列:                         # [自动] 列名;[人] 说明
      id:          任务 id
      job_type:    任务类型(export / import ...)
      status:      { 说明: 处理状态, 枚举: JobStatus }
      created_at:  创建时间
      finished_at: 结束时间。成功或失败时写入,未完成时为空
    规则:                       # [自动] 数据库约束;[人] 数据库保证不了的规则
      - 规则: status 只能是 0 / 1 / 2
        数据库保证: 是          # CHECK 约束,不会被违反
      - 规则: 时间不会是 infinity
        数据库保证: 是
      - 规则: 成功或失败的任务一定有 finished_at
        数据库保证: 否          # 写入方的 bug 可能违反 → 用到的 API 要说明怎么处理
      - 规则: finished_at 不早于 created_at
        数据库保证: 否          # 写入方之间的时钟偏差可能违反

# 审查时问到"关于数据本身"的问题,回答记在 领域.审查.yaml(工厂写入,不用自己写)
