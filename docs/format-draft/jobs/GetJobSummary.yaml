# ============================================================================
API: GetJobSummary
说明: 按任务类型和期间,汇总任务的处理情况
背景: 运维看板用。看某类任务最近是否正常
负责人: platform-team
风险: 低

种类: 计算                        # 工厂负责取数据,AI 写"输入行 → 输出"的计算函数
数据来源: jobs
使用的列: [id, status, created_at, finished_at]

输入:
  job_type:     { 类型: 文本, 必填: 是, 长度: 1~64, 说明: 任务类型,     筛选: job_type 等于 }
  period_start: { 类型: 时间, 必填: 是, 说明: 期间的开始(含),         筛选: created_at 大于等于 }
  period_end:   { 类型: 时间, 必填: 是, 说明: 期间的结束(不含),       筛选: created_at 小于 }

输入之间的规则:
  - period_start 早于 period_end
  - period_start 到 period_end 不超过 31 天

输出:
  total:                { 类型: 整数64, 说明: 任务数 }
  succeeded:            { 类型: 整数64, 说明: 成功数 }
  failed:               { 类型: 整数64, 说明: 失败数 }
  pending:              { 类型: 整数64, 说明: 未完成数 }
  success_rate:         { 类型: 小数, 可以不设置: 是, 说明: 成功率 }
  avg_duration_seconds: { 类型: 小数, 可以不设置: 是, 说明: 平均处理时间(秒) }
  sla_breaches:         { 类型: 整数64, 说明: SLA 违约数 }
  health:               { 类型: 文本, 说明: 健康度 OK / DEGRADED / CRITICAL / NO_DATA }

业务规则:
  - 情况: 计数
    结果: 按 status 分别数成功、失败、未完成
  - 情况: 成功率
    结果: 成功 / (成功 + 失败),小数 4 位
  - 情况: 平均处理时间
    结果: 结束的任务的 finished_at - created_at 的平均(秒),小数 1 位
  - 情况: SLA
    结果: 处理时间超过 300 秒算违约
  - 情况: 健康度
    结果: |
      没有结束的任务 → NO_DATA
      成功率 >= 0.95 且没有违约 → OK
      成功率 >= 0.80 → DEGRADED
      其他 → CRITICAL

例子:
  准备数据:
    jobs:
      - { 重复: 19, id: 1~19, job_type: alpha, status: SUCCEEDED, created_at: 2026-11-01 00:01 起每行 +1分钟, 处理时间: 60秒 }
      - { id: 20, job_type: alpha, status: FAILED, created_at: 2026-11-01 00:20, finished_at: 2026-11-01 00:21 }
  用例:
    - 说明: 19 成功 1 失败 → 成功率 0.95,健康度 OK
      输入: { job_type: alpha, period_start: 2026-11-01 00:00, period_end: 2026-11-08 00:00 }
      结果: { total: 20, succeeded: 19, failed: 1, success_rate: 0.95, avg_duration_seconds: 60.0, health: OK }
    - 说明: 期间超过 31 天
      输入: { job_type: alpha, period_start: 2026-10-01 00:00, period_end: 2026-11-08 00:00 }
      结果: 参数错误
