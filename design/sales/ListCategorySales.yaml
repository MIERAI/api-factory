# ============================================================================
# ListCategorySales: 店別・部門別の売上(分组: 空になりうる键 + 最小 / 最大)
# ============================================================================
API: ListCategorySales
说明: 明細を店舗・部門ごとに集計する(合計・件数・値引き額の最小と最大)。部門が空の明細は「未分類」として 1 つにまとめる
背景: 部門別の売上分析。部門の未設定(空)は 1 グループ(空ごとに別の行にしない)。部門名は大文字・小文字を区別する
负责人: sales-team
风险: 低

种类: 多条
数据来源: sales_lines

输入:
  store_codes: { 类型: 整数32列表, 必填: 否, 说明: 店舗コード(不指定 = 全店), 筛选: store_code 属于 }

分组:
  键: [store_code, category]
  计算:
    total:        合计(amount)
    lines:        件数
    min_discount: 最小(discount)
    max_discount: 最大(discount)

输出:
  store_code:   店舗コード
  category:     部門(未分類は設定しない)
  total:        売上金額の合計
  lines:        明細の件数
  min_discount: 値引き額の最小(値引きのない明細は数えない。全部ないときは設定しない)
  max_discount: 値引き額の最大(同上)

排序: [store_code 小到大, category 小到大]
上限: 100
输出行名: CategorySale
输出列表名: categories

例子:
  准备数据:
    sales_lines:
      - { line_id: 1, sales_date: 2026-11-01, store_code: 1, category: food,  quantity: 1, amount: 100, discount: 1 }
      - { line_id: 2, sales_date: 2026-11-02, store_code: 1, category: food,  quantity: 1, amount: 50,  discount: null }
      - { line_id: 3, sales_date: 2026-11-01, store_code: 1, category: null,  quantity: 1, amount: 30,  discount: null }
      - { line_id: 4, sales_date: 2026-11-02, store_code: 1, category: null,  quantity: 2, amount: 20,  discount: 2.5 }
      - { line_id: 5, sales_date: 2026-11-01, store_code: 1, category: Food,  quantity: 1, amount: 5,   discount: null }
      - { line_id: 6, sales_date: 2026-11-01, store_code: 2, category: drink, quantity: 1, amount: 8,   discount: 0.5 }
      - { line_id: 7, sales_date: 2026-11-02, store_code: 2, category: drink, quantity: 1, amount: 2,   discount: 1.5 }
  用例:
    - 说明: "部門の空は 1 グループ(最後)。Food と food は別(バイト順で Food が先)。値引きの空は最小・最大に数えない"
      输入: {}
      结果:
        categories:
          - { store_code: 1, category: Food,   total: "5",   lines: 1, min_discount: 不设置, max_discount: 不设置 }
          - { store_code: 1, category: food,   total: "150", lines: 2, min_discount: "1",   max_discount: "1" }
          - { store_code: 1, category: 不设置, total: "50",  lines: 2, min_discount: "2.5", max_discount: "2.5" }
          - { store_code: 2, category: drink,  total: "10",  lines: 2, min_discount: "0.5", max_discount: "1.5" }
    - 说明: 店舗を指定
      输入: { store_codes: [2] }
      结果: { categories: [{ store_code: 2, category: drink, total: "10", lines: 2 }] }
    - 说明: 明細のない店は空
      输入: { store_codes: [9] }
      结果: { categories: [] }
