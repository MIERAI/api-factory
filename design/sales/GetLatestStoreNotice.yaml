# ============================================================================
# GetLatestStoreNotice: 店舗の最新のお知らせ 1 件(入力は分库キーだけ + 前N条 1)
#   お知らせは店舗コードで分库された追加型の表(JSON版本)。掲載日は整数 YYYYMMDD
# ============================================================================
API: GetLatestStoreNotice
说明: 店舗を指定して、掲載日が今日以前の現在のお知らせのうち掲載日が一番新しいもの(同じ日はお知らせ番号が大きいもの)を 1 件返す
背景: 店舗端末の起動画面。お知らせは変更のたびに版が増える表で、現在の値(最新の版)を使う。削除・論理削除されたお知らせは出さない。
  掲載日が今日(日本の日付)より後のお知らせ(掲載予約)と、掲載日がない・存在しない日付のお知らせは出さない。お知らせがなければ空(エラーにしない)
负责人: sales-team
风险: 低

种类: 前N条
数据来源: store_notices

输入:
  store_code: { 类型: 整数32, 必填: 是, 范围: "> 0", 说明: 店舗コード, 筛选: store_code 等于 }

固定条件: posted_ymd <= 今天     # 掲載予約(未来の掲載日)・掲載日なし・存在しない日付は出さない

输出:
  notice_no:  お知らせ番号
  title:      件名
  posted_ymd: 掲載日(YYYYMMDD の整数)

排序: [posted_ymd 新到旧, notice_no 大到小]
条数: 1
输出行名: StoreNotice
输出列表名: notices

业务规则:
  - 情况: 掲載日が一番新しいお知らせが削除・論理削除された
    结果: 残っているお知らせのうち掲載日が一番新しいもの
  - 情况: 同じ掲載日のお知らせが複数
    结果: お知らせ番号が大きいもの
  - 情况: 掲載日が今日より後(掲載予約)、掲載日がない、または存在しない日付(20261131 など)
    结果: 出さない(今日 = 日本の日付)
  - 情况: お知らせがない
    结果: 空の一覧

例子:
  现在: "2026-11-25 10:00"
  准备数据:
    store_notices:   # 上から順に登録された(後の行が新しい)
      - { store_code: 1, notice_no: 1, title: 年末の営業, posted_ymd: 20261101 }
      - { store_code: 1, notice_no: 2, title: 棚卸し,     posted_ymd: 20261110 }
      - { store_code: 1, notice_no: 3, title: 訂正前,     posted_ymd: 20261110 }
      - { store_code: 1, notice_no: 3, title: 臨時休業,   posted_ymd: 20261110 }   # 3 の新しい版
      - { store_code: 1, notice_no: 4, title: 取り消し,   posted_ymd: 20261120 }
      - { store_code: 1, notice_no: 4, 操作: 删除 }
      - { store_code: 1, notice_no: 5, title: 掲載予約,   posted_ymd: 20261201 }   # 未来: 出さない
      - { store_code: 1, notice_no: 6, title: 日付不正,   posted_ymd: 20261131 }   # 存在しない日付: 出さない
      - { store_code: 3, notice_no: 1, title: 改装,       posted_ymd: 20261001 }
  用例:
    - 说明: 一番新しい 4 は削除、5 は掲載予約、6 は存在しない日付。11/10 の 2 と 3 のうち番号が大きい 3(新しい版の件名)
      输入: { store_code: 1 }
      结果: { notices: [{ notice_no: 3, title: 臨時休業, posted_ymd: 20261110 }] }
    - 说明: 別の店舗(別の DB)
      输入: { store_code: 3 }
      结果: { notices: [{ notice_no: 1, title: 改装 }] }
    - 说明: お知らせのない店舗は空
      输入: { store_code: 2 }
      结果: { notices: [] }
