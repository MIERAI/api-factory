# ============================================================================
# ListDiscountedSales: 値引きのあった店舗(一览: 固定条件 + 十进制の並び + 平局)
# ============================================================================
API: ListDiscountedSales
说明: 売上日を指定して、値引きのあった店舗の売上を売上金額の大きい順に返す(分页)
背景: 値引きの多い店舗の確認。値引き額が空や 0 の店舗は対象外
负责人: sales-team
风险: 低

种类: 一览
数据来源: daily_sales

输入:
  sales_date: { 类型: 日期, 必填: 是, 说明: 売上日, 筛选: sales_date 等于 }

固定条件:
  - discount > 0

输出:
  store_code: 店舗コード
  amount:     売上金額
  discount:   値引き額

排序: [amount 大到小, store_code 大到小]
分页: { 默认每页: 20, 每页最多: 100 }
输出行名: DiscountedSale

例子:
  准备数据:
    daily_sales:
      - { sales_date: 2026-11-01, store_code: 1, amount: 100, discount: 5,    closed_on: null }
      - { sales_date: 2026-11-01, store_code: 2, amount: 100, discount: 0,    closed_on: null }   # 値引き 0 は対象外
      - { sales_date: 2026-11-01, store_code: 3, amount: 200, discount: null, closed_on: null }   # 空は対象外
      - { sales_date: 2026-11-01, store_code: 4, amount: 100, discount: 1,    closed_on: null }
      - { sales_date: 2026-11-01, store_code: 5, amount: 150, discount: 2,    closed_on: null }
  用例:
    - 说明: 金額の大きい順、同じ金額は店舗コードの大きい順。0 と空は出ない
      输入: { sales_date: 2026-11-01 }
      结果: { daily_sales: [{ store_code: 5 }, { store_code: 4 }, { store_code: 1 }] }
    - 说明: 値引きのない日は空
      输入: { sales_date: 2026-11-02 }
      结果: { daily_sales: [] }
