  - 问题: "値引き率正好在四舍五入的临界点时(例如 total_discount 0.5、total_amount 10000,率 = 0.00005)怎么算:先用十进制精确相除再进位,还是先转成小数(浮点)再进位?"
    选项: ["十进制精确计算", "先转浮点再舍入"]
    回答: "十进制精确计算"
    补充规则: { 情况: "计算値引き率", 结果: "用十进制精确相除,在十进制上按 0.5 向远离 0 的方向舍入到小数 4 位,最后才转成小数(例:0.5 / 10000 = 0.00005 → 0.0001)" }
