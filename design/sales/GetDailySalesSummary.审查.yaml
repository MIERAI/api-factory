问答:

  - 问题: "金额合计的小数部分怎么显示?例如店 1(100.50)和店 2(200)合计是 \"300.5\" 还是 \"300.50\";純売上 350.75 - 1.75 是 \"349\" 还是 \"349.00\"?"
    选项: ["去掉末尾多余的 0", "保留计算出来的位数"]
    回答: "去掉末尾多余的 0"
    补充规则: { 情况: "输出 total_amount、total_discount、net_amount", 结果: "按十进制的值输出,去掉小数部分末尾的 0,整数不带小数点(300.50 → \"300.5\",349.00 → \"349\",0 → \"0\")" }
