# ============================================================================
# ListStoreSalesRange: 店舗の売上を from〜to(両端含む)で返す
#   入力名が SQL の予約語(from / to)でも生成できることの例(参数名は SQL の中で引用される)
# ============================================================================
API: ListStoreSalesRange
说明: 店舗と期間(from〜to、両端を含む)を指定して、日別の売上を古い日から返す
背景: 外部の帳票ツールからの呼び出し。ツール側の項目名が from / to で決まっているので、入力名もそれに合わせる。
  to を省略すると from 以降すべて。売上のある日が 31 日分を超えるとエラー(期間を短くしてもらう)
负责人: sales-team
风险: 低

种类: 多条
数据来源: daily_sales

输入:
  store_code: { 类型: 整数32, 必填: 是, 范围: "> 0", 说明: 店舗コード, 筛选: store_code 等于 }
  from:       { 类型: 日期, 必填: 是, 说明: 期間の開始(含む), 筛选: sales_date 大于等于 }
  to:         { 类型: 日期, 必填: 否, 说明: 期間の終了(含む。省略 = 終わりなし), 筛选: sales_date 小于等于 }

输出:
  sales_date: 売上日
  amount:     売上金額
  discount:   値引き額

排序: [sales_date 旧到新]
上限: 31
输出行名: RangeSale

业务规则:
  - 情况: from が to より後
    结果: 空の一覧(エラーにはしない。帳票ツールが空の期間をそのまま表示する)
  - 情况: 期間内の売上が 31 日分を超える
    结果: エラー(FAILED_PRECONDITION)。途中で切り捨てない

例子:
  准备数据:
    daily_sales:
      - { sales_date: 2026-11-01, store_code: 1, amount: 100, discount: null, closed_on: null }
      - { sales_date: 2026-11-02, store_code: 1, amount: 110, discount: 5,    closed_on: null }
      - { sales_date: 2026-11-03, store_code: 1, amount: 120, discount: null, closed_on: null }
      - { sales_date: 2026-11-02, store_code: 2, amount: 90,  discount: null, closed_on: null }
  用例:
    - 说明: 両端を含む
      输入: { store_code: 1, from: 2026-11-01, to: 2026-11-02 }
      结果: { daily_sales: [{ sales_date: 2026-11-01, amount: "100" }, { sales_date: 2026-11-02, amount: "110", discount: "5" }] }
    - 说明: to を省略 = from 以降すべて
      输入: { store_code: 1, from: 2026-11-02 }
      结果: { daily_sales: [{ sales_date: 2026-11-02 }, { sales_date: 2026-11-03 }] }
    - 说明: from が to より後 → 空
      输入: { store_code: 1, from: 2026-11-03, to: 2026-11-01 }
      结果: { daily_sales: [] }
