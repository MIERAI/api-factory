# ============================================================================
# ListTopLineStores: 売上日の明細を店別に合計し、合計の多い上位 5 店(分组 + 合计 + 件数 + 前N条)
# ============================================================================
API: ListTopLineStores
说明: 売上日を指定して、明細の売上金額を店別に合計し、合計の多い上位 5 店を返す(明細の件数つき)
背景: 日次のランキング表示。明細から直接集計する(日別の集計表を待たない)。金額は十进制のまま合計する
负责人: sales-team
风险: 低

种类: 前N条
数据来源: sales_lines

输入:
  sales_date: { 类型: 日期, 必填: 是, 说明: 売上日, 筛选: sales_date 等于 }

分组: { 键: [store_code], 计算: { total: 合计(amount), lines: 件数 } }

输出:
  store_code: 店舗コード
  total:      売上金額の合計
  lines:      明細の件数

排序: [total 大到小, store_code 小到大]
条数: 5
输出行名: StoreLineTotal
输出列表名: stores

例子:
  准备数据:
    sales_lines:
      - { line_id: 1,  sales_date: 2026-11-01, store_code: 1, category: food,  quantity: 2, amount: 100.50, discount: null }
      - { line_id: 2,  sales_date: 2026-11-01, store_code: 1, category: drink, quantity: 1, amount: 20,     discount: 0.50 }
      - { line_id: 3,  sales_date: 2026-11-01, store_code: 2, category: food,  quantity: 3, amount: 120.25, discount: null }
      - { line_id: 4,  sales_date: 2026-11-01, store_code: 3, category: null,  quantity: 1, amount: 9,      discount: null }
      - { line_id: 5,  sales_date: 2026-11-01, store_code: 4, category: food,  quantity: 1, amount: 10,     discount: 1 }
      - { line_id: 6,  sales_date: 2026-11-01, store_code: 4, category: drink, quantity: 1, amount: 0.75,   discount: null }
      - { line_id: 11, sales_date: 2026-11-01, store_code: 7, category: food,  quantity: 1, amount: 0.5,    discount: null }
      - { line_id: 12, sales_date: 2026-11-01, store_code: 8, category: food,  quantity: 1, amount: 0.25,   discount: null }
      - { line_id: 7,  sales_date: 2026-11-02, store_code: 1, category: food,  quantity: 5, amount: 999,    discount: null }
      - { line_id: 8,  sales_date: 2026-11-03, store_code: 6, category: food,  quantity: 1, amount: 4,      discount: null }
      - { line_id: 9,  sales_date: 2026-11-03, store_code: 6, category: food,  quantity: 1, amount: 6,      discount: null }
      - { line_id: 10, sales_date: 2026-11-03, store_code: 5, category: drink, quantity: 2, amount: 10,     discount: null }
  用例:
    - 说明: 店別に合計して上位 5 店。10.75 は 9 より大きい(数値で比べる)。6 位以下は返さない
      输入: { sales_date: 2026-11-01 }
      结果: { stores: [{ store_code: 1, total: "120.5", lines: 2 }, { store_code: 2, total: "120.25", lines: 1 }, { store_code: 4, total: "10.75", lines: 2 }, { store_code: 3, total: "9", lines: 1 }, { store_code: 7, total: "0.5", lines: 1 }] }
    - 说明: 1 店だけの日
      输入: { sales_date: 2026-11-02 }
      结果: { stores: [{ store_code: 1, total: "999", lines: 1 }] }
    - 说明: 合計が同じ店は店舗コードの小さい順
      输入: { sales_date: 2026-11-03 }
      结果: { stores: [{ store_code: 5, total: "10", lines: 1 }, { store_code: 6, total: "10", lines: 2 }] }
    - 说明: 明細のない日は空(合計 0 の行は返さない)
      输入: { sales_date: 2026-11-04 }
      结果: { stores: [] }
