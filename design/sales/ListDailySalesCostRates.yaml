# ============================================================================
# ListDailySalesCostRates: 日別売上 + その日に適用されていた原価率(按日期的关联)+ 今日の原価率
#   按日期: 键相等、開始日 ≤ 参照(最終日があれば 参照 ≤ 最終日)の行のうち開始日が最大の行。对方的列 = 常量(rate_kind = 'STD')
# ============================================================================
API: ListDailySalesCostRates
说明: 店舗の売上を from〜to(両端を含む)で日付順に返す。各日に適用されていた通常の原価率と、今日の通常の原価率をつける
背景: 粗利の見込み計算。原価率は改定すると行が増える履歴(区分 STD = 通常 / SALE = 特売。ここでは通常だけ)。
  ある日の原価率 = その日に有効な改定(開始日 ≤ その日、最終日が入っていればその日 ≤ 最終日)のうち開始日が一番新しいもの。
  期間限定の改定(最終日あり)が終わった翌日からは、その前から続いている改定に戻る。今日 = 店舗のある日本の日付。
  1 回の要求は最大 62 日分(超えたらエラーにして期間を短くしてもらう)
负责人: sales-team
风险: 中

种类: 多条
数据来源: daily_sales

关联:
  std_rate:
    表: store_cost_rates
    条件: [store_code = store_code, rate_kind = 'STD']
    按日期: { 开始: valid_from, 最后一天: valid_to, 参照: sales_date }
    列: { cost_rate: cost_rate, rate_from: valid_from }
  current_rate:
    表: store_cost_rates
    条件: [store_code = store_code, rate_kind = 'STD']
    按日期: { 开始: valid_from, 最后一天: valid_to, 参照: 今天 }
    列: { current_cost_rate: cost_rate }

输入:
  store_code: { 类型: 整数32, 必填: 是, 范围: "> 0", 说明: 店舗コード, 筛选: store_code 等于 }
  from:       { 类型: 日期, 必填: 是, 说明: 期間の開始(含む), 筛选: sales_date 大于等于 }
  to:         { 类型: 日期, 必填: 否, 说明: 期間の終了(含む。省略 = 終わりなし), 筛选: sales_date 小于等于 }

输出:
  sales_date:        売上日
  amount:            売上金額
  cost_rate:         その日に適用されていた通常の原価率(なし = 不设置)
  rate_from:         その原価率の適用開始日(なし = 不设置)
  current_cost_rate: 今日の通常の原価率(なし = 不设置)

排序: [sales_date 旧到新]
上限: 62
输出行名: SaleWithCostRate

业务规则:
  - 情况: 売上日が改定の開始日と同じ
    结果: その改定の原価率(開始日は含む)
  - 情况: 売上日が改定の最終日と同じ
    结果: その改定の原価率(最終日は含む)
  - 情况: 期間限定の改定が終わった後の日
    结果: その日に有効な改定(前から続いている改定)の原価率。有効な改定がなければ原価率なし
  - 情况: 特売(SALE)の原価率
    结果: 使わない(通常 STD だけ)
  - 情况: 期間内の売上が 62 日分を超える
    结果: エラー(FAILED_PRECONDITION)。途中で切り捨てない

例子:
  现在: "2026-11-05 08:30"      # 日本の 11/5(UTC ではまだ 11/4)
  准备数据:
    daily_sales:
      - { sales_date: 2026-10-31, store_code: 1, amount: 100, discount: null, closed_on: null }
      - { sales_date: 2026-11-01, store_code: 1, amount: 110, discount: null, closed_on: null }
      - { sales_date: 2026-11-02, store_code: 1, amount: 120, discount: null, closed_on: null }
      - { sales_date: 2026-11-03, store_code: 1, amount: 130, discount: null, closed_on: null }
      - { sales_date: 2026-11-01, store_code: 2, amount: 90,  discount: null, closed_on: null }
    store_cost_rates:
      - { store_code: 1, rate_kind: STD,  valid_from: 2026-04-01, valid_to: null,       cost_rate: 0.70 }
      - { store_code: 1, rate_kind: STD,  valid_from: 2026-11-01, valid_to: 2026-11-02, cost_rate: 0.65 }   # 11/1〜11/2 だけ
      - { store_code: 1, rate_kind: SALE, valid_from: 2026-10-01, valid_to: null,       cost_rate: 0.50 }   # 特売: 使わない
      - { store_code: 1, rate_kind: STD,  valid_from: 2026-11-05, valid_to: null,       cost_rate: 0.68 }   # 今日から
      - { store_code: 2, rate_kind: STD,  valid_from: 2026-11-02, valid_to: null,       cost_rate: 0.60 }
  用例:
    - 说明: 11/1(開始日)・11/2(最終日)は期間限定の 0.65、10/31 と 11/3(期間限定が終わった翌日)は前から続いている 0.70。今日(日本の 11/5)の原価率は 0.68
      输入: { store_code: 1, from: 2026-10-31 }
      结果:
        daily_sales:
          - { sales_date: 2026-10-31, cost_rate: "0.70", rate_from: 2026-04-01, current_cost_rate: "0.68" }
          - { sales_date: 2026-11-01, cost_rate: "0.65", rate_from: 2026-11-01, current_cost_rate: "0.68" }
          - { sales_date: 2026-11-02, cost_rate: "0.65", rate_from: 2026-11-01, current_cost_rate: "0.68" }
          - { sales_date: 2026-11-03, cost_rate: "0.70", rate_from: 2026-04-01, current_cost_rate: "0.68" }
    - 说明: 開始日より前の売上は原価率なし。UTC ではまだ 11/4 の時刻だが今日 = 11/5
      输入: { store_code: 2, from: 2026-11-01, to: 2026-11-01 }
      结果: { daily_sales: [{ sales_date: 2026-11-01, amount: "90", cost_rate: 不设置, current_cost_rate: "0.60" }] }
    - 说明: 日本の 11/4 23:59 では今日 = 11/4。11/5 からの改定はまだ、期間限定(11/1〜11/2)は終わっているので今日の原価率は 0.70
      现在: "2026-11-04 23:59"
      输入: { store_code: 1, from: 2026-11-03 }
      结果: { daily_sales: [{ sales_date: 2026-11-03, cost_rate: "0.70", current_cost_rate: "0.70" }] }
