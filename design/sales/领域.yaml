# ============================================================================
# 领域: sales(日别・店别の売上)
#   日期 / 十进制(numeric)类型的示例。列的类型、能否为空以数据库为准(db/schema/sales.sql)
# ============================================================================
领域: sales
说明: 日别・店别の売上
时区: Asia/Tokyo

表:
  daily_sales:
    说明: 日别・店别の売上(一天一店一行)
    主键: [sales_date, store_code]
    更新方式: 可以更新
    列:
      sales_date: 売上日
      store_code: 店舗コード
      amount:     売上金額(十进制,保持精度)
      discount:   値引き額(没有值引时为空)
      closed_on:  締め日(未締めは空)
  store_prices:
    说明: 店別の売価(有効期間つき)。店舗ごとの DB に分かれている
    主键: [store_code, product_code, valid_from]
    分库: store_code
    更新方式: 可以更新
    列:
      store_code:   店舗コード
      product_code: 商品コード
      valid_from:   適用開始日(含)
      valid_to:     適用終了日(含;空 = 期限なし)
      price:        売価
  price_changes:
    说明: 売価変更の指示(店舗 × 商品 × 指示日)
    主键: [store_code, product_code, proc_date]
    更新方式: 可以更新
    列:
      store_code:   店舗コード
      product_code: 商品コード
      proc_date:    指示日
      new_price:    新売価(未定は空)
      old_price:    旧売価(新規は空)
      deal_id:      取引ID(空 = 通常の売変。99999999 = 強制送信)
  sales_lines:
    说明: 売上明細(1 行 = レシートの 1 明細)。分组 / 排名 の例
    主键: [line_id]
    更新方式: 可以更新
    列:
      line_id:    明細ID
      sales_date: 売上日
      store_code: 店舗コード
      category:   部門(未分類は空)
      quantity:   数量
      amount:     売上金額(十进制)
      discount:   値引き額(値引きなしは空)
