# ============================================================================
# 领域: ledger(账户和扣款)
#   消息(R4)的样例领域: 写操作发出事件、消息处理器(幂等消费)、每项 / 仅当 / 墓碑(设计稿 r4-events-messages §9)
# ============================================================================
领域: ledger
说明: 账户和扣款。开户发出事件;转账的扣款、撤销、结算由命令消息驱动,一笔转账可以扣多个账户(全部或全不)
时区: Asia/Tokyo

表:
  accounts:
    说明: 账户
    主键: [account_id]
    更新方式: 可以更新
    列:
      account_id: 账户 id(大写英文字母、数字和 -,3~32 个字符)
      owner:      户主(1~64 个字符)
      balance:    可用余额(不会小于 0)
      held:       已扣下、还没结算的金额
      opened_at:  开户时间
    规则:
      - 规则: balance 不小于 0(不透支)
        数据库保证: 是
  debits:
    说明: 一笔转账在一个账户上的扣款
    主键: [transfer_id, account_id]
    更新方式: 可以更新
    列:
      transfer_id: 转账号
      account_id:  账户 id
      amount:      金额
      status:      { 说明: 扣款的状态, 枚举: DebitStatus }
      debited_at:  记录时间
  account_activity:
    说明: 账户的动态(以事件 id 为主键)
    主键: [event_id]
    更新方式: 可以更新
    列:
      event_id:    事件 id
      account_id:  账户 id
      kind:        { 说明: 动态的种类, 枚举: ActivityKind }
      balance:     当时的余额
      recorded_at: 记录时间

枚举:
  DebitStatus:
    说明: 扣款的状态
    值:
      HELD:     { 说明: 已扣下(还没结算), 数据库值: 1 }
      SETTLED:  { 说明: 已结算, 数据库值: 2 }
      REVERSED: { 说明: 已撤销(或者撤销先到的墓碑), 数据库值: 3 }
    读到不认识的值: 返回"未指定",并记录到监控指标
  ActivityKind:
    说明: 动态的种类
    值:
      OPENED:       { 说明: 开户, 数据库值: 1 }
      LARGE_OPENED: { 说明: 大额开户(开户金额 100 万以上), 数据库值: 2 }
    读到不认识的值: 返回"未指定",并记录到监控指标
