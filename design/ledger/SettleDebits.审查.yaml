问答:

  - 问题: "消息里每项的 amount 和 debits 里记录的金额不一样时(例: 消息写 ACC-001 结算 40,扣款记录是 50),要怎么处理?"
    选项: ["保持现在的行为(按扣款记录的金额结算)", "金额不一致 → 死信"]
    回答: "已经直接修改了设计书"
    改了设计: "金额和扣款记录不同 → 结果 AMOUNT_MISMATCH(当: 任一项 确认.amount <> 项.amount,处理: 死信)+ 例子"
    来自: "SettleDebits 的审查 2026-11-22 20261122-215048-claude-ledger.settle-debits"

  - 问题: "账户的 held 比要结算的扣款金额少时(例: held 是 20,扣款 50),要怎么处理?"
    选项: ["保持现在的行为(数据库拒绝,按系统错误处理)", "held 不够 → 死信(带原因)"]
    回答: "已经直接修改了设计书"
    改了设计: "结算 加 条件 held >= 确认.amount,不满足 HELD_SHORT(处理: 死信)+ 例子"
    来自: "SettleDebits 的审查 2026-11-22 20261122-215048-claude-ledger.settle-debits"

  - 问题: "已经结算过的扣款再收到结算消息、但消息里的金额和扣款记录不同时,是照样成功(跳过并发出 account.settled),还是进 DLQ(AMOUNT_MISMATCH)?例: transfer 6 的 ACC-001 已经 SETTLED,金额 20;重发的消息写 amount 15。"
    选项: ["保持现在的行为(金额不同 → 死信)", "已结算的只看状态,照样成功"]
    回答: "保持现在的行为(金额不同 → 死信)"
    补充规则: { 情况: "扣款已经结算过,但消息里的金额和扣款记录的金额不同", 结果: "不提交,进 DLQ(AMOUNT_MISMATCH),不发出 account.settled" }
    来自: "SettleDebits 的审查 2026-11-22 20261122-220056-claude-ledger.settle-debits"

  - 问题: "一条消息同时满足几个死信原因时,记成哪一个?例: transfer 7 的 ACC-001 扣款记录是 50(HELD),消息写 40,账户的 held 只有 45。这时结算会因为 held 不够失败(HELD_SHORT),而金额也不一致(AMOUNT_MISMATCH)。"
    选项: ["按结果里写的顺序(HELD_SHORT 最优先)", "先看消息本身(撤销 → 金额 → held)"]
    回答: "已经直接修改了设计书"
    改了设计: "先看消息本身: 结果按 ALREADY_REVERSED → AMOUNT_MISMATCH → HELD_SHORT 的顺序;held 的检查改成只读的检查更新(不满足: 跳过)+ 当"
    来自: "SettleDebits 的审查 2026-11-22 20261122-220056-claude-ledger.settle-debits"

  - 问题: "消息里只列出了这笔转账的一部分账户时,没列出的扣款要怎么处理?例: transfer 8 在 ACC-001 和 ACC-002 上都有 HELD 的扣款,结算消息只写了 ACC-002。"
    选项: ["保持现在的行为(只结算列出的账户)", "没列全 → 死信"]
    回答: "保持现在的行为(只结算列出的账户)"
    补充规则: { 情况: "消息里没有列出这笔转账的某些账户", 结果: "只结算列出的账户,照样发出 account.settled;没列出的扣款保持原样(由发消息的一方保证列全)" }
    来自: "SettleDebits 的审查 2026-11-22 20261122-220056-claude-ledger.settle-debits"

  - 问题: "一条消息里有的账户已撤销、有的账户根本没有这笔扣款时,应该记成毒消息,还是 ALREADY_REVERSED?例: transfer 8 的结算消息写了 ACC-001(扣款已撤销)和 ACC-003(没有 transfer 8 的扣款)。"
    选项: ["保持现在的行为(找不到扣款最优先 → 毒消息)", "先记撤销,再看找不到"]
    回答: "保持现在的行为(找不到扣款最优先 → 毒消息)"
    补充规则: { 情况: "消息里有任一账户找不到这笔转账的扣款(不管其他账户是否已撤销、金额是否不同、held 是否不够)", 结果: "整条消息按毒消息处理(DLQ),什么都不写,不发出 account.settled;不再判定 ALREADY_REVERSED / AMOUNT_MISMATCH / HELD_SHORT" }
    来自: "SettleDebits 的审查 2026-11-22 20261122-220646-claude-ledger.settle-debits"
