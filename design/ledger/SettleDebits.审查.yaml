问答:

  - 问题: "消息里每项的 amount 和 debits 里记录的金额不一样时(例: 消息写 ACC-001 结算 40,扣款记录是 50),要怎么处理?"
    选项: ["保持现在的行为(按扣款记录的金额结算)", "金额不一致 → 死信"]
    回答: "已经直接修改了设计书"
    改了设计: "金额和扣款记录不同 → 结果 AMOUNT_MISMATCH(当: 任一项 确认.amount <> 项.amount,处理: 死信)+ 例子"
    来自: "SettleDebits 的审查 2026-11-22 20261122-215048-claude-ledger.settle-debits"

  - 问题: "账户的 held 比要结算的扣款金额少时(例: held 是 20,扣款 50),要怎么处理?"
    选项: ["保持现在的行为(数据库拒绝,按系统错误处理)", "held 不够 → 死信(带原因)"]
    回答: "已经直接修改了设计书"
    改了设计: "结算 加 条件 held >= 确认.amount,不满足 HELD_SHORT(处理: 死信)+ 例子"
    来自: "SettleDebits 的审查 2026-11-22 20261122-215048-claude-ledger.settle-debits"
