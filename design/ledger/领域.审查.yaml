问答:

  - 问题: "扣款是 HELD、但 accounts 里没有这个账户时(例: debits 里有 transfer 7 / ACC-009 的 HELD 扣款,而 ACC-009 不在 accounts 里),要怎么处理?"
    选项: ["保持现在的行为(和找不到扣款一样 → 毒消息)", "单独记一个死信原因"]
    回答: "保持现在的行为(和找不到扣款一样 → 毒消息)"
    补充规则: { 情况: "要结算的扣款是 HELD,但 accounts 里没有这个账户", 结果: "整条消息按毒消息处理(DLQ),什么都不写,不发出 account.settled;和找不到扣款一样优先,不再判定 ALREADY_REVERSED / AMOUNT_MISMATCH / HELD_SHORT" }
