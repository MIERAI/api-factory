# ============================================================================
# DebitAccounts: 收到 account.debit → 从多个账户扣款,全部或全不(消息处理器: 每项 + 仅当 + 业务结果)
# ============================================================================
API: DebitAccounts
说明: 一笔转账从多个账户扣款。每个账户余额都够才扣(全部或全不),回答 account.debited 或 account.debit_failed
背景: 转账的流程发命令过来,至少投递一次、不保证顺序。重投(同一个 id)只处理一次;同样内容的新命令(重发)也不能扣两次;撤销先到了(墓碑)就不再扣
负责人: platform-team
风险: 高

种类: 消息处理
收到: account.debit
每项: 消息.lines

操作:
  - 记账:
      幂等新建: debits
      键: [transfer_id, account_id]
      值: { transfer_id: 消息.transfer_id, account_id: 项.account_id, amount: 项.amount, status: HELD, debited_at: 现在 }
  - 扣款:
      更新: accounts
      键: { account_id: 项.account_id }
      仅当: 记账.新建
      设置: { balance: "balance - 项.amount", held: "held + 项.amount" }
      条件: "balance >= 项.amount"
      不满足: INSUFFICIENT_FUNDS
      找不到时: "account not found (transfer {transfer_id})"

结果:
  REVERSED:
    当: "任一项 记账.status = REVERSED"
    发出:
      - account.debit_failed: { transfer_id: 消息.transfer_id, reason: "'REVERSED'" }
  INSUFFICIENT_FUNDS:
    发出:
      - account.debit_failed: { transfer_id: 消息.transfer_id, reason: "'INSUFFICIENT_FUNDS'" }
  成功:
    发出:
      - account.debited: { transfer_id: 消息.transfer_id, lines: 消息.lines }

业务规则:
  - 情况: 每个账户的余额都够
    结果: 每个账户记一条 HELD 的扣款、余额减少、held 增加;发出 account.debited
  - 情况: 某个账户余额不够
    结果: 一个账户都不扣、不记(前面已经扣的也回滚);发出 account.debit_failed(INSUFFICIENT_FUNDS)
  - 情况: 撤销先到了(有 REVERSED 的墓碑)
    结果: 不扣;发出 account.debit_failed(REVERSED)
  - 情况: 同样内容的命令再来(新 id)
    结果: 已经记过的账户不再扣(仅当 记账.新建),照样回答 account.debited
  - 情况: 账户不存在
    结果: 毒消息(进 DLQ,人来处理),什么都不写

例子:
  现在: "2026-11-22 10:00"
  准备数据:
    accounts:
      - { account_id: "ACC-001", owner: alice, balance: 500, held: 0, opened_at: "2026-11-01 09:00" }
      - { account_id: "ACC-002", owner: bob,   balance: 100, held: 20, opened_at: "2026-11-01 09:00" }
    debits:
      - { transfer_id: 9, account_id: "ACC-001", amount: 30, status: REVERSED, debited_at: "2026-11-21 09:00" }
  用例:
    - 说明: 两个账户都够 → 都扣,发出 account.debited
      消息: { transfer_id: 7, lines: [ { account_id: "ACC-002", amount: 100 }, { account_id: "ACC-001", amount: 50 } ] }
      结果: 成功
      发出:
        - account.debited: { transfer_id: 7, lines: [ { account_id: "ACC-002", amount: 100 }, { account_id: "ACC-001", amount: 50 } ] }
      之后:
        accounts:
          - { account_id: "ACC-001", balance: 450, held: 50 }
          - { account_id: "ACC-002", balance: 0, held: 120 }
        debits:
          - { transfer_id: 9, account_id: "ACC-001", status: REVERSED }
          - { transfer_id: 7, account_id: "ACC-001", amount: 50, status: HELD, debited_at: "2026-11-22 10:00" }
          - { transfer_id: 7, account_id: "ACC-002", amount: 100, status: HELD }
    - 说明: 第二个账户不够 → 一个都不扣,发出 account.debit_failed
      消息: { transfer_id: 7, lines: [ { account_id: "ACC-001", amount: 50 }, { account_id: "ACC-002", amount: 101 } ] }
      结果: INSUFFICIENT_FUNDS
      发出:
        - account.debit_failed: { transfer_id: 7, reason: INSUFFICIENT_FUNDS }
      之后: 不变
    - 说明: 撤销先到了 → 不扣,发出 account.debit_failed(REVERSED)
      消息: { transfer_id: 9, lines: [ { account_id: "ACC-001", amount: 30 } ] }
      结果: REVERSED
      发出:
        - account.debit_failed: { transfer_id: 9, reason: REVERSED }
      之后: 不变
    - 说明: 账户不存在 → 毒消息,什么都不写
      消息: { transfer_id: 8, lines: [ { account_id: "NONE-1", amount: 1 } ] }
      结果: 毒消息
      发出: []
      之后: 不变
