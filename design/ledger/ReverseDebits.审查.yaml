问答:

  - 问题: "收到撤销时,某个账户的扣款已经是 SETTLED(已结算),现在的行为是跳过这个账户、钱不退,但整条消息仍然发出 account.reversed(撤销完成)。这是想要的吗?"
    选项: ["保持现在的行为:跳过并照常发出", "整条消息失败,进 DLQ 由人处理"]
    回答: "已经直接修改了设计书"
    改了设计: "已经结算的扣款 → 结果 ALREADY_SETTLED(当: 任一项 撤销.status = SETTLED,处理: 死信)+ 例子"
    来自: "ReverseDebits 的审查 2026-11-22 20261122-214953-claude-ledger.reverse-debits"

  - 问题: "撤销消息里的金额和扣款记录的金额不一样时(例: 扣款记录 50,消息里写 30),现在的行为是按扣款记录的 50 退回,消息里的 30 被忽略。这是想要的吗?"
    选项: ["保持现在的行为:按扣款记录的金额退", "金额不一致 → 整条消息失败,进 DLQ"]
    回答: "保持现在的行为:按扣款记录的金额退"
    补充规则: { 情况: "消息里的金额和扣款记录的金额不同", 结果: "按扣款记录的金额退回余额、减少 held;消息里的金额只用于没到的扣款的墓碑" }
    来自: "ReverseDebits 的审查 2026-11-22 20261122-214953-claude-ledger.reverse-debits"

  - 问题: "扣款是 HELD,但账户的 held 比扣款金额少时(例: transfer 7 / ACC-001 的扣款 50 是 HELD,而 accounts 里 ACC-001 的 held 只有 30),撤销要怎么处理?"
    选项: ["保持现在的行为(数据库拒绝,整条消息失败)", "和 SettleDebits 一样:HELD_SHORT 进 DLQ"]
    回答: "已经直接修改了设计书"
    改了设计: "和 SettleDebits 一样: 只读的检查更新(held >= 撤销.amount,不满足: 跳过)+ 结果 HELD_SHORT(处理: 死信)+ 例子"
    来自: "ReverseDebits 的审查 2026-11-22 20261122-221242-claude-ledger.reverse-debits"

  - 问题: "转账 7 在 ACC-001 上的扣款已经是 SETTLED(已结算),这时收到撤销:现在会跳过(钱不退回),但仍然发出 account.reversed。发起方会以为补偿已经完成,这是想要的吗?"
    选项: ["保持现在的行为", "已结算的撤销进 DLQ"]
    回答: "已结算的撤销进 DLQ"
    补充规则: { 情况: "要撤销的扣款已经是 SETTLED", 结果: "整条消息失败,什么都不写,不发出 account.reversed,进 DLQ 由人处理;已经是 REVERSED(重复撤销或墓碑)的照样跳过" }
    来自: "ReverseDebits 的审查 2026-11-22 20261122-223518-claude-ledger.reverse-debits"
