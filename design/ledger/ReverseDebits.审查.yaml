问答:

  - 问题: "收到撤销时,某个账户的扣款已经是 SETTLED(已结算),现在的行为是跳过这个账户、钱不退,但整条消息仍然发出 account.reversed(撤销完成)。这是想要的吗?"
    选项: ["保持现在的行为:跳过并照常发出", "整条消息失败,进 DLQ 由人处理"]
    回答: "已经直接修改了设计书"
    改了设计: "已经结算的扣款 → 结果 ALREADY_SETTLED(当: 任一项 撤销.status = SETTLED,处理: 死信)+ 例子"
    来自: "ReverseDebits 的审查 2026-11-22 20261122-214953-claude-ledger.reverse-debits"

  - 问题: "撤销消息里的金额和扣款记录的金额不一样时(例: 扣款记录 50,消息里写 30),现在的行为是按扣款记录的 50 退回,消息里的 30 被忽略。这是想要的吗?"
    选项: ["保持现在的行为:按扣款记录的金额退", "金额不一致 → 整条消息失败,进 DLQ"]
    回答: "保持现在的行为:按扣款记录的金额退"
    补充规则: { 情况: "消息里的金额和扣款记录的金额不同", 结果: "按扣款记录的金额退回余额、减少 held;消息里的金额只用于没到的扣款的墓碑" }
    来自: "ReverseDebits 的审查 2026-11-22 20261122-214953-claude-ledger.reverse-debits"
