# ============================================================================
# SettleDebits: 收到 account.settle → 结算扣款(消息处理器: 跳过 + 仅当 已更新 + 死信的结果)
# ============================================================================
API: SettleDebits
说明: "结算一笔转账的扣款: HELD → SETTLED,held 减少。扣款已经撤销了 → 进 DLQ(需要人处理)"
背景: 转账成功之后结算。重复的结算不能减两次;结算时发现扣款已撤销是不该发生的异常,不能悄悄成功
负责人: platform-team
风险: 高

种类: 消息处理
收到: account.settle
每项: 消息.lines

操作:
  - 确认:
      更新: debits
      键: { transfer_id: 消息.transfer_id, account_id: 项.account_id }
      设置: { status: SETTLED }
      条件: "status = HELD"
      不满足: 跳过
      找不到时: "debit not found (transfer {transfer_id})"
  - 结算:
      更新: accounts
      键: { account_id: 项.account_id }
      仅当: 确认.已更新
      设置: { held: "held - 确认.amount" }
      找不到时: "account not found (transfer {transfer_id})"

结果:
  ALREADY_REVERSED:
    当: "任一项 确认.status = REVERSED"
    处理: 死信
  成功:
    发出:
      - account.settled: { transfer_id: 消息.transfer_id }

业务规则:
  - 情况: 扣款是 HELD
    结果: 改成 SETTLED,held 减少扣款的金额
  - 情况: 已经结算过
    结果: 跳过(重发),照样发出 account.settled
  - 情况: 扣款已经撤销
    结果: 不提交,进 DLQ(ALREADY_REVERSED,需要人处理)
  - 情况: 没有这笔扣款
    结果: 毒消息(DLQ)

例子:
  准备数据:
    accounts:
      - { account_id: "ACC-001", owner: alice, balance: 450, held: 80, opened_at: "2026-11-01 09:00" }
    debits:
      - { transfer_id: 7, account_id: "ACC-001", amount: 50, status: HELD, debited_at: "2026-11-21 09:00" }
      - { transfer_id: 8, account_id: "ACC-001", amount: 30, status: REVERSED, debited_at: "2026-11-21 09:00" }
  用例:
    - 说明: HELD → SETTLED,held 减少
      消息: { transfer_id: 7, lines: [ { account_id: "ACC-001", amount: 50 } ] }
      结果: 成功
      发出:
        - account.settled: { transfer_id: 7 }
      之后:
        accounts:
          - { account_id: "ACC-001", balance: 450, held: 30 }
        debits:
          - { transfer_id: 7, account_id: "ACC-001", status: SETTLED }
          - { transfer_id: 8, account_id: "ACC-001", status: REVERSED }
    - 说明: 已经撤销了 → 死信(不提交)
      消息: { transfer_id: 8, lines: [ { account_id: "ACC-001", amount: 30 } ] }
      结果: ALREADY_REVERSED
      发出: []
      之后: 不变
