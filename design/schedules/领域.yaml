# ============================================================================
# 领域: schedules(任务类型的定时设置)
#   命令工厂(写入)的样例领域: 和 storefront 无关的写接口(设计稿 r3-command-factory §0)
# ============================================================================
领域: schedules
说明: 任务类型的定时设置。运维画面上查看和修改
时区: Asia/Tokyo

表:
  job_schedules:
    说明: 任务类型的定时设置(一个任务类型一行)
    主键: [job_type]
    更新方式: 可以更新
    列:
      job_type:   任务类型
      cron:       执行的时刻(cron 的写法,例 "0 3 * * *")
      enabled:    是否启用
      version:    版本号。写接口的乐观锁,每次更新加 1
      updated_at: 最后更新时间
    规则:
      - 规则: job_type 1~64 个字符,cron 1~100 个字符
        数据库保证: 是
      - 规则: version 大于 0
        数据库保证: 是
      - 规则: cron 是合法的 cron 写法
        数据库保证: 否          # 数据库只检查长度;执行方读到不合法的写法时跳过并报警
