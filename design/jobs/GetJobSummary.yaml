      - { id: 121, job_type: mu, status: SUCCEEDED, created_at: 2026-11-07 18:00, finished_at: 2026-11-07 18:05:00.5 }
  用例:
    - 说明: alpha — 0.95 刚好 OK,期间边界外不计
      输入: { job_type: alpha, period_end: 2026-11-08 09:00, period_start: 2026-11-01 09:00 }
      结果: { total: 20, succeeded: 19, failed: 1, pending: 0, success_rate: 0.95, avg_duration_seconds: 60.0, sla_breaches: 0, health: OK }
    - 说明: beta — 300 秒不算违约 / 数据不一致的行 / 0.75 CRITICAL
      输入: { job_type: beta, period_end: 2026-11-08 09:00, period_start: 2026-11-01 09:00 }
      结果: { total: 5, succeeded: 3, failed: 1, pending: 1, success_rate: 0.75, avg_duration_seconds: 233.7, sla_breaches: 1, health: CRITICAL }
    - 说明: gamma — 全部未完成 → NO_DATA,比率和平均不设置
      输入: { job_type: gamma, period_end: 2026-11-08 09:00, period_start: 2026-11-01 09:00 }
      结果: { total: 2, succeeded: 0, failed: 0, pending: 2, success_rate: 不设置, avg_duration_seconds: 不设置, sla_breaches: 0, health: NO_DATA }
    - 说明: delta — 0.80 刚好 DEGRADED
      输入: { job_type: delta, period_end: 2026-11-08 09:00, period_start: 2026-11-01 09:00 }
      结果: { total: 5, succeeded: 4, failed: 1, success_rate: 0.8, avg_duration_seconds: 10.0, sla_breaches: 0, health: DEGRADED }
    - 说明: epsilon — 成功率 1.0 但有违约 → DEGRADED
      输入: { job_type: epsilon, period_end: 2026-11-08 09:00, period_start: 2026-11-01 09:00 }
      结果: { total: 2, succeeded: 2, success_rate: 1.0, avg_duration_seconds: 205.0, sla_breaches: 1, health: DEGRADED }
    - 说明: zeta — 2/3 → 0.6667,平均 1.666… → 1.7
      输入: { job_type: zeta, period_end: 2026-11-08 09:00, period_start: 2026-11-01 09:00 }
      结果: { total: 3, succeeded: 2, failed: 1, success_rate: 0.6667, avg_duration_seconds: 1.7, health: CRITICAL }
    - 说明: eta — 负的处理时间不参与平均和 SLA / 失败任务也算违约
      输入: { job_type: eta, period_end: 2026-11-08 09:00, period_start: 2026-11-01 09:00 }
      结果: { total: 3, succeeded: 2, failed: 1, pending: 0, success_rate: 0.6667, avg_duration_seconds: 310.0, sla_breaches: 1, health: CRITICAL }
    - 说明: theta — finished_at 全部为 NULL → 平均不设置,health 仍为 OK
      输入: { job_type: theta, period_end: 2026-11-08 09:00, period_start: 2026-11-01 09:00 }
      结果: { total: 2, succeeded: 2, failed: 0, success_rate: 1.0, avg_duration_seconds: 不设置, sla_breaches: 0, health: OK }
    - 说明: kappa — 小数秒 / 0 秒有效 / 0.25 → 0.3(0.5 远离零)
      输入: { job_type: kappa, period_end: 2026-11-08 09:00, period_start: 2026-11-01 09:00 }
      结果: { total: 2, succeeded: 1, failed: 1, success_rate: 0.5, avg_duration_seconds: 0.3, sla_breaches: 0, health: CRITICAL }
    - 说明: lambda — 全部失败 → success_rate 设置为 0.0
      输入: { job_type: lambda, period_end: 2026-11-08 09:00, period_start: 2026-11-01 09:00 }
      结果: { total: 1, failed: 1, success_rate: 0.0, avg_duration_seconds: 1.0, health: CRITICAL }
    - 说明: mu — 300.5 秒算违约
      输入: { job_type: mu, period_end: 2026-11-08 09:00, period_start: 2026-11-01 09:00 }
      结果: { total: 1, succeeded: 1, success_rate: 1.0, avg_duration_seconds: 300.5, sla_breaches: 1, health: DEGRADED }
    - 说明: 不存在的 job_type → 0 件 NO_DATA
      输入: { job_type: nothing, period_end: 2026-11-08 09:00, period_start: 2026-11-01 09:00 }
      结果: { total: 0, success_rate: 不设置, avg_duration_seconds: 不设置, health: NO_DATA }
    - 说明: 期间缩小后只剩 alpha 的前 3 件
      输入: { job_type: alpha, period_end: 2026-11-01 09:04, period_start: 2026-11-01 09:00 }
      结果: { total: 3, succeeded: 3, success_rate: 1.0, health: OK }
    - 说明: 期间颠倒
      输入: { job_type: alpha, period_end: 2026-11-01 09:00, period_start: 2026-11-08 09:00 }
      结果: 参数错误
    - 说明: 期间恰好 31 天(744 小时)是允许的
      输入: { job_type: alpha, period_end: 2026-11-08 09:00, period_start: 2026-10-08 09:00 }
      结果: { total: 21 }
    - 说明: period_start = period_end
      输入: { job_type: alpha, period_end: 2026-11-01 09:00, period_start: 2026-11-01 09:00 }
      结果: 参数错误
    - 说明: 期间超过 31 天
      输入: { job_type: alpha, period_end: 2026-11-08 09:00, period_start: 2026-10-01 09:00 }
      结果: 参数错误
