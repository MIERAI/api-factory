      - { id: 91, job_type: theta, status: SUCCEEDED, created_at: 2026-11-07 13:00, finished_at: null }
      - { id: 92, job_type: theta, status: SUCCEEDED, created_at: 2026-11-07 14:00, finished_at: null }
