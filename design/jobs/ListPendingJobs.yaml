# ============================================================================
# ListPendingJobs: 未完了の任務(一览: 固定条件 为空 + 任意の属于 + 時刻の範囲)
# ============================================================================
API: ListPendingJobs
说明: まだ終わっていない任務を古い順に返す(分页)
背景: 滞留の監視画面。終了時刻が空 = まだ終わっていない
负责人: platform-team
风险: 低

种类: 一览
数据来源: jobs

输入:
  job_types:     { 类型: 文本列表, 必填: 否, 个数: "0~20", 长度: 1~64, 说明: 任務の種類(不指定 = 全部), 筛选: job_type 属于 }
  created_after: { 类型: 时间, 必填: 否, 说明: 作成時刻の下限(含), 筛选: created_at 大于等于 }

固定条件:
  - finished_at 为空

输出:
  id:         任務 id
  job_type:   任務の種類
  status:     処理状態
  created_at: 作成時刻

排序: [created_at 旧到新, id 小到大]
分页: { 默认每页: 20, 每页最多: 100 }
输出行名: PendingJob

例子:
  准备数据:
    jobs:
      - { id: 1, job_type: export, status: PENDING,   created_at: 2026-11-01 09:00, finished_at: null }
      - { id: 2, job_type: import, status: PENDING,   created_at: 2026-11-02 09:00, finished_at: null }
      - { id: 3, job_type: export, status: SUCCEEDED, created_at: 2026-11-03 09:00, finished_at: 2026-11-03 09:05 }
      - { id: 4, job_type: export, status: PENDING,   created_at: 2026-11-04 09:00, finished_at: null }
  用例:
    - 说明: 終わっていない任務だけ、古い順
      输入: {}
      结果: { jobs: [1, 2, 4] }
    - 说明: 種類で絞る
      输入: { job_types: [export] }
      结果: { jobs: [1, 4] }
    - 说明: 作成時刻の下限(含)
      输入: { created_after: 2026-11-02 09:00 }
      结果: { jobs: [2, 4] }
