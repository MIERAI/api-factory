# ============================================================================
# GetJobStatus: 按 id 返回一个任务的处理状态
# ============================================================================
API: GetJobStatus
说明: 按 id 返回一个任务的处理状态
背景: 调用方在提交异步任务后,轮询这个 API 等待任务结束
负责人: platform-team
风险: 低                         # 低 / 中 / 高

种类: 按键取一条                  # 按键取一条 / 一览 / 计算
数据来源: jobs

输入:
  job_id: { 类型: 整数64, 必填: 是, 范围: "> 0", 说明: 任务 id, 筛选: id 等于 }

输出:                             # 不写类型时,和数据来源的同名列一致
  status: 处理状态(JobStatus)

找不到时: "job not found: {job_id}"

# 只写业务上关心的例子。参数校验、找不到等"机制"由工厂自动测试
例子:
  准备数据:
    jobs:
      - { id: 102,        status: SUCCEEDED }
      - { id: 3000000000, status: FAILED }      # 实际的 id 已经超过 32 位整数的范围
  用例:
    - 说明: 普通的 id
      输入: { job_id: 102 }
      结果: { status: SUCCEEDED }
    - 说明: 超过 32 位整数范围的 id 也能查到
      输入: { job_id: 3000000000 }
      结果: { status: FAILED }
