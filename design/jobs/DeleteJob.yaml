# ============================================================================
# DeleteJob: 删除一个任务(命令: 按键删除)
# ============================================================================
API: DeleteJob
说明: 删除一个任务(物理删除),返回删除的任务
背景: 误登记的任务由登记方撤回。只按 id 删除(不带版本号,撤回不和状态的报告竞争)
负责人: platform-team
风险: 中

种类: 按键删除
数据来源: jobs

输入:
  job_id: { 类型: 整数64, 必填: 是, 范围: "> 0", 说明: 任务 id, 键: id }

输出:                             # 删除的行
  id:       任务 id
  job_type: 任务类型
  status:   删除时的状态

找不到时: "job not found: {job_id}"

业务规则:
  - 情况: 任务已经结束(成功或失败)
    结果: 照样删除(任何状态都可以删除;撤回误登记不看状态)

例子:
  准备数据:
    jobs:
      - { id: 7, job_type: export, status: PENDING, created_at: "2026-11-01 09:00" }
      - { id: 8, job_type: import, status: FAILED,  created_at: "2026-11-01 10:00", finished_at: "2026-11-01 10:01" }
  用例:
    - 说明: 删除 → 返回删除的任务,别的任务不变
      输入: { job_id: 7 }
      结果: { id: 7, job_type: export, status: PENDING }
      之后:
        jobs:
          - { id: 8, job_type: import, status: FAILED }
    - 说明: 已经结束的任务也可以删除
      输入: { job_id: 8 }
      结果: { id: 8, status: FAILED }
      之后:
        jobs:
          - { id: 7, status: PENDING }
    - 说明: 不存在的任务 → 找不到
      输入: { job_id: 99 }
      错误: 找不到
      之后: 不变
