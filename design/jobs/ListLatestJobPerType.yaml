# ============================================================================
# ListLatestJobPerType: 種類ごとの最新の任務(多条: 每组取一条)
# ============================================================================
API: ListLatestJobPerType
说明: 任務の種類ごとに、いちばん新しく作られた任務を返す
背景: 運用画面の種類別サマリ。種類は数十程度
负责人: platform-team
风险: 低

种类: 多条
数据来源: jobs

输出:
  job_type:   任務の種類
  id:         任務 id
  status:     処理状態
  created_at: 作成時刻

每组取一条: { 按: [job_type], 取: created_at 最大、id 最大 }   # 同じ時刻なら id の大きい方(取の列 + 按の列で 1 行に決まること)
排序: [job_type 小到大]
上限: 100
输出行名: LatestJobOfType

例子:
  准备数据:
    jobs:
      - { id: 1, job_type: export, status: SUCCEEDED, created_at: 2026-11-01 09:00, finished_at: 2026-11-01 09:05 }
      - { id: 2, job_type: import, status: FAILED,    created_at: 2026-11-02 09:00, finished_at: 2026-11-02 09:01 }
      - { id: 3, job_type: export, status: PENDING,   created_at: 2026-11-03 09:00, finished_at: null }
  用例:
    - 说明: 種類ごとに最新の 1 件、種類の順
      输入: {}
      结果: { jobs: [{ job_type: export, id: 3 }, { job_type: import, id: 2 }] }
