# ============================================================================
# ListCategoryProducts: カテゴリの商品 + カテゴリ名 + ラベル(嵌套)+ ラベル数(子聚合)。子表・关联の相手が逻辑表
# ============================================================================
API: ListCategoryProducts
说明: カテゴリを指定して、そのカテゴリの商品(現在の値)を、カテゴリ名・ラベル(最大 3 件)・ラベル数つきで返す
背景: 売場の商品一覧。商品・ラベル・カテゴリはどれも変更のたびに行が追加される表(JSON版本)で、すべて現在の値(最新の版)で見る。
  ラベルは 1 商品 3 件までの運用で、超える商品はデータの誤り → 黙って切り捨てず、一覧ごとエラーにして気づかせる
负责人: catalog-team
风险: 中

种类: 多条
数据来源: product_master

关联:
  category: { 表: category_master, 条件: [category = category], 列: { category_title: title }, 找不到时: 保留 }

嵌套:
  labels:
    表: product_label
    条件: [product_code = product_code]
    排序: [label_code 小到大]
    上限: 3
    列: { label: label_code, text: text }
    行名: ProductLabelItem

子聚合:
  label_count: { 表: product_label, 条件: [product_code = product_code], 计算: 件数 }

输入:
  category: { 类型: 文本, 必填: 是, 长度: 1~20, 说明: カテゴリ, 筛选: category 等于 }

输出:
  product_code:   商品コード
  name:           商品名
  category_title: カテゴリ名(カテゴリが削除・論理削除されているときは不设置)
  labels:         ラベル(ラベルコード順、既定のラベル(空)は最後。最大 3 件、超える商品があると一覧ごとエラー)
  label_count:    ラベルの数(削除されたラベルは数えない。ラベルなし = 0)

排序: [product_code 小到大]
上限: 200
输出行名: CategoryProductRow
输出列表名: products

业务规则:
  - 情况: 商品のカテゴリが変わった
    结果: 最新の版のカテゴリで探す(古い版のカテゴリでは出ない)
  - 情况: ラベルが削除された / ラベルの新しい版
    结果: 削除されたラベルは labels にも label_count にも入らない。版が複数あるラベルは最新の版の文言で 1 件
  - 情况: 既定のラベル(ラベルコードが空)
    结果: 1 件のラベルとして数え、並びは最後
  - 情况: ある商品のラベルが 3 件を超える(運用上の上限。超えるのはデータの誤り)
    结果: 一覧ごと FAILED_PRECONDITION(ラベルを切り捨てて返さない)
  - 情况: 結果が 200 件を超える
    结果: エラー(FAILED_PRECONDITION)。途中で切り捨てない

例子:
  准备数据:
    product_master:   # 上から順に登録された(後の行が新しい)
      - { product_code: "100", name: りんご,   category: fruit, price: 100, launched_on: null }
      - { product_code: "100", name: 青りんご, category: fruit, price: 120, launched_on: null }
      - { product_code: "200", name: バナナ,   category: fruit, price: 50,  launched_on: null }
      - { product_code: "200", 操作: 删除 }
      - { product_code: "300", name: トマト,   category: fruit, price: 70,  launched_on: null }
      - { product_code: "300", name: トマト,   category: veg,   price: 70,  launched_on: null }   # fruit → veg に変わった
      - { product_code: "700", name: もも,     category: fruit, price: 300, launched_on: null }
      - { product_code: "800", name: 積み木,   category: toy,   price: 900, launched_on: null }
    category_master:
      - { category: fruit, title: くだもの, sort_no: 1 }
      - { category: fruit, title: 果物,     sort_no: 1 }   # fruit の新しい版
      - { category: veg,   title: 野菜,     sort_no: 2 }
      - { category: veg,   title: 野菜,     sort_no: 2, 操作: 逻辑删除 }
    product_label:
      - { product_code: "100", label_code: null, text: 既定 }
      - { product_code: "100", label_code: "A",  text: 特売 }
      - { product_code: "100", label_code: "B",  text: 旧 }
      - { product_code: "100", label_code: "B",  操作: 删除 }
      - { product_code: "100", label_code: "C",  text: 産地 }
      - { product_code: "100", label_code: "C",  text: 産地2 }    # C の新しい版
      - { product_code: "300", label_code: "A",  text: 夏 }
      - { product_code: "800", label_code: "1",  text: 1 }
      - { product_code: "800", label_code: "2",  text: 2 }
      - { product_code: "800", label_code: "3",  text: 3 }
      - { product_code: "800", label_code: "4",  text: 4 }        # 800 はラベルが 4 件(上限超え)
  用例:
    - 说明: 100 のラベルは A / C(最新の版)/ 既定(空は最後)の 3 件。B は削除済み。700 はラベルなし(空の一覧、0 件)。200 は削除、300 は今は veg なので出ない
      输入: { category: fruit }
      结果: { products: [{ product_code: "100", name: 青りんご, category_title: 果物, labels: [{ label: "A", text: 特売 }, { label: "C", text: 産地2 }, { label: null, text: 既定 }], label_count: 3 }, { product_code: "700", name: もも, category_title: 果物, labels: [], label_count: 0 }] }
    - 说明: 300 は最新の版のカテゴリ veg で出る。veg は論理削除されているのでカテゴリ名は不设置
      输入: { category: veg }
      结果: { products: [{ product_code: "300", name: トマト, category_title: null, labels: [{ label: "A", text: 夏 }], label_count: 1 }] }
    - 说明: ラベルが上限(3 件)を超える商品がある → 一覧ごとエラー
      输入: { category: toy }
      结果: 超过上限
    - 说明: 該当なし
      输入: { category: none }
      结果: { products: [] }
