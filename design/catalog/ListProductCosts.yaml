# ============================================================================
# ListProductCosts: 商品 + 発売日時点の通常原価 + 今日の通常原価(逻辑表への按日期的关联、整数编码的日期 YYYYMMDD)
#   原価の履歴も商品マスタも JSON版本(現在の版)。履歴の開始日・最終日は整数 YYYYMMDD。对方的列 = 常量(cost_kind = 'STD')
# ============================================================================
API: ListProductCosts
说明: カテゴリを指定して、商品(現在の値)を、発売日に適用されていた通常原価と今日の通常原価つきで商品コード順に返す
背景: 原価の見直し画面。原価は改定のたびに版が増える履歴(区分 STD = 通常 / SALE = 特売。ここでは通常だけ)で、日付は旧システムの
  整数 YYYYMMDD のまま。ある日の原価 = その日に有効な改定(開始日 ≤ その日、最終日が入っていればその日 ≤ 最終日)のうち開始日が一番新しいもの。
  存在しない日付(20260230 など)の改定は使わない。今日 = 日本の日付
负责人: catalog-team
风险: 中

种类: 多条
数据来源: product_master

关联:
  launch_cost:
    表: product_cost
    条件: [product_code = product_code, cost_kind = 'STD']
    按日期: { 开始: valid_from, 最后一天: valid_to, 参照: launched_on }
    列: { launch_cost: cost }
  current_cost:
    表: product_cost
    条件: [product_code = product_code, cost_kind = 'STD']
    按日期: { 开始: valid_from, 最后一天: valid_to, 参照: 今天 }
    列: { current_cost: cost, current_from: valid_from }

输入:
  category: { 类型: 文本, 必填: 是, 长度: 1~20, 说明: カテゴリ, 筛选: category 等于 }

输出:
  product_code: 商品コード
  name:         商品名
  launched_on:  発売日(未設定 = 不设置)
  launch_cost:  発売日に適用されていた通常原価(発売日が未設定・有効な改定なし = 不设置)
  current_cost: 今日の通常原価(有効な改定なし = 不设置)
  current_from: 今日の通常原価の適用開始日(YYYYMMDD の整数。なし = 不设置)

排序: [product_code 小到大]
上限: 200
输出行名: ProductCostRow
输出列表名: products

业务规则:
  - 情况: 改定の開始日・最終日が存在しない日付(20260230 など)
    结果: その改定は使わない(最終日だけが不正でも使わない。無期限扱いにしない)
  - 情况: 期間限定の改定(最終日あり)が終わった後
    结果: その日に有効な改定のうち開始日が一番新しいもの。なければ原価なし
  - 情况: 改定が削除・論理削除された(最新の版が削除)
    结果: その改定は使わない(古い版に戻らない)
  - 情况: 特売(SALE)の原価
    结果: 使わない
  - 情况: 結果が 200 件を超える
    结果: エラー(FAILED_PRECONDITION)。途中で切り捨てない

例子:
  现在: "2026-11-05 08:30"      # 日本の 11/5(UTC ではまだ 11/4)
  准备数据:
    product_master:
      - { product_code: "100", name: りんご,   category: fruit, price: 100, launched_on: 2026-04-01 }
      - { product_code: "200", name: バナナ,   category: fruit, price: 50,  launched_on: null }
      - { product_code: "300", name: にんじん, category: veg,   price: 80,  launched_on: 2026-01-10 }
    product_cost:   # 上から順に登録された(後の行が新しい)
      - { product_code: "100", cost_kind: STD,  valid_from: 20260101, valid_to: null,     cost: 60 }
      - { product_code: "100", cost_kind: STD,  valid_from: 20260101, valid_to: null,     cost: 61 }   # 同じ改定の新しい版
      - { product_code: "100", cost_kind: SALE, valid_from: 20260301, valid_to: null,     cost: 40 }   # 特売: 使わない
      - { product_code: "100", cost_kind: STD,  valid_from: 20261101, valid_to: 20261104, cost: 55 }   # 11/1〜11/4 だけ
      - { product_code: "100", cost_kind: STD,  valid_from: 20260230, valid_to: null,     cost: 1 }    # 存在しない日付: 使わない
      - { product_code: "200", cost_kind: STD,  valid_from: 20260101, valid_to: 20261331, cost: 30 }   # 最終日が不正: 使わない
      - { product_code: "200", cost_kind: STD,  valid_from: 20251201, valid_to: null,     cost: 31 }
      - { product_code: "200", cost_kind: STD,  valid_from: 20261105, valid_to: null,     cost: 32 }   # 今日から
      - { product_code: "200", cost_kind: STD,  valid_from: 20261105, 操作: 删除 }                    # 削除された
  用例:
    - 说明: "100 の発売日(4/1)は 61(新しい版)。今日(日本の 11/5)は期間限定(〜11/4)が終わったので 61。200 は発売日なし、今日は 31(今日からの改定は削除、最終日が不正な改定は使わない)"
      输入: { category: fruit }
      结果:
        products:
          - { product_code: "100", launch_cost: "61", current_cost: "61", current_from: 20260101 }
          - { product_code: "200", launched_on: 不设置, launch_cost: 不设置, current_cost: "31", current_from: 20251201 }
    - 说明: 日本の 11/4 23:59 では今日 = 11/4 → 期間限定の 55
      现在: "2026-11-04 23:59"
      输入: { category: fruit }
      结果: { products: [{ product_code: "100", current_cost: "55", current_from: 20261101 }, { product_code: "200", current_cost: "31" }] }
    - 说明: 原価の履歴がない商品は原価なし
      输入: { category: veg }
      结果: { products: [{ product_code: "300", launch_cost: 不设置, current_cost: 不设置, current_from: 不设置 }] }
