# ============================================================================
# 领域: catalog(商品マスタ: 追加型の JSON 版本表の例)
# ============================================================================
领域: catalog
说明: 商品マスタ。変更のたびに 1 行追加される(上書きしない)
时区: Asia/Tokyo

表:
  product_master:
    说明: 商品マスタの現在の値(商品コードごとに最新に登録された行)
    存储: JSON版本
    原始表: product_events
    主键: [product_code]
    逻辑删除: deleted = 1
    字段:
      product_code: { 类型: 文本,   说明: 商品コード }
      name:         { 类型: 文本,   说明: 商品名 }
      category:     { 类型: 文本,   说明: カテゴリ }
      price:        { 类型: 十进制, 说明: 標準売価 }
      launched_on:  { 类型: 日期,   说明: 発売日 }
      maker_zip:    { 类型: 邮编,   说明: メーカー所在地の郵便番号 }

  product_label:
    说明: 商品の表示ラベル(商品 × ラベルコードごとに最新の版)。ラベルコードが空 = 既定のラベル
    存储: JSON版本
    原始表: product_label_events
    主键: [product_code, label_code]
    字段:
      product_code: { 类型: 文本, 说明: 商品コード }
      label_code:   { 类型: 文本, 可以为空: 是, 说明: ラベルコード(空 = 既定のラベル。空も 1 つのキーとして版を管理する) }
      text:         { 类型: 文本, 说明: 表示文言 }
