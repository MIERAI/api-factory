# ============================================================================
# 领域: receipts(売上明細)
#   分组 / 排名(group / rank)の示例。列的类型、能否为空以数据库为准(db/schema/receipts.sql)
# ============================================================================
领域: receipts
说明: 売上明細(レシートの明細)と、その集計
时区: Asia/Tokyo

表:
  sales_lines:
    说明: 売上明細(1 行 = レシートの 1 明細)
    主键: [line_id]
    更新方式: 可以更新
    列:
      line_id:    明細ID
      sales_date: 売上日
      store_code: 店舗コード
      category:   部門(未分類は空。空文字は入れない)
      quantity:   数量(1 以上)
      amount:     売上金額(十进制、0 以上)
      discount:   値引き額(値引きなしは空。0 は入れない)
    规则:
      - { 规则: "category が空文字の明細はない(未分類は空 = NULL で表す)", 数据库保证: 是 }
      - { 规则: "discount は空か 0 より大きい(値引きなしは空で表す。0 は入れない)", 数据库保证: 是 }
