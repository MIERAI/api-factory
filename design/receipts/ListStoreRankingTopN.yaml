# ============================================================================
# ListStoreRankingTopN: 売上日の店別合計の順位が N 位以内の店(分组 + 排名 + 分组之后的筛选: 同順位はすべて返す)
# ============================================================================
API: ListStoreRankingTopN
说明: 売上日を指定して、明細の売上金額を店別に合計し、合計の順位が N 位以内の店をすべて返す(同順位の店は全部含めるので、N 店を超えることがある)
背景: 日次ランキングの表彰対象の抽出。順位は SQL の RANK() と同じ決め方(同額は同順位、次の順位は飛ばす)。
  「上位 N 店で打ち切り」(前N条)と違い、N 位と同額の店を落とさない。合計の下限を指定すると、順位をつけたあとで下限未満の店を除く
  (順位は下限で除く前の全店の中での順位のまま)。1 日の店舗数は 1000 店以下の前提
负责人: receipts-team
风险: 低

种类: 多条
数据来源: sales_lines

输入:
  sales_date: { 类型: 日期, 必填: 是, 说明: 売上日, 筛选: sales_date 等于 }
  top_n:      { 类型: 整数32, 必填: 是, 范围: "1~100", 说明: 順位の上限(この順位以内の店をすべて返す), 筛选: rank 小于等于 }
  min_total:  { 类型: 十进制, 必填: 否, 说明: 合計の下限(含。不指定 = 下限なし。順位をつけたあとで除く), 筛选: total 大于等于 }

分组: { 键: [store_code], 计算: { total: 合计(amount), lines: 件数 } }
排名: { 排序: [total 大到小], 输出: rank }

输出:
  store_code: 店舗コード
  total:      売上金額の合計(十進数の文字列)
  lines:      明細の件数
  rank:       順位(合計の多い順。同額は同順位、次の順位は飛ばす)

排序: [rank 小到大, store_code 小到大]
上限: 1000
输出行名: RankedStore
输出列表名: stores

业务规则:
  - 情况: N 位に同額の店が複数ある
    结果: 全部返す(N 店を超えてもよい)。例 合計 10, 8, 8, 5 で top_n = 2 → 順位 1, 2, 2 の 3 店
  - 情况: N 位の直前で同額が切れる
    结果: 順位は飛ぶので、N 位の店がいないことがある。例 合計 10, 8, 8, 5 で top_n = 3 → 順位 1, 2, 2 の 3 店(4 位の店は入らない)
  - 情况: 合計の下限
    结果: 順位は全店で決めてから、合計が下限未満の店を除く(除いても順位は詰めない)
  - 情况: 合計の書き方
    结果: total は十進数の文字列で、値として扱う("8.00" と "8" は同じ値。末尾の 0 の有無は区別しない。合計は明細の金額をそのまま足した値で、桁を揃え直さない)。例の "8" は "8.00" で返っても同じ結果とみなす
  - 情况: 明細のない売上日
    结果: 空の一覧
  - 情况: 結果が 1000 店を超える
    结果: エラー(FAILED_PRECONDITION)。途中で切り捨てない

例子:
  准备数据:
    sales_lines:
      - { line_id: 1,  sales_date: 2026-11-01, store_code: 1, category: food,  quantity: 1, amount: 10,   discount: null }
      - { line_id: 2,  sales_date: 2026-11-01, store_code: 2, category: food,  quantity: 1, amount: 5,    discount: null }
      - { line_id: 3,  sales_date: 2026-11-01, store_code: 2, category: drink, quantity: 1, amount: 3,    discount: null }
      - { line_id: 4,  sales_date: 2026-11-01, store_code: 3, category: food,  quantity: 1, amount: 8.00, discount: null }
      - { line_id: 5,  sales_date: 2026-11-01, store_code: 4, category: null,  quantity: 1, amount: 5,    discount: null }
      - { line_id: 6,  sales_date: 2026-11-01, store_code: 5, category: food,  quantity: 1, amount: 0,    discount: null }
      - { line_id: 7,  sales_date: 2026-11-02, store_code: 1, category: food,  quantity: 1, amount: 7,    discount: null }
      - { line_id: 8,  sales_date: 2026-11-02, store_code: 2, category: food,  quantity: 1, amount: 7,    discount: null }
      - { line_id: 9,  sales_date: 2026-11-02, store_code: 3, category: food,  quantity: 1, amount: 7,    discount: null }
  用例:
    - 说明: 合計 10, 8, 8, 5, 0 → 順位 1, 2, 2, 4, 5。top_n = 2 は 2 位の同額 2 店を両方返す(3 店。N 店で打ち切らない)
      输入: { sales_date: 2026-11-01, top_n: 2 }
      结果: { stores: [{ store_code: 1, total: "10", lines: 1, rank: 1 }, { store_code: 2, total: "8", lines: 2, rank: 2 }, { store_code: 3, total: "8", lines: 1, rank: 2 }] }
    - 说明: top_n = 3 → 3 位の店はいない(順位が 2 から 4 に飛ぶ)ので同じ 3 店
      输入: { sales_date: 2026-11-01, top_n: 3 }
      结果: { stores: [{ store_code: 1, rank: 1 }, { store_code: 2, rank: 2 }, { store_code: 3, rank: 2 }] }
    - 说明: top_n = 1 → 1 位だけ
      输入: { sales_date: 2026-11-01, top_n: 1 }
      结果: { stores: [{ store_code: 1, total: "10", lines: 1, rank: 1 }] }
    - 说明: 合計 0 の店も順位がつく(top_n = 5 で全 5 店)
      输入: { sales_date: 2026-11-01, top_n: 5 }
      结果: { stores: [{ store_code: 1, rank: 1 }, { store_code: 2, rank: 2 }, { store_code: 3, rank: 2 }, { store_code: 4, total: "5", rank: 4 }, { store_code: 5, total: "0", rank: 5 }] }
    - 说明: 合計の下限 8(含)→ 順位は全店で決めたまま、合計 8 未満の店を除く。8.00 と 8 は同じ値
      输入: { sales_date: 2026-11-01, top_n: 5, min_total: "8" }
      结果: { stores: [{ store_code: 1, rank: 1 }, { store_code: 2, rank: 2 }, { store_code: 3, total: "8", rank: 2 }] }
    - 说明: 下限で除いても順位は詰めない(4 位の店だけ残る)
      输入: { sales_date: 2026-11-01, top_n: 4, min_total: "5" }
      结果: { stores: [{ store_code: 1, rank: 1 }, { store_code: 2, rank: 2 }, { store_code: 3, rank: 2 }, { store_code: 4, total: "5", rank: 4 }] }
    - 说明: 全店同額 → 全店 1 位。top_n = 1 でも 3 店
      输入: { sales_date: 2026-11-02, top_n: 1 }
      结果: { stores: [{ store_code: 1, total: "7", rank: 1 }, { store_code: 2, total: "7", rank: 1 }, { store_code: 3, total: "7", rank: 1 }] }
    - 说明: 明細のない日は空
      输入: { sales_date: 2026-11-03, top_n: 3 }
      结果: { stores: [] }
    - 说明: top_n が範囲外(0)
      输入: { sales_date: 2026-11-01, top_n: 0 }
      结果: 参数错误
