# ============================================================================
# 领域: runs(任务的执行: 额度、执行记录、执行请求)
#   命令工厂(写入)R3-2 的样例领域: 组合命令 / 条件更新 / 幂等新建(设计稿 r3-command-factory §0、§2)
# ============================================================================
领域: runs
说明: 任务的执行。每个任务类型有执行额度,开始执行时扣一次额度并留下执行记录和第一条日志
时区: Asia/Tokyo

表:
  job_quotas:
    说明: 每个任务类型剩下的执行额度(一个任务类型一行;运维定期补充)
    主键: [job_type]
    更新方式: 可以更新
    列:
      job_type:   任务类型
      remaining:  剩下的额度(次数,不会小于 0)
      updated_at: 最后更新时间
    规则:
      - 规则: remaining 不小于 0(不超额执行)
        数据库保证: 是
  job_runs:
    说明: 任务的一次执行(id 由数据库生成)
    主键: [id]
    更新方式: 可以更新
    列:
      id:         执行 id
      job_type:   任务类型(job_quotas 里有的)
      status:     { 说明: 执行的状态, 枚举: RunStatus }
      started_at: 开始时间
  job_run_logs:
    说明: 执行的日志
    主键: [id]
    更新方式: 可以更新
    列:
      id:        日志 id
      run_id:    执行 id
      message:   内容(1~200 个字符)
      logged_at: 记录时间
  job_requests:
    说明: 任务的执行请求。调用方带请求 id(大写英文字母、数字和 -,8~64 个字符),重复提交只登记一次
    主键: [request_id]
    更新方式: 可以更新
    列:
      request_id:  请求 id
      job_type:    任务类型
      priority:    优先级(1~9)
      received_at: 收到的时间(第一次)

枚举:
  RunStatus:
    说明: 执行的状态
    值:
      RUNNING: { 说明: 执行中, 数据库值: 1 }
      DONE:    { 说明: 完成, 数据库值: 2 }
      FAILED:  { 说明: 失败, 数据库值: 3 }
    读到不认识的值: 返回"未指定",并记录到监控指标
