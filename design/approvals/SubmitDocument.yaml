# ============================================================================
# SubmitDocument: 提交一个文档(状态机 DocumentReview 的初始转移: 新建文档 + 评审人,发出 review.request)
# ============================================================================
API: SubmitDocument
说明: 提交一个文档请评审人审批。文档和评审人一起写进去,同时发出 review.request
背景: 状态机 DocumentReview 的开始。写进去了 review.request 就一定发出,没写进去(参数错误、数据库失败)就一定不发
负责人: platform-team
风险: 中

种类: 组合命令

输入:
  title: { 类型: 文本, 必填: 是, 长度: 1~100, 说明: 标题 }
  reviewers:
    类型: 组列表
    必填: 是
    个数: 1~10
    唯一: [reviewer]
    说明: 评审人(不能重复)
    组:
      reviewer: { 类型: 文本, 长度: 2~32, 说明: 评审人 id }
      weight:   { 类型: 整数32, 范围: 1~5, 说明: 票数 }

操作:
  - 文档:
      新建: documents
      值: { title: 输入.title, status: REVIEWING, submitted_at: 现在, entered_at: 现在 }
  - 评审人:
      新建: document_reviewers
      每项: 输入.reviewers
      值: { doc_id: 文档.id, reviewer: 项.reviewer, weight: 项.weight }

发出:
  - review.request: { doc_id: 文档.id, revision: 文档.revision, title: 文档.title, reviewers: 输入.reviewers }

输出:
  doc_id:       { 说明: 文档号, 来自: 文档.id }
  status:       { 说明: 审批的状态(= 审批中), 来自: 文档.status }
  submitted_at: { 说明: 提交时间(= 请求的时刻), 来自: 文档.submitted_at }

业务规则:
  - 情况: 提交成功
    结果: 写文档(审批中、版本 1)和评审人,发出 review.request(评审人按请求里的顺序)
  - 情况: 评审人重复
    结果: 参数错误,什么都不写

例子:
  现在: "2026-11-22 10:00"
  准备数据:
    documents: []
  用例:
    - 说明: 提交 → 文档 + 评审人,发出 review.request
      输入: { title: 季度报告, reviewers: [ { reviewer: bob, weight: 2 }, { reviewer: alice, weight: 1 } ] }
      结果: { status: REVIEWING, submitted_at: "2026-11-22 10:00" }
      发出:
        - review.request: { revision: 1, title: 季度报告, reviewers: [ { reviewer: bob, weight: 2 }, { reviewer: alice, weight: 1 } ] }
      之后:
        documents:
          - { id: 1, title: 季度报告, revision: 1, status: REVIEWING, version: 1, attempts: 0, submitted_at: "2026-11-22 10:00", entered_at: "2026-11-22 10:00" }
        document_reviewers:
          - { doc_id: 1, reviewer: alice, weight: 1 }
          - { doc_id: 1, reviewer: bob, weight: 2 }
    - 说明: 评审人重复 → 参数错误
      输入: { title: 季度报告, reviewers: [ { reviewer: bob, weight: 1 }, { reviewer: bob, weight: 2 } ] }
      错误: 参数错误
      发出: []
      之后: 不变
