# ============================================================================
# DocumentReview: 文档审批的状态机(R5 的中立样例: 初始转移 + 两个等待状态 + 守卫 + 超时重发 / 期限 + 载入)
# ============================================================================
API: DocumentReview
说明: 文档的审批流程。提交之后请评审人审批,批准之后请发布服务发布;评审人 1 小时没有结论就过期
背景: 评审服务和发布服务通过消息回答,至少投递一次、不保证顺序。命令丢了要重发(重发是幂等的);
  批准的必须是提交的那个版本,版本不一致说明有地方弄错了,不能自动吞掉
负责人: platform-team
风险: 中

种类: 状态机
实体: documents
状态列: status
进入时间列: entered_at
版本列: version
重发计数列: attempts
创建时间列: submitted_at
开始: SubmitDocument

状态:
  REVIEWING:
    命令: { review.request: { doc_id: 实体.id, revision: 实体.revision, title: 实体.title, reviewers: 载入.reviewers } }
    超时: 1 分钟
    重发间隔: 2 分钟
    期限: 1 小时
    期限后: { 到: EXPIRED, 发出: [ document.expired: { doc_id: 实体.id } ] }
  PUBLISHING:
    命令: { publish.request: { doc_id: 实体.id, revision: 实体.revision } }
    超时: 30 秒
    重发间隔: 1 分钟
  PUBLISHED: { 终态: 是 }
  REJECTED:  { 终态: 是 }
  EXPIRED:   { 终态: 是 }

载入:
  reviewers: { 表: document_reviewers, 条件: [id = doc_id], 排序: [reviewer 小到大], 上限: 10, 列: [reviewer, weight] }

转移:
  - { 从: REVIEWING,  收到: review.approved, 守卫: "消息.revision = 实体.revision", 到: PUBLISHING }
  - { 从: REVIEWING,  收到: review.rejected, 到: REJECTED,
      发出: [ document.rejected: { doc_id: 实体.id, reason: 消息.reason } ] }
  - { 从: PUBLISHING, 收到: publish.done,    到: PUBLISHED,
      发出: [ document.published: { doc_id: 实体.id, revision: 实体.revision } ] }

业务规则:
  - 情况: 评审人批准了提交的版本
    结果: 进入 PUBLISHING,发出 publish.request
  - 情况: 评审人批准的版本和文档的版本不同
    结果: 拒绝(进 DLQ,需要人处理),文档不变
  - 情况: 评审人驳回
    结果: 进入 REJECTED(终态),发出 document.rejected(带理由)
  - 情况: 评审人 1 分钟没有回答
    结果: 重发 review.request(之后每 2 分钟一次);提交 1 小时还没有结论 → EXPIRED(终态),发出 document.expired
  - 情况: 发布服务 30 秒没有回答
    结果: 重发 publish.request(之后每 1 分钟一次),没有期限(发布是幂等的,一直重发到完成)
  - 情况: 重发引起的第二个回答、或者结论之后才到的回答
    结果: 忽略(不改文档,不发消息)

例子:
  现在: "2026-11-22 10:00"
  准备数据:
    documents:
      - { id: 1, title: 季度报告, revision: 2, status: REVIEWING,  version: 1, attempts: 0, submitted_at: "2026-11-22 09:59", entered_at: "2026-11-22 09:59" }
      - { id: 2, title: 发布说明, revision: 1, status: PUBLISHING, version: 3, attempts: 1, submitted_at: "2026-11-22 09:00", entered_at: "2026-11-22 09:58" }
      - { id: 3, title: 旧文档,   revision: 1, status: REJECTED,   version: 2, attempts: 0, submitted_at: "2026-11-21 09:00", entered_at: "2026-11-21 09:30" }
    document_reviewers:
      - { doc_id: 1, reviewer: bob, weight: 2 }
      - { doc_id: 1, reviewer: alice, weight: 1 }
  用例:
    - 说明: 批准了提交的版本 → PUBLISHING,发出 publish.request
      消息: { review.approved: { doc_id: 1, revision: 2 } }
      结果: PUBLISHING
      发出:
        - publish.request: { doc_id: 1, revision: 2 }
      之后:
        documents:
          - { id: 1, status: PUBLISHING, version: 2, attempts: 0, entered_at: "2026-11-22 10:00" }
          - { id: 2, status: PUBLISHING }
          - { id: 3, status: REJECTED }
    - 说明: 批准的版本和文档不同 → 拒绝,文档不变
      消息: { review.approved: { doc_id: 1, revision: 1 } }
      结果: 拒绝
      发出: []
      之后: 不变
    - 说明: 驳回 → REJECTED,发出 document.rejected
      消息: { review.rejected: { doc_id: 1, reason: 数据不对 } }
      结果: REJECTED
      发出:
        - document.rejected: { doc_id: 1, reason: 数据不对 }
      之后:
        documents:
          - { id: 1, status: REJECTED, version: 2, entered_at: "2026-11-22 10:00" }
          - { id: 2, status: PUBLISHING }
          - { id: 3, status: REJECTED }
    - 说明: 已经驳回的文档又收到批准(迟到)→ 忽略
      消息: { review.approved: { doc_id: 3, revision: 1 } }
      结果: 忽略
      发出: []
      之后: 不变
    - 说明: 还在审批中就收到发布完成(不可能的消息)→ 拒绝
      消息: { publish.done: { doc_id: 1 } }
      结果: 拒绝
      发出: []
      之后: 不变
    - 说明: 文档不存在 → 拒绝
      消息: { publish.done: { doc_id: 9 } }
      结果: 拒绝
      发出: []
      之后: 不变
    - 说明: 发布完成 → PUBLISHED,发出 document.published
      消息: { publish.done: { doc_id: 2 } }
      结果: PUBLISHED
      发出:
        - document.published: { doc_id: 2, revision: 1 }
      之后:
        documents:
          - { id: 1, status: REVIEWING }
          - { id: 2, status: PUBLISHED, version: 4, attempts: 0, entered_at: "2026-11-22 10:00" }
          - { id: 3, status: REJECTED }
    - 说明: 审批中 1 分钟没有回答 → 重发 review.request(评审人按 id);发布中的文档同时到了第 2 次重发(进入早的在前)
      超时: 是
      结果: 重发
      发出:
        - publish.request: { doc_id: 2, revision: 1 }
        - review.request: { doc_id: 1, revision: 2, title: 季度报告, reviewers: [ { reviewer: alice, weight: 1 }, { reviewer: bob, weight: 2 } ] }
      之后:
        documents:
          - { id: 1, status: REVIEWING, version: 2, attempts: 1, entered_at: "2026-11-22 09:59" }
          - { id: 2, status: PUBLISHING, version: 4, attempts: 2 }
          - { id: 3, status: REJECTED }
    - 说明: 发布中第 2 次重发的时刻(进入之后 30 秒 + 1 分钟)
      现在: "2026-11-22 09:59:30"
      超时: 是
      结果: 重发
      发出:
        - publish.request: { doc_id: 2, revision: 1 }
      之后:
        documents:
          - { id: 1, status: REVIEWING, attempts: 0 }
          - { id: 2, status: PUBLISHING, version: 4, attempts: 2, entered_at: "2026-11-22 09:58" }
          - { id: 3, status: REJECTED }
    - 说明: 提交 1 小时还没有结论 → EXPIRED,发出 document.expired
      现在: "2026-11-22 10:59"
      超时: 是
      结果: 期限
      发出:
        - publish.request: { doc_id: 2, revision: 1 }
        - document.expired: { doc_id: 1 }
      之后:
        documents:
          - { id: 1, status: EXPIRED, version: 2, attempts: 0, entered_at: "2026-11-22 10:59" }
          - { id: 2, status: PUBLISHING, version: 4, attempts: 2 }
          - { id: 3, status: REJECTED }
