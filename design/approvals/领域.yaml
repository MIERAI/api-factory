# ============================================================================
# 领域: approvals(文档的审批)
#   状态机(R5)的中立样例: 和 storefront 的订单 saga 无关,检验状态机不依赖 saga 的结构(设计稿 r5-state-machines §7.1)。
#   初始转移(组合命令)、两个等待状态(一个有期限)、三个终态、守卫、超时重发、载入的子行;没有补偿
# ============================================================================
领域: approvals
说明: 文档的审批。提交之后请评审人审批,批准之后请发布服务发布;评审人一直不回答就过期
时区: Asia/Tokyo

表:
  documents:
    说明: 提交审批的文档。审批的状态记在文档上(状态机 DocumentReview)
    主键: [id]
    更新方式: 可以更新
    列:
      id:           文档号(数据库生成)
      title:        标题(1~100 个字符)
      revision:     版本号(提交时 = 1;评审人批准的必须是这个版本)
      status:       { 说明: 审批的状态, 枚举: DocumentStatus }
      version:      行的版本(每次状态转移 / 重发 + 1)
      attempts:     当前状态的命令重发了几次(进入新状态时清零)
      submitted_at: 提交时间
      entered_at:   进入当前状态的时间
  document_reviewers:
    说明: 一个文档的评审人(提交时和文档一起写入,之后不改)
    主键: [doc_id, reviewer]
    更新方式: 只追加
    列:
      doc_id:   文档号
      reviewer: 评审人 id(2~32 个字符)
      weight:   票数(1~5,这个评审人的意见的权重)

枚举:
  DocumentStatus:
    说明: 审批的状态(状态机 DocumentReview)
    值:
      REVIEWING:  { 说明: 等待评审人审批, 数据库值: 1 }
      PUBLISHING: { 说明: 已批准、等待发布, 数据库值: 2 }
      PUBLISHED:  { 说明: 已发布(完成), 数据库值: 3 }
      REJECTED:   { 说明: 被驳回, 数据库值: 4 }
      EXPIRED:    { 说明: 过期(评审人一直没有结论), 数据库值: 5 }
    读到不认识的值: 返回"未指定",并记录到监控指标
