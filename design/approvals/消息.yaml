# approvals 的消息契约: 请评审 / 请发布的命令(approvals 发出,评审服务 / 发布服务执行),它们的回答(事件),
# 审批的结果(approvals 发出的事件)
消息:
  review.request:
    种类: 命令
    版本: 1
    主体: doc_id
    说明: 请评审人审批一个文档(同一个文档、同一个版本可能重发多次)
    字段:
      doc_id:   { 类型: 整数64, 必填: 是, 范围: "> 0", 说明: 文档号 }
      revision: { 类型: 整数32, 必填: 是, 范围: 1~1000, 说明: 要审批的版本 }
      title:    { 类型: 文本,   必填: 是, 长度: 1~100, 说明: 标题 }
      reviewers:
        类型: 列表
        必填: 是
        个数: 1~10
        唯一: [reviewer]
        说明: 评审人
        元素:
          reviewer: { 类型: 文本,   长度: 2~32 }
          weight:   { 类型: 整数32, 范围: 1~5 }
  review.approved:
    种类: 事件
    版本: 1
    主体: doc_id
    说明: 评审人批准了一个版本
    字段:
      doc_id:   { 类型: 整数64, 必填: 是, 范围: "> 0", 说明: 文档号 }
      revision: { 类型: 整数32, 必填: 是, 范围: 1~1000, 说明: 批准的版本 }
  review.rejected:
    种类: 事件
    版本: 1
    主体: doc_id
    说明: 评审人驳回了文档
    字段:
      doc_id: { 类型: 整数64, 必填: 是, 范围: "> 0", 说明: 文档号 }
      reason: { 类型: 文本,   必填: 是, 长度: 1~200, 说明: 驳回的理由 }
  publish.request:
    种类: 命令
    版本: 1
    主体: doc_id
    说明: 请发布服务发布一个文档的版本(重发是幂等的)
    字段:
      doc_id:   { 类型: 整数64, 必填: 是, 范围: "> 0", 说明: 文档号 }
      revision: { 类型: 整数32, 必填: 是, 范围: 1~1000, 说明: 发布的版本 }
  publish.done:
    种类: 事件
    版本: 1
    主体: doc_id
    说明: 发布完成
    字段:
      doc_id: { 类型: 整数64, 必填: 是, 范围: "> 0", 说明: 文档号 }
  document.published:
    种类: 事件
    版本: 1
    主体: doc_id
    说明: 文档审批通过并已发布
    字段:
      doc_id:   { 类型: 整数64, 必填: 是, 范围: "> 0", 说明: 文档号 }
      revision: { 类型: 整数32, 必填: 是, 范围: 1~1000, 说明: 发布的版本 }
  document.rejected:
    种类: 事件
    版本: 1
    主体: doc_id
    说明: 文档被驳回
    字段:
      doc_id: { 类型: 整数64, 必填: 是, 范围: "> 0", 说明: 文档号 }
      reason: { 类型: 文本,   必填: 是, 长度: 1~200, 说明: 驳回的理由 }
  document.expired:
    种类: 事件
    版本: 1
    主体: doc_id
    说明: 评审人一直没有结论,文档过期
    字段:
      doc_id: { 类型: 整数64, 必填: 是, 范围: "> 0", 说明: 文档号 }
