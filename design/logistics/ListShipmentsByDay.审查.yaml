问答:

  - 问题: "ある出荷日の出荷が 50 件を超えたとき(例: 2026-11-20 に 51 件、倉庫を指定しない場合)、一覧はエラーになりますが、それでよいですか?"
    选项: ["保持现在的行为(50 件超はエラー)", "上限を引き上げる(1000 件)", "改设计: ページ分けにする"]
    回答: "已经直接修改了设计书"
    改了设计: "背景に上限の根拠(1 日 30 件程度の前提)と超えたときの動作(切り捨てずに FAILED_PRECONDITION、倉庫で絞り込む)を書き、业务规则にも追加。50 件超はエラーのまま"
    来自: "PR #24 的式样书审查 2026-11-22(spec-pr)"
  - 问题: "EDI から取引先コードが空文字(\"\")のまま届いた出荷は「取引先コードが空」として扱いますか?"
    选项: ["保持现在的行为(\"\" は一つのコード)", "\"\" も空として扱う(データ修正)"]
    回答: "已经直接修改了设计书"
    改了设计: "\"\" は一つのコードとして扱う(届いたまま見せる)ことを业务规则と输出の说明に明記。不设置になるのは NULL のときだけ"
    来自: "PR #24 的式样书审查 2026-11-22(spec-pr)"
