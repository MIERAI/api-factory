问答:

  - 问题: "ある出荷日の出荷が 50 件を超えたとき(例: 2026-11-20 に 51 件、倉庫を指定しない場合)、一覧はエラーになりますが、それでよいですか?"
    选项: ["保持现在的行为(50 件超はエラー)", "上限を引き上げる(1000 件)", "改设计: ページ分けにする"]
    回答: "已经直接修改了设计书"
    改了设计: "背景に上限の根拠(1 日 30 件程度の前提)と超えたときの動作(切り捨てずに FAILED_PRECONDITION、倉庫で絞り込む)を書き、业务规则にも追加。50 件超はエラーのまま"
    来自: "PR #24 的式样书审查 2026-11-22(spec-pr)"

  - 问题: "EDI から取引先コードが空文字(\"\")のまま届いた出荷は「取引先コードが空」として扱いますか?(現在は \"\" も一つのコードとして扱い、partner_code は \"\" で返り、業者マスタに取引先コード \"\" の業者があればその業者名が付きます)"
    选项: ["保持现在的行为(\"\" は一つのコード)", "\"\" も空として扱う(データ修正)"]
    回答: "已经直接修改了设计书"
    改了设计: "\"\" は一つのコードとして扱う(届いたまま見せる)ことを业务规则と输出の说明に明記。不设置になるのは NULL のときだけ。例子に \"\" の出荷を追加"
    来自: "PR #24 的式样书审查 2026-11-22(spec-pr)"

  - 问题: "取引先コードが空文字 \"\" で届いた出荷は、partner_code が \"\" のまま返り(不设置ではない)、業者マスタに取引先コード \"\" の業者があればその業者名が付きます。この動作のままでよいですか?"
    选项: ["保持现在的行为(\"\" はそのまま返し、\"\" の業者があれば名前を付ける)", "改设计: \"\" の出荷には業者名を付けない"]
    回答: "已经直接修改了设计书"
    改了设计: "保持现在的行为。例子に \"\" の出荷と取引先コード \"\" の業者を追加して動作を固定"
    来自: "PR #24 的式样书审查 2026-11-22(spec-pr)"
