问答:

  - 问题: "region_code 传了空字符串(\"\")时,应该怎么处理?例如画面上地域选择框没选,但调用方仍然把 region_code 以 \"\" 传了过来。"
    选项: ["保持现在的行为", "不允许空字符串"]
    回答: "已经直接修改了设计书"
    改了设计: "region_code に 长度: 1~8 を付けた(空文字は参数错误)。例子を追加"
    来自: "PR #24 的式样书审查 2026-11-22(spec-pr)"

  - 问题: "地域マスタ里有两个不同的地域コード用了同一个地域名时(例如 R1 和 R5 都叫「関東」),它们的出荷要不要按地域分开排列?"
    选项: ["保持现在的行为", "同名时按地域コード分开"]
    回答: "已经直接修改了设计书"
    改了设计: "排序を [region_name, region_code, id] にした(同名の地域はコード順に分けて並ぶ)"
    来自: "PR #24 的式样书审查 2026-11-22(spec-pr)"

  - 问题: "排序改成了「地域名 → 地域コード → 出荷 ID」,但例子里没有两个地域同名的情况。地域マスタ里真的会出现不同地域コード用同一个地域名(例如 R1 和 R5 都叫「関東」)吗?"
    选项: ["同名地域会出现(保持现在的排序，补一个例子)", "同名地域不应该存在(改领域)"]
    回答: "已经直接修改了设计书"
    改了设计: "同名の地域はありうる(地域マスタは別システム)。R5「関東」の例子を追加"
    来自: "PR #24 的式样书审查 2026-11-22(spec-pr)"

  - 问题: "不指定地域时会返回当天所有地域的出荷。如果某个出荷日全公司有 51 件以上出荷(例如繁忙期一天 80 件),现在整个请求会报错、一件都不返回。这是想要的行为吗?"
    选项: ["保持现在的行为(超过 50 件就报错)", "提高上限", "不指定地域时也必须指定地域(改输入)"]
    回答: "已经直接修改了设计书"
    改了设计: "背景に上限の根拠(1 日の出荷は全社で 30 件程度)と超えたときの動作(切り捨てずに FAILED_PRECONDITION、地域で絞り込む)を書き、业务规则に追加。50 件超はエラーのまま"
    来自: "PR #24 的式样书审查 2026-11-22(spec-pr)"
