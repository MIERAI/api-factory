问答:

  - 问题: "region_code 传了空字符串(\"\")时,应该怎么处理?例如画面上地域选择框没选,但调用方仍然把 region_code 以 \"\" 传了过来。"
    选项: ["保持现在的行为", "不允许空字符串"]
    回答: "已经直接修改了设计书"
    改了设计: "region_code に 长度: 1~8 を付けた(空文字は参数错误)。例子を追加"
    来自: "PR #24 的式样书审查 2026-11-22(spec-pr)"

  - 问题: "地域マスタ里有两个不同的地域コード用了同一个地域名时(例如 R1 和 R5 都叫「関東」),它们的出荷要不要按地域分开排列?"
    选项: ["保持现在的行为", "同名时按地域コード分开"]
    回答: "已经直接修改了设计书"
    改了设计: "排序を [region_name, region_code, id] にした(同名の地域はコード順に分けて並ぶ)"
    来自: "PR #24 的式样书审查 2026-11-22(spec-pr)"

  - 问题: "排序改成了「地域名 → 地域コード → 出荷 ID」,但例子里没有两个地域同名的情况。地域マスタ里真的会出现不同地域コード用同一个地域名(例如 R1 和 R5 都叫「関東」)吗?"
    选项: ["同名地域会出现(保持现在的排序，补一个例子)", "同名地域不应该存在(改领域)"]
    回答: "已经直接修改了设计书"
    改了设计: "同名の地域はありうる(地域マスタは別システム)。R5「関東」の例子を追加"
    来自: "PR #24 的式样书审查 2026-11-22(spec-pr)"

  - 问题: "不指定地域时会返回当天所有地域的出荷。如果某个出荷日全公司有 51 件以上出荷(例如繁忙期一天 80 件),现在整个请求会报错、一件都不返回。这是想要的行为吗?"
    选项: ["保持现在的行为(超过 50 件就报错)", "提高上限", "不指定地域时也必须指定地域(改输入)"]
    回答: "已经直接修改了设计书"
    改了设计: "背景に上限の根拠(1 日の出荷は全社で 30 件程度)と超えたときの動作(切り捨てずに FAILED_PRECONDITION、地域で絞り込む)を書き、业务规则に追加。50 件超はエラーのまま"
    来自: "PR #24 的式样书审查 2026-11-22(spec-pr)"

  - 问题: "某天出荷超过 50 件时,背景要求「指定地域来缩小范围」。但「地域が未設定」的倉庫(例如 W3)和「倉庫マスタに無い」倉庫(例如 W9)的出荷,无论指定哪个地域都查不出来。这些出荷在那一天会完全查不到,这是想要的行为吗?"
    选项: ["保持现在的行为", "提高上限", "改设计: 能指定「地域なし」"]
    回答: "保持现在的行为"
    补充规则: { 情况: "当日の出荷が 50 件を超え、地域が未設定・倉庫マスタに無い出荷がある", 结果: "それらの出荷はこの API では取得できない(地域を指定しても対象にならない)。1 日 30 件程度の前提なので許容し、マスタ側で地域を設定して対応する" }
    来自: "ListShipmentsByRegion 的审查 2026-11-22 20261122-180605-claude-logistics.list-shipments-by-region"

  - 问题: "当天出荷超过 50 件时,背景要求指定地域来缩小范围;但「地域が未設定」的倉庫(例如 W3)和「倉庫マスタに無い」倉庫(例如 W9)的出荷,无论指定哪个地域都查不出来(地域コード也不能传空字符串)。那一天这些出荷在这个 API 里完全查不到,这是想要的行为吗?"
    选项: ["保持现在的行为(这类出荷改用其他 API 查)", "改设计: 增加按倉庫コード筛选"]
    回答: "保持现在的行为(这类出荷改用其他 API 查)"
    补充规则: { 情况: "当天出荷超过 50 件,且有出荷的倉庫没有地域コード或不在倉庫マスタ", 结果: "这些出荷无法通过本 API 取得(指定任何地域都不会返回),需要用 ListShipmentsByDay 等按倉庫的 API 查询;按「1 日 30 件程度」的前提,不另外处理" }
    来自: "ListShipmentsByRegion 的审查 2026-11-22 20261122-180605-claude-logistics.list-shipments-by-region"
