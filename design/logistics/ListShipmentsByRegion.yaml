# ============================================================================
# ListShipmentsByRegion: 出荷日の出荷を地域別に(关联的链: 出荷 → 倉庫 → 地域)
# ============================================================================
API: ListShipmentsByRegion
说明: 指定した出荷日の出荷を、倉庫の地域つきで地域名順に返す(分页なし)
背景: 地域別の配車計画。地域は倉庫マスタ経由で引く(出荷 → 倉庫 → 地域)。地域が未設定・地域マスタに無い出荷は地域名が空で末尾に並ぶ
负责人: logistics-team
风险: 低

种类: 多条
数据来源: shipments

关联:
  warehouse: { 表: warehouses, 条件: [warehouse_code = warehouse_code], 列: { warehouse_name: name, region_code: region_code } }
  region:    { 表: regions,    条件: [region_code = region_code],       列: { region_name: name } }

输入:
  shipped_on:  { 类型: 日期, 必填: 是, 说明: 出荷日, 筛选: shipped_on 等于 }
  region_code: { 类型: 文本, 必填: 否, 说明: 地域コード(倉庫マスタの地域), 筛选: region_code 等于 }

输出:
  id:             出荷 ID
  warehouse_code: 倉庫コード
  warehouse_name: 倉庫名
  region_code:    地域コード
  region_name:    地域名

排序: [region_name 小到大, id 小到大]
上限: 50
输出行名: RegionShipment

例子:
  准备数据:
    regions:
      - { region_code: R1, name: 関東 }
      - { region_code: R2, name: 九州 }
    warehouses:
      - { warehouse_code: W1, name: 東倉庫, region_code: R1 }
      - { warehouse_code: W2, name: 西倉庫, region_code: R2 }
      - { warehouse_code: W3, name: 新倉庫, region_code: null }
      - { warehouse_code: W4, name: 旧倉庫, region_code: R9 }
    shipments:
      - { id: 1, warehouse_code: W1, zone_no: null, partner_code: null, shipped_on: 2026-11-20, weight: 1 }
      - { id: 2, warehouse_code: W2, zone_no: null, partner_code: null, shipped_on: 2026-11-20, weight: 1 }
      - { id: 3, warehouse_code: W3, zone_no: null, partner_code: null, shipped_on: 2026-11-20, weight: 1 }
      - { id: 4, warehouse_code: W4, zone_no: null, partner_code: null, shipped_on: 2026-11-20, weight: 1 }
      - { id: 5, warehouse_code: W9, zone_no: null, partner_code: null, shipped_on: 2026-11-20, weight: 1 }
      - { id: 6, warehouse_code: W1, zone_no: null, partner_code: null, shipped_on: 2026-11-21, weight: 1 }
  用例:
    - 说明: 地域名順(文字コード順)。地域が空(W3)・地域マスタに無い(W4)・倉庫マスタに無い(W9)出荷は地域名が空で末尾
      输入: { shipped_on: 2026-11-20 }
      结果:
        shipments:
          - { id: 2, warehouse_name: 西倉庫, region_code: R2, region_name: 九州 }
          - { id: 1, warehouse_name: 東倉庫, region_code: R1, region_name: 関東 }
          - { id: 3, warehouse_name: 新倉庫, region_code: 不设置, region_name: 不设置 }
          - { id: 4, warehouse_name: 旧倉庫, region_code: R9, region_name: 不设置 }
          - { id: 5, warehouse_name: 不设置, region_code: 不设置, region_name: 不设置 }
    - 说明: 地域で絞り込む(倉庫マスタの地域コード)
      输入: { shipped_on: 2026-11-20, region_code: R1 }
      结果: { shipments: [{ id: 1, region_name: 関東 }] }
    - 说明: 地域マスタに無い地域コードでも絞り込める(地域名は空)
      输入: { shipped_on: 2026-11-20, region_code: R9 }
      结果: { shipments: [{ id: 4, region_name: 不设置 }] }
