# ============================================================================
# 领域: logistics(出荷と、出荷が参照するマスタ)
#   多表(关联 = 多对一查找)的示例。列的类型、能否为空以数据库为准(db/schema/logistics.sql)
#   マスタは別システムから日次で取り込む: 出荷のコードがマスタにまだ無い / もう無いことがある(外部キーなし)
# ============================================================================
领域: logistics
说明: 出荷と倉庫・区画・配送業者のマスタ
时区: Asia/Tokyo

表:
  shipments:
    说明: 出荷(1 出荷 1 行)
    主键: [id]
    更新方式: 可以更新
    列:
      id:             出荷 ID
      warehouse_code: 出荷元の倉庫コード
      zone_no:        倉庫内の区画番号(未割当は空)
      partner_code:   配送業者の取引先コード(EDI で届いたまま。自社便・未確定は空)
      shipped_on:     出荷日
      weight:         重量 kg(十进制)
  warehouses:
    说明: 倉庫マスタ
    主键: [warehouse_code]
    更新方式: 可以更新
    列:
      warehouse_code: 倉庫コード
      name:           倉庫名
      region_code:    地域コード(未設定は空)
  regions:
    说明: 地域マスタ
    主键: [region_code]
    更新方式: 可以更新
    列:
      region_code: 地域コード
      name:        地域名
  zones:
    说明: 倉庫の区画(区画番号は倉庫ごと)
    主键: [warehouse_code, zone_no]
    更新方式: 可以更新
    列:
      warehouse_code: 倉庫コード
      zone_no:        区画番号
      label:          区画の表示名
  carriers:
    说明: 配送業者マスタ(取引先コードは一意。自社便は取引先コードなし)
    主键: [carrier_id]
    更新方式: 可以更新
    列:
      carrier_id:   配送業者 ID
      name:         配送業者名
      partner_code: 取引先コード(自社便は空)
