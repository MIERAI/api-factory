# 领域: order(storefront v2 的订单服务)。这个服务独占的数据库(db/schema/order.sql)
领域: order
说明: 订单和下单 saga 的状态
时区: Asia/Tokyo

表:
  orders:
    说明: 订单。saga 的状态记在订单上,每次状态转移都更新 updated_at
    主键: [id]
    更新方式: 可以更新
    列:
      id:          订单号
      customer_id: 顾客 id
      status:      { 说明: 订单(saga)的状态, 枚举: OrderStatus }
      total:       合计金额(十进制)
      created_at:  下单时间
      updated_at:  最后一次状态转移的时间
    规则:
      - 规则: status 只能是 1~7
        数据库保证: 是
      - 规则: updated_at 不早于 created_at
        数据库保证: 否          # 写入方的时钟偏差可能违反

枚举:
  OrderStatus:
    说明: 订单的状态(下单 saga 的步骤)
    值:
      PENDING:    { 说明: 已下单(saga 还没开始), 数据库值: 1 }
      RESERVING:  { 说明: 等待库存预留, 数据库值: 2 }
      CHARGING:   { 说明: 等待支付, 数据库值: 3 }
      CONFIRMING: { 说明: 等待库存确认, 数据库值: 4 }
      RELEASING:  { 说明: 等待库存释放(补偿), 数据库值: 5 }
      CONFIRMED:  { 说明: 已确认(完成), 数据库值: 6 }
      CANCELLED:  { 说明: 已取消(补偿完成), 数据库值: 7 }
    读到不认识的值: 返回"未指定",并记录到监控指标
