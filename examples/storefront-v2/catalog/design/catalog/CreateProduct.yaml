# ============================================================================
# CreateProduct: 新建商品(W1,命令: 新建)
# ============================================================================
API: CreateProduct
说明: 新建一个商品,返回新建的商品(状态 = 在售,版本号 = 1,由数据库的默认值决定)
背景: 商品管理画面登记新商品。SKU 由运营决定(印在包装上),重复登记要报错,不能覆盖已有的商品
负责人: storefront
风险: 中

种类: 新建
数据来源: products

输入:
  sku:      { 类型: 文本,       必填: 是, 长度: 3~32,  格式: 代码, 说明: SKU(大写英文字母、数字和 -), 写入: sku }
  name:     { 类型: 文本,       必填: 是, 长度: 1~200, 说明: 商品名, 写入: name }
  category: { 类型: 文本,       必填: 是, 长度: 1~50,  说明: 分类, 写入: category }
  price:    { 类型: 非负十进制, 必填: 是, 说明: 售价, 写入: price }

设置:
  updated_at: 现在

输出:                             # 新建的行
  sku:        SKU
  name:       商品名
  category:   分类
  price:      售价
  status:     状态(新建 = 在售)
  version:    版本号(新建 = 1)
  updated_at: 最后更新时间(= 请求的时刻)

业务规则:
  - 情况: 同一个 SKU 已经有了(包括已下架的商品)
    结果: 已存在(ALREADY_EXISTS),什么都不写

例子:
  现在: "2026-11-22 10:00"
  准备数据:
    products:
      - { sku: "BEAN-001", name: 咖啡豆, category: coffee, price: 1200, status: ON_SALE, version: 2, updated_at: "2026-11-01 09:00" }
      - { sku: "OLD-003", name: 旧咖啡豆, category: coffee, price: 900, status: DISCONTINUED, version: 4, updated_at: "2026-10-01 09:00" }
  用例:
    - 说明: 新的 SKU → 新建,在售,版本号 1
      输入: { sku: "MUG-004", name: 马克杯, category: goods, price: "1600.50" }
      结果: { sku: "MUG-004", name: 马克杯, category: goods, price: "1600.50", status: ON_SALE, version: 1, updated_at: "2026-11-22 10:00" }
      之后:
        products:
          - { sku: "BEAN-001", price: 1200, version: 2 }
          - { sku: "OLD-003", status: DISCONTINUED, version: 4 }
          - { sku: "MUG-004", name: 马克杯, category: goods, price: 1600.5, status: ON_SALE, version: 1, updated_at: "2026-11-22 10:00" }
    - 说明: 已有的 SKU → 已存在,已有的商品不变
      输入: { sku: "BEAN-001", name: 新咖啡豆, category: coffee, price: "1500" }
      错误: 已存在
      之后: 不变
    - 说明: 已下架的商品的 SKU 也不能再用
      输入: { sku: "OLD-003", name: 旧咖啡豆, category: coffee, price: "900" }
      错误: 已存在
      之后: 不变
    - 说明: 价格 0 可以(赠品)
      输入: { sku: "GIFT-01", name: 赠品, category: goods, price: "0" }
      结果: { sku: "GIFT-01", price: "0", status: ON_SALE, version: 1 }
      之后:
        products:
          - { sku: "BEAN-001" }
          - { sku: "OLD-003" }
          - { sku: "GIFT-01", price: 0, status: ON_SALE, version: 1 }
