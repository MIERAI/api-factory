version: "2"
sql:
  - engine: postgresql
    schema: db/schema.sql
    queries: db/queries
    gen:
      # schema 目录(表/列/类型),factory 用它从声明生成 SQL
      json:
        out: .factory/sqlc
        filename: codegen.json
      go:
        package: db
        out: gen/db
        sql_package: pgx/v5
        # 生成的类型只用 Go 标准类型,handler 就不需要 import pgx(路径闸门禁止)
        emit_pointers_for_null_types: true
        overrides:
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              type: time.Time
              pointer: true
