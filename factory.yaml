# 工厂的配置。换语言模板时改 adapter;换模型时改 ai。脚本不写死任何模型和调用方式。
adapter: factory/adapters/golang

# 中文式样书(design/<领域>/)→ proto 时的包名: <package_prefix>.<领域>.<version>
proto:
  package_prefix: factory
  version: v1

ai:
  # 模型: 怎么调用(命令 + 环境变量)
  models:
    # 模型 ID 写死: CLI 的默认模型会随套餐 / 版本变,结果不可复现(2026-11-18 以前没指定,用的是哪个模型不明)
    claude:                      # 强模型: 审查(阻塞)
      command: [claude, -p, --model, claude-opus-5-5]
    claude-sonnet:               # 实现: 有路径闸门 + 编译 + 验收兜底,用便宜一些的模型
      command: [claude, -p, --model, claude-sonnet-5-5]

  # 角色: 用哪个模型、允许哪些模型、固定参数
  roles:
    review:
      model: claude
      # 第一波实测: 本地模型审查 10 个 API,挡下的 8 个 blocker 全部是误报(enum 的 DB 值和 proto 编号混淆等)。
      # 审查没有闸门兜底,误报会让流水线停下 → 只允许强模型
      # 只用 Claude(2026-11-22: 本地模型从工厂里拿掉; 实测本地模型审查误报多、计算类实现失败)
      allowed: [claude]
      args: [--tools, "", --max-turns, "2"]
      timeout_sec: 600
    implement:
      model: claude
      # 实现有路径闸门 + 编译 + 验收兜底,弱模型也可以(实测: 本地模型 compute 8/9 次通过)
      allowed: [claude, claude-sonnet]
      args: [--max-turns, "40"]    # 允许的工具来自适配器清单(ai_tools)
      timeout_sec: 1800

# 式样书审查的收敛(factory/review): 同一个 API 连续没通过超过这么多轮以后,新的 major 只记录(封顶)不挡流水线;
# blocker 和之前挡了、还没回答的问题照常挡。0 = 不封顶
review:
  max_rounds: 3
