syntax = "proto3";

package factory.jobs.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

option go_package = "apifactory/gen/factory/jobs/v1;jobsv1";

// 异步任务的状态查询
service JobService {
  // 按 id 返回一个任务的 status
  //   OK               : 存在
  //   NOT_FOUND        : 不存在
  //   INVALID_ARGUMENT : job_id <= 0
  rpc GetJobStatus(GetJobStatusRequest) returns (GetJobStatusResponse);

  // 按条件列出任务,新的在前,游标分页
  //   OK               : 0 件也是 OK
  //   INVALID_ARGUMENT : 参数不合法 / page_token 无法解析
  rpc ListJobs(ListJobsRequest) returns (ListJobsResponse);

  // 按 job_type 和期间汇总任务的处理情况(成功率 / 平均处理时间 / SLA 违约 / 健康度)
  //   OK               : 0 件也是 OK(health = NO_DATA)
  //   INVALID_ARGUMENT : 参数不合法
  rpc GetJobSummary(GetJobSummaryRequest) returns (GetJobSummaryResponse);
}

message GetJobStatusRequest {
  // jobs.id (> 0)。校验由 protovalidate 确定性执行,不交给 AI
  int64 job_id = 1 [(buf.validate.field).int64.gt = 0];
}

message GetJobStatusResponse {
  // 0: 未完成 / 1: 成功 / 2: 失败
  int32 status = 1;
}

message ListJobsRequest {
  option (buf.validate.message).cel = {
    id: "created_range"
    message: "created_after must be earlier than created_before"
    expression: "!has(this.created_after) || !has(this.created_before) || this.created_after < this.created_before"
  };

  // 0 = 默认值 20,最大 100
  int32 page_size = 1 [(buf.validate.field).int32 = {
    gte: 0
    lte: 100
  }];
  // 上一页返回的 next_page_token。不透明字符串,调用方不应解析
  string page_token = 2;
  // 指定时按 status 筛选(0 也是合法的筛选值)
  optional int32 status = 3 [(buf.validate.field).int32 = {
    in: [0, 1, 2]
  }];
  // 指定时按 job_type 完全一致筛选
  optional string job_type = 4 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  // created_at >= created_after
  google.protobuf.Timestamp created_after = 5;
  // created_at < created_before
  google.protobuf.Timestamp created_before = 6;
}

message ListJobsResponse {
  repeated Job jobs = 1;
  // 还有下一页时非空,最后一页为空
  string next_page_token = 2;
}

message Job {
  int64 id = 1;
  string job_type = 2;
  int32 status = 3;
  google.protobuf.Timestamp created_at = 4;
}

message GetJobSummaryRequest {
  option (buf.validate.message).cel = {
    id: "period_range"
    message: "period_start must be earlier than period_end, and the period must be 31 days or less"
    expression: "this.period_start < this.period_end && this.period_end - this.period_start <= duration('744h')"
  };

  string job_type = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  // created_at >= period_start
  google.protobuf.Timestamp period_start = 2 [(buf.validate.field).required = true];
  // created_at < period_end
  google.protobuf.Timestamp period_end = 3 [(buf.validate.field).required = true];
}

message GetJobSummaryResponse {
  int64 total = 1;
  int64 succeeded = 2;
  int64 failed = 3;
  int64 pending = 4;
  // succeeded / (succeeded + failed),四舍五入到小数 4 位。已结束的任务为 0 件时不设置
  optional double success_rate = 5;
  // 已结束任务的平均处理时间(秒),四舍五入到小数 1 位。无可计算的任务时不设置
  optional double avg_duration_seconds = 6;
  // 处理时间超过 SLA(300 秒)的已结束任务数
  int64 sla_breaches = 7;
  // OK / DEGRADED / CRITICAL / NO_DATA
  string health = 8;
}
