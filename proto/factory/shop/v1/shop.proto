syntax = "proto3";

package factory.shop.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

option go_package = "apifactory/gen/factory/shop/v1;shopv1";

enum CustomerTier {
  CUSTOMER_TIER_UNSPECIFIED = 0;
  CUSTOMER_TIER_REGULAR = 1;
  CUSTOMER_TIER_SILVER = 2;
  CUSTOMER_TIER_GOLD = 3;
}

enum ProductStatus {
  PRODUCT_STATUS_UNSPECIFIED = 0;
  PRODUCT_STATUS_ACTIVE = 1;
  PRODUCT_STATUS_DISCONTINUED = 2;
  PRODUCT_STATUS_DRAFT = 3;
}

enum OrderStatus {
  ORDER_STATUS_UNSPECIFIED = 0;
  ORDER_STATUS_PLACED = 1;
  ORDER_STATUS_SHIPPED = 2;
  ORDER_STATUS_DELIVERED = 3;
  ORDER_STATUS_CANCELLED = 4;
}

// 电商订单
service ShopService {
  // R1: 按顾客 id 返回顾客信息
  rpc GetCustomer(GetCustomerRequest) returns (GetCustomerResponse);
  // R2: 按 SKU 返回商品
  rpc GetProductBySku(GetProductBySkuRequest) returns (GetProductBySkuResponse);
  // R3: 订单一览(按顾客/状态/下单期间筛选,新的在前,游标分页)
  rpc ListOrders(ListOrdersRequest) returns (ListOrdersResponse);
  // R4: 商品一览(按分类/状态筛选,按商品名前缀搜索,新的在前,游标分页)
  rpc ListProducts(ListProductsRequest) returns (ListProductsResponse);
  // R5: 某个订单的明细,按行号升序
  rpc ListOrderItems(ListOrderItemsRequest) returns (ListOrderItemsResponse);
  // R6: 某商品在某个时点的有效价格
  rpc GetProductPriceAsOf(GetProductPriceAsOfRequest) returns (GetProductPriceAsOfResponse);
  // R7: 某顾客在期间内的订单统计
  rpc GetCustomerOrderStats(GetCustomerOrderStatsRequest) returns (GetCustomerOrderStatsResponse);
  // R8: 订单详情(订单头 + 全部明细)
  rpc GetOrderWithItems(GetOrderWithItemsRequest) returns (GetOrderWithItemsResponse);
  // R9: 日别销售额报表
  rpc GetDailySalesReport(GetDailySalesReportRequest) returns (GetDailySalesReportResponse);
  // R10: 发货延迟告警(截至 as_of,下单超过 min_days 天仍未发货的订单)
  rpc ListShippingDelays(ListShippingDelaysRequest) returns (ListShippingDelaysResponse);
}

message GetCustomerRequest {
  int64 customer_id = 1 [(buf.validate.field).int64.gt = 0];
}

message GetCustomerResponse {
  int64 id = 1;
  string name = 2;
  string email = 3;
  CustomerTier tier = 4;
  google.protobuf.Timestamp created_at = 5;
}

message GetProductBySkuRequest {
  string sku = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 32
  }];
}

message GetProductBySkuResponse {
  int64 id = 1;
  string sku = 2;
  string name = 3;
  string category = 4;
  ProductStatus status = 5;
  google.protobuf.Timestamp created_at = 6;
}

message ListOrdersRequest {
  option (buf.validate.message).cel = {
    id: "ordered_range"
    message: "ordered_after must be earlier than ordered_before"
    expression: "!has(this.ordered_after) || !has(this.ordered_before) || this.ordered_after < this.ordered_before"
  };

  // 0 = 默认值 20,最大 100
  int32 page_size = 1 [(buf.validate.field).int32 = {
    gte: 0
    lte: 100
  }];
  string page_token = 2;
  optional int64 customer_id = 3 [(buf.validate.field).int64.gt = 0];
  optional OrderStatus status = 4 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  // ordered_at >= ordered_after
  google.protobuf.Timestamp ordered_after = 5;
  // ordered_at < ordered_before
  google.protobuf.Timestamp ordered_before = 6;
}

message ListOrdersResponse {
  repeated Order orders = 1;
  string next_page_token = 2;
}

message Order {
  int64 id = 1;
  int64 customer_id = 2;
  OrderStatus status = 3;
  google.protobuf.Timestamp ordered_at = 4;
  // 未发货时不设置
  google.protobuf.Timestamp shipped_at = 5;
  int64 total_amount = 6;
}

message ListProductsRequest {
  int32 page_size = 1 [(buf.validate.field).int32 = {
    gte: 0
    lte: 100
  }];
  string page_token = 2;
  optional string category = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 32
  }];
  optional ProductStatus status = 4 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  // 商品名以此开头(区分大小写)
  optional string name_prefix = 5 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
}

message ListProductsResponse {
  repeated Product products = 1;
  string next_page_token = 2;
}

message Product {
  int64 id = 1;
  string sku = 2;
  string name = 3;
  string category = 4;
  ProductStatus status = 5;
  google.protobuf.Timestamp created_at = 6;
}

message ListOrderItemsRequest {
  int64 order_id = 1 [(buf.validate.field).int64.gt = 0];
  int32 page_size = 2 [(buf.validate.field).int32 = {
    gte: 0
    lte: 200
  }];
  string page_token = 3;
}

message ListOrderItemsResponse {
  repeated OrderItem items = 1;
  string next_page_token = 2;
}

message OrderItem {
  int32 line_no = 1;
  int64 product_id = 2;
  int32 quantity = 3;
  int64 unit_price = 4;
}

message GetProductPriceAsOfRequest {
  int64 product_id = 1 [(buf.validate.field).int64.gt = 0];
  // 这个时点有效的价格(valid_from <= as_of 的最新一行)
  google.protobuf.Timestamp as_of = 2 [(buf.validate.field).required = true];
}

message GetProductPriceAsOfResponse {
  int64 price = 1;
  string currency = 2;
  // 这个价格从何时起生效
  google.protobuf.Timestamp valid_from = 3;
}

message GetCustomerOrderStatsRequest {
  option (buf.validate.message).cel = {
    id: "period_range"
    message: "period_start must be earlier than period_end, and the period must be 366 days or less"
    expression: "this.period_start < this.period_end && this.period_end - this.period_start <= duration('8784h')"
  };
  int64 customer_id = 1 [(buf.validate.field).int64.gt = 0];
  google.protobuf.Timestamp period_start = 2 [(buf.validate.field).required = true];
  google.protobuf.Timestamp period_end = 3 [(buf.validate.field).required = true];
}

message GetCustomerOrderStatsResponse {
  // 期间内下单的订单数(含取消)
  int64 order_count = 1;
  // 未取消订单的金额合计(円)
  int64 total_amount = 2;
  // 未取消订单的平均金额(円,四舍五入到整数)。未取消订单为 0 件时不设置
  optional int64 avg_amount = 3;
  // 取消率 = 取消件数 / order_count,四舍五入到小数 4 位。order_count 为 0 时不设置
  optional double cancel_rate = 4;
}

message GetOrderWithItemsRequest {
  int64 order_id = 1 [(buf.validate.field).int64.gt = 0];
}

message GetOrderWithItemsResponse {
  Order order = 1;
  // 按行号升序
  repeated OrderItem items = 2;
}

message GetDailySalesReportRequest {
  option (buf.validate.message).cel = {
    id: "period_range"
    message: "period_start must be earlier than period_end, and the period must be 31 days or less"
    expression: "this.period_start < this.period_end && this.period_end - this.period_start <= duration('744h')"
  };
  google.protobuf.Timestamp period_start = 1 [(buf.validate.field).required = true];
  google.protobuf.Timestamp period_end = 2 [(buf.validate.field).required = true];
}

message GetDailySalesReportResponse {
  repeated DailySales days = 1;
}

message DailySales {
  // 日本时间的日期 YYYY-MM-DD
  string date = 1;
  int64 order_count = 2;
  int64 total_amount = 3;
}

message ListShippingDelaysRequest {
  int32 page_size = 1 [(buf.validate.field).int32 = {
    gte: 0
    lte: 100
  }];
  string page_token = 2;
  // 判定基准时点
  google.protobuf.Timestamp as_of = 3 [(buf.validate.field).required = true];
  // 下单后超过多少天算延迟
  int32 min_days = 4 [(buf.validate.field).int32 = {
    gte: 1
    lte: 90
  }];
}

message ListShippingDelaysResponse {
  repeated Order orders = 1;
  string next_page_token = 2;
}
