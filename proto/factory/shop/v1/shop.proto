syntax = "proto3";

package factory.shop.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

option go_package = "apifactory/gen/factory/shop/v1;shopv1";

enum CustomerTier {
  CUSTOMER_TIER_UNSPECIFIED = 0;
  CUSTOMER_TIER_REGULAR = 1;
  CUSTOMER_TIER_SILVER = 2;
  CUSTOMER_TIER_GOLD = 3;
}

enum ProductStatus {
  PRODUCT_STATUS_UNSPECIFIED = 0;
  PRODUCT_STATUS_ACTIVE = 1;
  PRODUCT_STATUS_DISCONTINUED = 2;
  PRODUCT_STATUS_DRAFT = 3;
}

enum OrderStatus {
  ORDER_STATUS_UNSPECIFIED = 0;
  ORDER_STATUS_PLACED = 1;
  ORDER_STATUS_SHIPPED = 2;
  ORDER_STATUS_DELIVERED = 3;
  ORDER_STATUS_CANCELLED = 4;
}

// 电商订单
service ShopService {
  // R1: 按顾客 id 返回顾客信息
  rpc GetCustomer(GetCustomerRequest) returns (GetCustomerResponse);
  // R2: 按 SKU 返回商品
  rpc GetProductBySku(GetProductBySkuRequest) returns (GetProductBySkuResponse);
  // R3: 订单一览(按顾客/状态/下单期间筛选,新的在前,游标分页)
  rpc ListOrders(ListOrdersRequest) returns (ListOrdersResponse);
}

message GetCustomerRequest {
  int64 customer_id = 1 [(buf.validate.field).int64.gt = 0];
}

message GetCustomerResponse {
  int64 id = 1;
  string name = 2;
  string email = 3;
  CustomerTier tier = 4;
  google.protobuf.Timestamp created_at = 5;
}

message GetProductBySkuRequest {
  string sku = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 32
  }];
}

message GetProductBySkuResponse {
  int64 id = 1;
  string sku = 2;
  string name = 3;
  string category = 4;
  ProductStatus status = 5;
  google.protobuf.Timestamp created_at = 6;
}

message ListOrdersRequest {
  option (buf.validate.message).cel = {
    id: "ordered_range"
    message: "ordered_after must be earlier than ordered_before"
    expression: "!has(this.ordered_after) || !has(this.ordered_before) || this.ordered_after < this.ordered_before"
  };

  // 0 = 默认值 20,最大 100
  int32 page_size = 1 [(buf.validate.field).int32 = {
    gte: 0
    lte: 100
  }];
  string page_token = 2;
  optional int64 customer_id = 3 [(buf.validate.field).int64.gt = 0];
  optional OrderStatus status = 4 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  // ordered_at >= ordered_after
  google.protobuf.Timestamp ordered_after = 5;
  // ordered_at < ordered_before
  google.protobuf.Timestamp ordered_before = 6;
}

message ListOrdersResponse {
  repeated Order orders = 1;
  string next_page_token = 2;
}

message Order {
  int64 id = 1;
  int64 customer_id = 2;
  OrderStatus status = 3;
  google.protobuf.Timestamp ordered_at = 4;
  // 未发货时不设置
  google.protobuf.Timestamp shipped_at = 5;
  int64 total_amount = 6;
}
