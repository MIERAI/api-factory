// 日别・店别の売上(一天一店一行)
message StoreDaySale {
  // 売上日
  string sales_date = 1;
  // 売上金額
  string amount = 2;
  // 値引き額
  optional string discount = 3;
  // 締め日
  optional string closed_on = 4;
}

// 店舗と期間を指定して、日別の売上を新しい日から返す
message ListStoreSalesByPeriodRequest {
  option (buf.validate.message).cel = {
    id: "before.date_from.date_to"
    message: "date_from must be earlier than date_to"
    expression: "this.date_from < this.date_to"
  };
  // 店舗コード
  int32 store_code = 1 [(buf.validate.field).int32.gt = 0];
  // 期間の開始(含)
  string date_from = 2 [(buf.validate.field).string.pattern = "^\\d{4}-\\d{2}-\\d{2}$"];
  // 期間の終了(含まない)
  string date_to = 3 [(buf.validate.field).string.pattern = "^\\d{4}-\\d{2}-\\d{2}$"];
}

// 店舗と期間を指定して、日別の売上を新しい日から返す
message ListStoreSalesByPeriodResponse {
  // 最多 62 件;超过时返回错误(不会截断)
  repeated StoreDaySale daily_sales = 1;
}

// 日别・店别の売上(一天一店一行)
message RangeSale {
  // 売上日
  string sales_date = 1;
  // 売上金額
  string amount = 2;
  // 値引き額
  optional string discount = 3;
}

// 店舗と期間(from〜to、両端を含む)を指定して、日別の売上を古い日から返す
message ListStoreSalesRangeRequest {
  // 店舗コード
  int32 store_code = 1 [(buf.validate.field).int32.gt = 0];
  // 期間の開始(含む)
  string from = 2 [(buf.validate.field).string.pattern = "^\\d{4}-\\d{2}-\\d{2}$"];
  // 期間の終了(含む。省略 = 終わりなし)
  optional string to = 3 [(buf.validate.field).string.pattern = "^\\d{4}-\\d{2}-\\d{2}$"];
}

// 店舗と期間(from〜to、両端を含む)を指定して、日別の売上を古い日から返す
message ListStoreSalesRangeResponse {
  // 最多 31 件;超过时返回错误(不会截断)
  repeated RangeSale daily_sales = 1;
}

// 日别・店别の売上(一天一店一行)
message TopDiscountStore {
  // 店舗コード
  int32 store_code = 1;
  // 値引き額
  optional string discount = 2;
  // 売上金額
  string amount = 3;
}

// 売上日を指定して、値引きのあった店舗のうち値引き額の大きい店舗を上位 2 件返す
message ListTopDiscountStoresRequest {
  // 売上日
  string sales_date = 1 [(buf.validate.field).string.pattern = "^\\d{4}-\\d{2}-\\d{2}$"];
}

// 売上日を指定して、値引きのあった店舗のうち値引き額の大きい店舗を上位 2 件返す
message ListTopDiscountStoresResponse {
  // 按排序取前 2 件(不足时全部)
  repeated TopDiscountStore daily_sales = 1;
}

// 日别・店别の売上(一天一店一行)
message DailySale {
  // 売上日
  string sales_date = 1;
  // 店舗コード
  int32 store_code = 2;
  // 売上金額
  string amount = 3;
  // 値引き額
  optional string discount = 4;
  // 締め日
  optional string closed_on = 5;
}

// 売上金額の多い順に、日別・店別の売上を返す
message ListTopSalesRequest {
  // 每页件数。0 = 默认 20,最多 100
  int32 page_size = 1 [(buf.validate.field).int32 = {gte: 0, lte: 100}];
  // 上一页返回的 next_page_token(不透明的字符串)
  string page_token = 2;
  // 店舗コード
  optional int32 store_code = 3 [(buf.validate.field).int32.gt = 0];
  // 売上日の下限(含)
  optional string date_from = 4 [(buf.validate.field).string.pattern = "^\\d{4}-\\d{2}-\\d{2}$"];
  // 金額の下限(含)
  optional string min_amount = 5 [(buf.validate.field).string.pattern = "^-?\\d+(\\.\\d+)?$"];
  // 除外する店舗
  optional int32 exclude_store = 6 [(buf.validate.field).int32.gt = 0];
}

// 売上金額の多い順に、日別・店別の売上を返す
message ListTopSalesResponse {
  repeated DailySale daily_sales = 1;
  // 还有下一页时不为空
  string next_page_token = 2;
}

// 日别・店别の売上(一天一店一行)
message TopStore {
  // 店舗コード
  int32 store_code = 1;
  // 売上金額
  string amount = 2;
}

// 売上日を指定して、売上金額の上位 3 店を返す
message ListTopStoresRequest {
  // 売上日
  string sales_date = 1 [(buf.validate.field).string.pattern = "^\\d{4}-\\d{2}-\\d{2}$"];
}

// 売上日を指定して、売上金額の上位 3 店を返す
message ListTopStoresResponse {
  // 按排序取前 3 件(不足时全部)
  repeated TopStore daily_sales = 1;
}

// 日别・店别の売上(一天一店一行)
message UnclosedSale {
  // 売上日
  string sales_date = 1;
  // 売上金額
  string amount = 2;
  // 値引き額
  optional string discount = 3;
}

// 指定した店舗の、まだ締めていない売上日の売上を返す
message ListUnclosedSalesRequest {
  // 店舗コード
  int32 store_code = 1 [(buf.validate.field).int32.gt = 0];
  // この日以降(含)だけ(不指定 = 全期間)
  optional string from_date = 2 [(buf.validate.field).string.pattern = "^\\d{4}-\\d{2}-\\d{2}$"];
}

// 指定した店舗の、まだ締めていない売上日の売上を返す
message ListUnclosedSalesResponse {
  // 最多 31 件;超过时返回错误(不会截断)
  repeated UnclosedSale daily_sales = 1;
}
