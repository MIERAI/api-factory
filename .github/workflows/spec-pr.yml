# 阶段 1: 式样书的 PR(design/)。机械检查 + 生成检查 + AI 审查;结果贴到 PR 上
name: spec-pr
on:
  pull_request:
    paths: ["design/**"]
permissions:
  contents: read
  pull-requests: write
jobs:
  review:
    if: ${{ !startsWith(github.head_ref, 'factory/gen-') && vars.FACTORY_GENERATE == 'on' }}
    # 笔记本上的 self-hosted runner(私有仓库专用): 只有它能连到 tailnet 里 winpc 的模型
    runs-on: [self-hosted, laptop]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: ./.github/actions/setup
      - name: AI 命令行(runner 上预装)
        run: claude --version
      - name: 式样书检查 + AI 审查
        env:
          BASE: origin/${{ github.base_ref }}
          # 仓库变量 FACTORY_REVIEW_MODEL: claude(阻塞,原来的设计)| local(winpc,只作参考)。默认 local
          REVIEW_MODEL: ${{ vars.FACTORY_REVIEW_MODEL || 'local' }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}   # claude 时用(订阅的令牌)
        run: rm -f .factory/ci-summary.md && scripts/ci/spec-review.sh
      - name: 结果贴到 PR
        if: always()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh pr comment ${{ github.event.pull_request.number }} --edit-last --body-file .factory/ci-summary.md || gh pr comment ${{ github.event.pull_request.number }} --body-file .factory/ci-summary.md
