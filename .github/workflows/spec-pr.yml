# 阶段 1: 式样书的 PR(design/)。机械检查 + 生成检查 + AI 审查;结果贴到 PR 上
name: spec-pr
on:
  pull_request:
    paths: ["design/**"]
permissions:
  contents: read
  pull-requests: write
jobs:
  review:
    if: ${{ !startsWith(github.head_ref, 'factory/gen-') && vars.FACTORY_GENERATE == 'on' }}
    # 笔记本上的 self-hosted runner(私有仓库专用): 只有它能连到 tailnet 里 winpc 的模型
    runs-on: [self-hosted, laptop]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: ./.github/actions/setup
      # 审查的历史(.factory/reviews): 轮次 / 迟到 / 重复提问 的规则和"输入没变就沿用"都要上一轮的记录。
      # checkout 会清掉工作区 → 按 PR 分支存到 Actions 的缓存(以前每次都是第 1 轮,收敛的规则不起作用)
      - name: 审查的历史(恢复)
        uses: actions/cache/restore@v4
        with:
          path: .factory/reviews
          key: review-${{ github.head_ref }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: review-${{ github.head_ref }}-
      - name: AI 命令行(runner 上预装)
        run: claude --version
      - name: 式样书检查 + AI 审查
        env:
          BASE: origin/${{ github.base_ref }}
          # 仓库变量 FACTORY_REVIEW_MODEL: factory.yaml 的模型(claude,阻塞)。默认 claude
          REVIEW_MODEL: ${{ vars.FACTORY_REVIEW_MODEL || 'claude' }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}   # claude 时用(订阅的令牌)
        run: rm -f .factory/ci-summary.md && scripts/ci/spec-review.sh
      - name: 审查的历史(保存)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .factory/reviews
          key: review-${{ github.head_ref }}-${{ github.run_id }}-${{ github.run_attempt }}
      # 审查的结果也作为 artifact 上传: 缓存只有 CI 能读,本地 scripts/review-fetch.sh 下载这个 artifact →
      # .factory/reviews → 本地 factory answer F1=… 回答(以前只能手写 审查.yaml)
      - name: 审查的结果(artifact,本地 review-fetch 用)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spec-reviews
          path: .factory/reviews
          include-hidden-files: true   # .factory 是隐藏目录: v4.4 起默认不上传
          if-no-files-found: ignore
          retention-days: 14
      - name: 结果贴到 PR
        if: always()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh pr comment ${{ github.event.pull_request.number }} --edit-last --body-file .factory/ci-summary.md || gh pr comment ${{ github.event.pull_request.number }} --body-file .factory/ci-summary.md
