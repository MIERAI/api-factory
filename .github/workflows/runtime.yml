# The runtime (runtime/, its own Go module github.com/MIERAI/api-factory/runtime): correctness and performance.
#   test   gofmt, vet, unit + integration tests (-race) against a real Postgres and RabbitMQ
#   perf   the runtime's performance gate (runtime/outbox/perf_gate_test.go): outbox commit throughput scales with
#          concurrent writers, the outbox writer costs little over a plain insert, no waits on a cluster-wide lock in
#          pg_locks, the relay's after-commit wake-up works. Ratios measured within one run (no absolute numbers).
#          Its own job, no -race, one package: nothing else competes for the runner while it measures.
#   versions  factory and runtime versions are paired (factory/version, runtime/version, every go.mod)
# Runs on every PR and on main: the verify workflow builds the factory and the examples against runtime/ too.
name: runtime
on:
  pull_request:
  push: { branches: [main] }
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:16-alpine
        env: { POSTGRES_PASSWORD: pw }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
      rabbitmq:
        image: mirror.gcr.io/library/rabbitmq:3.13.7-management
        ports: ["5672:5672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping" --health-interval 5s --health-timeout 10s --health-retries 30
    env:
      RUNTIME_TEST_DB: postgres://postgres:pw@localhost:5432/postgres?sslmode=disable
      RUNTIME_TEST_AMQP: amqp://guest:guest@localhost:5672/
    defaults: { run: { working-directory: runtime } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with: { go-version-file: runtime/go.mod, cache-dependency-path: runtime/go.sum }
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test -race ./...
  perf:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:16-alpine
        env: { POSTGRES_PASSWORD: pw }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
      rabbitmq:
        image: mirror.gcr.io/library/rabbitmq:3.13.7-management
        ports: ["5672:5672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping" --health-interval 5s --health-timeout 10s --health-retries 30
    env:
      RUNTIME_TEST_DB: postgres://postgres:pw@localhost:5432/postgres?sslmode=disable
      RUNTIME_TEST_AMQP: amqp://guest:guest@localhost:5672/
      RUNTIME_PERF: "1"
    defaults: { run: { working-directory: runtime } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with: { go-version-file: runtime/go.mod, cache-dependency-path: runtime/go.sum }
      - name: performance gate
        run: |
          {
            echo "## runtime performance gate"
            echo
            echo "| check | measured | ratio 1 | ratio 2 | ratio 3 |"
            echo "|---|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          RUNTIME_PERF_SUMMARY="$GITHUB_STEP_SUMMARY" go test -count=1 -p 1 -run '^TestPerf' -v ./outbox/
  versions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: go test ./factory/version ./factory/upgrade ./factory/adapters/golang
      - run: scripts/release.sh check
