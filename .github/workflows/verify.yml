# 阶段 3: 代码的 PR(生成物 / 工厂本身)。生成物是最新的 + 编译 + 单元测试 + 验收(3 个种子)+ 变异余量
# 只改了 design/ 的 PR 由 spec-pr 负责(生成物还没生成,这里会说"不是最新的")
# 变异余量按变异分成 4 个并行 job(分片合起来 = 全部变异,判定不变)。PR 跑 1 个种子,release(合并到 main)跑 3 个;
# 两者都用结果缓存 + 早停(每个变异差分失败够 3 个就停)。每晚 3 个种子: margin-nightly.yml
name: verify
on:
  pull_request:
  workflow_call:   # release(合并到 main 之后)也先跑一遍;generate 用 ref 验证生成物的分支
    inputs:
      ref: { type: string, default: "", description: "要验证的分支(空 = 触发的提交)" }
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, ref: "${{ inputs.ref }}" }
      - name: 只改了式样书?
        id: scope
        run: |
          if [ "${{ github.event_name }}" != pull_request ]; then echo "code=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          if git -c core.quotePath=false diff --name-only origin/${{ github.base_ref }}...HEAD | grep -qv '^design/'; then echo "code=1" >> "$GITHUB_OUTPUT"; fi
      - if: steps.scope.outputs.code == '1'
        uses: ./.github/actions/setup
      - if: steps.scope.outputs.code == '1'
        run: scripts/ci/verify.sh
        env: { SKIP_MARGIN: "1" }
  margin:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, ref: "${{ inputs.ref }}" }
      - name: 只改了式样书?
        id: scope
        run: |
          if [ "${{ github.event_name }}" != pull_request ]; then echo "code=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          if git -c core.quotePath=false diff --name-only origin/${{ github.base_ref }}...HEAD | grep -qv '^design/'; then echo "code=1" >> "$GITHUB_OUTPUT"; fi
      - if: steps.scope.outputs.code == '1'
        uses: ./.github/actions/setup
      # 结果缓存(scripts/margincache.py,内容寻址: 工厂 / 生成物 / 式样书一变就不命中)。PR 读得到 main 的缓存,
      # PR 写的缓存只有这个 PR 自己读得到(GitHub 的缓存按分支隔离)
      - if: steps.scope.outputs.code == '1'
        uses: actions/cache/restore@v4
        with:
          path: .factory/margin-cache
          key: margin-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: margin-${{ matrix.shard }}-
      # 分层: PR = 1 个种子(+ 缓存 + 早停);合并到 main(release)/ 每晚(margin-nightly)= 3 个种子(缓存 + 早停)
      - if: steps.scope.outputs.code == '1'
        run: scripts/ci/margin.sh
        env:
          MARGIN_SHARD: "${{ matrix.shard }}/4"
          MARGIN_SEED_COUNT: "${{ github.event_name == 'pull_request' && '1' || '3' }}"
          MARGIN_CACHE_PRUNE: "1"
      - if: always() && steps.scope.outputs.code == '1'
        uses: actions/upload-artifact@v4
        with: { name: "margin-${{ matrix.shard }}", path: .factory/margin.txt, if-no-files-found: ignore, retention-days: 14 }
      - if: always() && steps.scope.outputs.code == '1'
        uses: actions/cache/save@v4
        with:
          path: .factory/margin-cache
          key: margin-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
  api-perf:        # 性能闸门(scripts/perf.sh = make perf): 本仓库 + examples/ 的项目,每表 20 万行 + EXPLAIN,新的 Postgres 容器
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, ref: "${{ inputs.ref }}" }
      - name: 只改了式样书?
        id: scope
        run: |
          if [ "${{ github.event_name }}" != pull_request ]; then echo "code=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          if git -c core.quotePath=false diff --name-only origin/${{ github.base_ref }}...HEAD | grep -qv '^design/'; then echo "code=1" >> "$GITHUB_OUTPUT"; fi
      - if: steps.scope.outputs.code == '1'
        uses: ./.github/actions/setup
      - if: steps.scope.outputs.code == '1'
        run: scripts/perf.sh
