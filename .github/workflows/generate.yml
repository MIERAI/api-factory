# 阶段 2: 式样书合并到 main → 生成代码 → 机器人开生成物的 PR(管理者 review)
# 注意: 用 GITHUB_TOKEN 开的 PR 不会触发别的 workflow(verify 不跑)→ 用 GitHub App / 机器人的令牌(FACTORY_BOT_TOKEN)
name: generate
on:
  push:
    branches: [main]
    paths: ["design/**"]
concurrency: { group: generate, cancel-in-progress: false }
permissions:
  contents: read
jobs:
  generate:
    if: ${{ vars.FACTORY_GENERATE == 'on' }}   # 机器人的令牌(FACTORY_BOT_TOKEN)准备好之后,仓库的 variables 设 FACTORY_GENERATE=on
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.FACTORY_BOT_TOKEN }}
      - uses: ./.github/actions/setup
      - name: AI 命令行(计算 / 自定义的 API 才用)
        run: npm install -g @anthropic-ai/claude-code
      - name: 生成
        env:
          BASE: ${{ github.event.before }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: scripts/ci/generate.sh
      - name: 推送分支 + 开 PR
        env: { GH_TOKEN: "${{ secrets.FACTORY_BOT_TOKEN }}" }
        run: |
          branch=$(cat .factory/gen-branch)
          [ -f .factory/pr-body.md ] || { echo "生成物没有变化"; exit 0; }
          git push origin "$branch"
          gh pr create --base main --head "$branch" --title "factory: 生成 $(git rev-parse --short HEAD~1)" --body-file .factory/pr-body.md
